      var stageLabelMap = { won: "Closed Won", lost: "Closed Lost", open: "Open/In Progress" };
      var stageColorMap = { "Closed Won": PIE_COLORS[0], "Closed Lost": PIE_COLORS[3], "Open/In Progress": PIE_COLORS[2] };
      var stageTotals = aggregateBy(stageAll, function (d) { return stageLabelMap[d.bucket]; }, function (d) { return d.amount; });
      var stageItems = ["Closed Won", "Closed Lost", "Open/In Progress"].filter(function (k) { return stageTotals[k] != null; })
        .map(function (k) { return { label: k, value: stageTotals[k] }; });
      var stageColors = stageItems.map(function (it) { return stageColorMap[it.label]; });

      var confItems = topN(aggregateBy(openDeals, function (d) { return d.confidence; }, function (d) { return d.amount; }), 10);

      var stagePanel =
        '<div class="panel"><div class="panel-header">Deal Amount by Stage<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        '<div class="panel-note">*Includes all deals from the current FY onwards.</div>' +
        (stageItems.length ? renderHBarChart(stageItems, { valueFmt: fmtMoneyAbbrev, colors: stageColors }) : '<div class="panel-note">No data in scope.</div>') +
        "</div></div>";

      var confPanel =
        '<div class="panel"><div class="panel-header">Deals in Pipeline by Confidence<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        '<div class="panel-note">*Includes all deals in pipeline from the current FY onwards.</div>' +
        (confItems.length ? renderHBarChart(confItems, { valueFmt: fmtMoneyAbbrev, colors: PIE_COLORS }) : '<div class="panel-note">No data in scope.</div>') +
        "</div></div>";

      document.getElementById("page-deals").innerHTML =
        '<div class="kpi-row">' + kpiHtml + "</div>" +
        '<div class="panels-grid">' + stagePanel + confPanel + "</div>";
    }

    // ---- Top Accounts Overview page ----
    function renderTopAccountsPage(startYear, opco) {
      var months = fyMonths(startYear);
      var fyKeys = {}; months.forEach(function (d) { fyKeys[monthKey(d)] = true; });
      var fyStartDate = new Date(startYear, 6, 1);

      var openDeals = RAW.deals.filter(function (d) { return matches(d.entity, opco) && d.bucket === "open" && d.closeDate >= fyStartDate; });
      var topPipelineDeals = topN(aggregateBy(openDeals, function (d) { return d.dealName; }, function (d) { return d.amount; }), 10);

      var scopedProjectRows = RAW.projects.filter(function (r) { return matches(r.entity, opco) && fyKeys[monthKey(r.month)]; });
      var topClientsByRevenue = topN(aggregateBy(scopedProjectRows, function (r) { return r.client; }, function (r) { return r.revenue; }), 10);

      var projectSets = {};
      scopedProjectRows.forEach(function (r) {
        if (!projectSets[r.client]) projectSets[r.client] = {};
        projectSets[r.client][r.project] = true;
      });
      var byClientProjects = {};
      Object.keys(projectSets).forEach(function (c) { byClientProjects[c] = Object.keys(projectSets[c]).length; });
      var topClientsByProjects = topN(byClientProjects, 10);

      var pipelinePanel =
        '<div class="panel"><div class="panel-header">Top 10 Deals in Pipeline<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        (topPipelineDeals.length ? renderHBarChart(topPipelineDeals, { valueFmt: fmtMoneyAbbrev, barColor: "#244744" }) : '<div class="panel-note">No data in scope.</div>') +
        "</div></div>";

      var revenuePiePanel =
        '<div class="panel"><div class="panel-header">Top 10 Accounts by Revenue<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        (topClientsByRevenue.length ? renderPieChart(topClientsByRevenue, PIE_COLORS) : '<div class="panel-note">No data in scope.</div>') +
        "</div></div>";

      var projectsPiePanel =
        '<div class="panel"><div class="panel-header">Top 10 Accounts by Projects<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        (topClientsByProjects.length ? renderPieChart(topClientsByProjects, PIE_COLORS, { valueFmt: fmtInt }) : '<div class="panel-note">No data in scope.</div>') +
        "</div></div>";

      document.getElementById("page-accounts").innerHTML =
        '<div class="client-panels">' + pipelinePanel + '<div class="panel-stack">' + revenuePiePanel + projectsPiePanel + "</div></div>";
    }

    // ---- Utilisation Overview page ----
    // Employment Type is a page-local filter (not part of the shared header bar,
    // since it only applies here) — its selection is kept in this module-level
    // variable so it survives the innerHTML rebuild on every re-render.
    var UTIL_EMPLOYMENT_FILTER = "All";
    function renderUtilisationPage(startYear, opco) {
      var months = fyMonths(startYear);
      var elapsed = monthsElapsedInFY(startYear, latestRevenueMonth());
      var scopeMonths = months.slice(0, elapsed);
      var scopeKeys = {}; scopeMonths.forEach(function (d) { scopeKeys[monthKey(d)] = true; });

      var basisSet = {};
      RAW.utilisation.forEach(function (r) { if (matches(r.entity, opco)) basisSet[r.employmentBasis] = true; });
      var basisList = Object.keys(basisSet).sort();

      var rows = RAW.utilisation.filter(function (r) {
        return matches(r.entity, opco) && r.isBillable && scopeKeys[monthKey(r.month)] &&
          (UTIL_EMPLOYMENT_FILTER === "All" || r.employmentBasis === UTIL_EMPLOYMENT_FILTER);
      });

      var avgUtilisation = rows.length ? rows.reduce(function (s, r) { return s + (r.utilisationPct || 0); }, 0) / rows.length : 0;

      var fteByMonth = {};
      rows.forEach(function (r) { var k = monthKey(r.month); fteByMonth[k] = (fteByMonth[k] || 0) + (r.fte || 0); });
      var monthsWithData = Object.keys(fteByMonth).length || 1;
      var billableFTEs = Object.keys(fteByMonth).reduce(function (s, k) { return s + fteByMonth[k]; }, 0) / monthsWithData;

      var rates = rows.map(function (r) { return r.dailyRate; }).filter(function (v) { return v != null && v > 0; });
      var avgDailyRate = rates.length ? rates.reduce(function (s, v) { return s + v; }, 0) / rates.length : 0;

      var totalInvoicedDays = rows.reduce(function (s, r) { return s + (r.invoicedDays || 0); }, 0);
      var distinctUsers = {}; rows.forEach(function (r) { if (r.userId) distinctUsers[r.userId] = true; });
      var userCount = Object.keys(distinctUsers).length;
      var avgBilledDays = userCount ? totalInvoicedDays / userCount : 0;

      var kpiHtml =
        kpiCard("Avg. Utilisation - Current FY", avgUtilisation.toFixed(1) + "%") +
        kpiCard("Billable FTEs", billableFTEs.toFixed(2)) +
        kpiCard("Overall Avg. Daily Rate", fmtMoneyAbbrev(avgDailyRate)) +
        kpiCard("Avg. Billed Days per Employee", avgBilledDays.toFixed(2));

      var utilByMonth = {};
      rows.forEach(function (r) {
        var k = monthKey(r.month);
        if (!utilByMonth[k]) utilByMonth[k] = { sum: 0, n: 0 };
        utilByMonth[k].sum += r.utilisationPct || 0;
        utilByMonth[k].n += 1;
      });
      var xLabels = months.map(monthLabel);
      var utilValues = months.map(function (d) { var e = utilByMonth[monthKey(d)]; return e ? (e.sum / e.n) : null; });

      // Targets are keyed by Grade + FY, not month, so this is a flat (grade-averaged)
      // reference line rather than a true monthly target trend.
      var fyLbl = fyLabel(startYear);
      var targetsForFY = RAW.targetRates.filter(function (t) { return t.fy === fyLbl && t.utilisationTarget != null; });
      var flatTarget = targetsForFY.length ? targetsForFY.reduce(function (s, t) { return s + t.utilisationTarget; }, 0) / targetsForFY.length : null;
      var targetValues = months.map(function () { return flatTarget; });

      var leaveByMonth = {};
      RAW.utilisation.forEach(function (r) {
        if (!matches(r.entity, opco) || (UTIL_EMPLOYMENT_FILTER !== "All" && r.employmentBasis !== UTIL_EMPLOYMENT_FILTER)) return;
        if (!scopeKeys[monthKey(r.month)]) return;
        var k = monthKey(r.month);
        leaveByMonth[k] = (leaveByMonth[k] || 0) + (r.leaveDays || 0);
      });
      var leaveValues = months.map(function (d) { return leaveByMonth[monthKey(d)] || 0; });

      var filterHtml =
        '<div class="page-filter"><label>Employment Type</label><select id="util-employment-select">' +
        '<option value="All"' + (UTIL_EMPLOYMENT_FILTER === "All" ? " selected" : "") + '>All</option>' +
        basisList.map(function (b) { return '<option value="' + escapeHtml(b) + '"' + (UTIL_EMPLOYMENT_FILTER === b ? " selected" : "") + '>' + escapeHtml(b) + '</option>'; }).join("") +
        "</select></div>";

      var utilPanel =
        '<div class="panel"><div class="panel-header">Billable Utilisation by Month<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        renderBarWithTarget(utilValues, targetValues, xLabels, {
          yFmt: function (v) { return Math.round(v) + "%"; }, barColor: "#244744", targetColor: "#bfe0cd",
          seriesLabel: "Utilisation", targetLabel: "Utilisation Target",
        }) +
        '<div class="legend">' +
        '<span class="legend-item"><span class="legend-swatch" style="background:#14201c"></span>Billable Utilisation</span>' +
        (flatTarget != null ? '<span class="legend-item"><span class="legend-dash" style="background:#bfe0cd"></span>Utilisation Target (avg across grades)</span>' : "") +
        "</div></div></div>";

      var leavePanel =
        '<div class="panel"><div class="panel-header">Leave Days by Month<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        renderLineChart(leaveValues, xLabels, { lineColor: "#244744" }) +
        "</div></div>";

      document.getElementById("page-utilisation").innerHTML =
        filterHtml + '<div class="kpi-row">' + kpiHtml + "</div>" +
        '<div class="panels-grid">' + utilPanel + leavePanel + "</div>";

      var sel = document.getElementById("util-employment-select");
      sel.addEventListener("change", function () {
        UTIL_EMPLOYMENT_FILTER = sel.value;
        renderUtilisationPage(effectiveFYStartYear(), currentOpco());
      });
    }

    // ---- Microsoft Certifications page ----
    // data_certifications has no OpCo/entity column, so this page ignores the
    // shared header filters entirely — there's nothing to filter it by.
    function renderCertificationsPage() {
      var today = new Date();
      var activeCerts = RAW.certifications.filter(function (c) { return !c.expirationDate || c.expirationDate >= today; });

      var typeSet = {}; activeCerts.forEach(function (c) { typeSet[c.title] = true; });
      var activeTypes = Object.keys(typeSet).length;

      var userSet = {}; activeCerts.forEach(function (c) { if (c.userId) userSet[c.userId] = true; });
      var activeEmployees = Object.keys(userSet).length;

      var byTitle = {};
      activeCerts.forEach(function (c) {
        if (!byTitle[c.title]) byTitle[c.title] = {};
        if (c.userId) byTitle[c.title][c.userId] = true;
      });
      var titleItems = Object.keys(byTitle).map(function (t) { return { label: t, value: Object.keys(byTitle[t]).length }; })
        .sort(function (a, b) { return b.value - a.value; }).slice(0, 15);

      var completionMonths = monthsRangeSimple(RAW.certifications.map(function (c) { return c.completionDate; }).filter(Boolean));
      var completedByMonth = {};
      RAW.certifications.forEach(function (c) { if (c.completionDate) { var k = monthKey(c.completionDate); completedByMonth[k] = (completedByMonth[k] || 0) + 1; } });
      var completedLabels = completionMonths.map(monthLabel);
      var completedValues = completionMonths.map(function (d) { return completedByMonth[monthKey(d)] || 0; });

      var expiryMonths = monthsRangeSimple(RAW.certifications.map(function (c) { return c.expirationDate; }).filter(Boolean));
      var expiringByMonth = {};
      RAW.certifications.forEach(function (c) { if (c.expirationDate) { var k = monthKey(c.expirationDate); expiringByMonth[k] = (expiringByMonth[k] || 0) + 1; } });
      var expiryLabels = expiryMonths.map(monthLabel);
      var expiryValues = expiryMonths.map(function (d) { return expiringByMonth[monthKey(d)] || 0; });

      var kpiHtml =
        kpiCard("Active Certification Types", fmtInt(activeTypes)) +
        kpiCard("Active Certified Employees", fmtInt(activeEmployees));

      var typesPanel =
        '<div class="panel"><div class="panel-header">Active Certification by Types<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        (titleItems.length ? renderHBarChart(titleItems, { valueFmt: fmtInt, barColor: "#244744" }) : '<div class="panel-note">No data in scope.</div>') +
        "</div></div>";

      var completedPanel =
        '<div class="panel"><div class="panel-header">Certifications Completed by Month<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        (completedValues.length ? renderBarChart(completedValues, completedLabels, { barColor: "#244744", yFmt: function (v) { return Math.round(v); } }) : '<div class="panel-note">No data in scope.</div>') +
        "</div></div>";

      var expiringPanel =
        '<div class="panel"><div class="panel-header">Expiring Certifications by Month<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        (expiryValues.length ? renderBarChart(expiryValues, expiryLabels, { barColor: "#cadacb", yFmt: function (v) { return Math.round(v); } }) : '<div class="panel-note">No data in scope.</div>') +
        "</div></div>";

      document.getElementById("page-certifications").innerHTML =
        '<div class="kpi-row">' + kpiHtml + "</div>" +
        '<div class="client-panels"><div class="panel-stack">' + typesPanel + "</div><div class=\"panel-stack\">" + completedPanel + expiringPanel + "</div></div>";
    }

    function render() {
      var opco = currentOpco();
      var startYear = effectiveFYStartYear();
      var allFY = isAllFY();
      renderSummaryPage(startYear, opco);
      renderClientsPage(startYear, opco, allFY);
      renderRevenuePage(startYear, opco);
      renderDealsPage(opco);
      renderTopAccountsPage(startYear, opco);
      renderUtilisationPage(startYear, opco);
      renderCertificationsPage();

      var earliestMonth = RAW.revenue.reduce(function (min, r) { return (!min || r.month < min) ? r.month : min; }, null);
      var latestMonth = latestRevenueMonth();
      document.getElementById("footnote").textContent = earliestMonth
        ? "Note: Data is available from " + monthLabel(earliestMonth) + " until the latest completed month (" + monthLabel(latestMonth) + ")."
        : "";
    }

    document.querySelectorAll(".tab-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".tab-btn").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        document.querySelectorAll(".page").forEach(function (p) { p.classList.remove("active"); });
        document.getElementById("page-" + btn.dataset.page).classList.add("active");
      });
    });

    async function loadReport(token) {
      document.getElementById("placeholder").classList.add("hidden");
      var app = document.getElementById("app");
      app.classList.add("visible");
      document.getElementById("page-summary").innerHTML = '<div class="panel"><div class="panel-body">Loading data from the semantic model…</div></div>';
      var results = await executeDaxQueries(token, [
        Q_REVENUE_TARGET, Q_PROJECT_FACT, Q_DEALS, Q_UTILISATION, Q_CERTIFICATIONS, Q_TARGET_DAILY_RATE,
      ]);
      RAW.revenue = parseRevenueRows(results[0]);
      RAW.projects = parseProjectRows(results[1]);
      RAW.deals = parseDealRows(results[2]);
      RAW.utilisation = parseUtilisationRows(results[3]);
      RAW.certifications = parseCertRows(results[4]);
      RAW.targetRates = parseTargetRateRows(results[5]);
      populateFilters();
      render();
      document.getElementById("feedback-fab").classList.add("visible");
    }

    function showAccessDenied(email) {
      var placeholder = document.getElementById("placeholder");
      placeholder.innerHTML = "<div>" + escapeHtml(email) + " isn't on the access list for this dashboard yet.<br>Ask an admin to add you via Manage Access.</div>";
      placeholder.classList.remove("hidden");
      document.getElementById("app").classList.remove("visible");
    }

    // Checks the access allowlist (Graph token is separate from the Power BI
    // one already acquired for `powerBiToken`), then either loads the report
    // or shows the access-denied placeholder instead. Shared by the manual
    // sign-in button and the silent auto-sign-in attempt below.
    async function gateAccessAndLoad(account, powerBiToken) {
      var access;
      try {
        var graphToken = await getFeedbackGraphToken();
        access = await checkAccess(graphToken, feedbackWorkbookBasePath(), account.username);
      } catch (e) {
        showError("Could not verify dashboard access: " + (e && e.message ? e.message : e));
        return;
      }
      if (!access.allowed) {
        showAccessDenied(account.username);
        return;
      }
      CURRENT_SESSION.email = account.username;
      CURRENT_SESSION.role = access.role;
      document.getElementById("manage-access-btn").style.display = access.role === "admin" ? "inline-block" : "none";
      await loadReport(powerBiToken);
    }

    // ---- Manage access modal wiring ----
    (function () {
      var btn = document.getElementById("manage-access-btn");
      var overlay = document.getElementById("access-modal-overlay");
      var listEl = document.getElementById("access-list");
      var emailInput = document.getElementById("access-add-email");
      var roleSelect = document.getElementById("access-add-role");
      var status = document.getElementById("access-status");
      var saveBtn = document.getElementById("access-save-btn");

      function renderRows(rows) {
        if (!rows.length) {
          listEl.innerHTML = '<div style="font-size:12.5px; color:#8a938d;">No one added yet — you (as a bootstrap admin) are still the only one who can sign in.</div>';
          return;
        }
        listEl.innerHTML = rows.map(function (r) {
          var isSelf = r.email === (CURRENT_SESSION.email || "").toLowerCase();
          var actionBtn = r.status === "active"
            ? (isSelf ? '<span style="font-size:11px; color:#8a938d;">(you)</span>' : '<button class="feedback-btn feedback-btn-ghost" data-deactivate="' + escapeHtml(r.email) + '" style="padding:4px 10px; font-size:11px;">Deactivate</button>')
            : '<span style="font-size:11px; color:#8a938d;">Deactivated</span>';
          return '<div class="access-row"><div>' + escapeHtml(r.email) + '</div>' +
            '<div style="display:flex; align-items:center; gap:8px;">' +
            '<span class="access-role-chip' + (r.role === "admin" ? " admin" : "") + '">' + escapeHtml(r.role) + '</span>' +
            actionBtn + '</div></div>';
        }).join("");
      }

      async function refreshList() {
        listEl.innerHTML = '<div style="font-size:12.5px; color:#8a938d;">Loading…</div>';
        var token = await getFeedbackGraphToken();
        var basePath = feedbackWorkbookBasePath();
        await ensureAccessUsersTable(token, basePath);
        var rows = await fetchAccessUsersRows(token, basePath);
        renderRows(rows);
      }

      function openModal() {
        emailInput.value = "";
        roleSelect.value = "user";
        status.textContent = "";
        status.className = "feedback-status";
        overlay.classList.add("open");
        refreshList().catch(function (e) {
          listEl.innerHTML = '<div class="feedback-status error">' + escapeHtml(e && e.message ? e.message : String(e)) + "</div>";
        });
      }
      function closeModal() { overlay.classList.remove("open"); }

      btn.addEventListener("click", openModal);
      document.getElementById("access-close-btn").addEventListener("click", closeModal);
      document.getElementById("access-close-btn-2").addEventListener("click", closeModal);
      overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });

      saveBtn.addEventListener("click", async function () {
        var email = emailInput.value.trim();
        if (!email) {
          status.textContent = "Enter an email first.";
          status.className = "feedback-status error";
          return;
        }
        saveBtn.disabled = true;
        status.textContent = "";
        status.className = "feedback-status";
        try {
          var token = await getFeedbackGraphToken();
          var basePath = feedbackWorkbookBasePath();
          await upsertAccessUser(token, basePath, email, roleSelect.value, CURRENT_SESSION.email);
          emailInput.value = "";
          status.textContent = "Added to the app's access list.";
          status.className = "feedback-status ok";
          await refreshList();

          // Also grant real Power BI workspace access (Viewer) — the
          // AccessUsers entry above only gates this app's own UI, it
          // doesn't give them any actual data access on its own. Best-effort:
          // requires the current user to already be a Power BI workspace
          // admin themselves, so a failure here shouldn't undo the
          // already-saved AccessUsers entry.
          try {
            var pbiToken = await getToken(true);
            await addUserToPowerBiWorkspace(pbiToken, email);
            status.textContent = "Added to the app's access list and the Power BI workspace (Viewer).";
          } catch (pbiErr) {
            status.textContent = "Added to the app's access list, but could not add to the Power BI workspace: " +
              (pbiErr && pbiErr.message ? pbiErr.message : String(pbiErr)) +
              ". They may need to be added there separately (e.g. if you're not a workspace admin, or they already have access).";
            status.className = "feedback-status error";
          }
        } catch (e) {
          status.textContent = (e && e.message) ? e.message : String(e);
          status.className = "feedback-status error";
        } finally {
          saveBtn.disabled = false;
        }
      });

      listEl.addEventListener("click", async function (e) {
        var target = e.target.closest("[data-deactivate]");
        if (!target) return;
        var email = target.getAttribute("data-deactivate");
        target.disabled = true;
        target.textContent = "Deactivating…";
        status.textContent = "";
        status.className = "feedback-status";
        try {
          var token = await getFeedbackGraphToken();
          var basePath = feedbackWorkbookBasePath();
          await deactivateAccessUser(token, basePath, email);
          status.textContent = "Removed from the app's access list.";
          status.className = "feedback-status ok";
          await refreshList();

          // Mirrors the "Add" flow: also revoke real Power BI workspace
          // access, not just this app's own gate. Best-effort, same caveat
          // as Add — requires the caller to already be a workspace admin.
          try {
            var pbiToken = await getToken(true);
            await removeUserFromPowerBiWorkspace(pbiToken, email);
            status.textContent = "Removed from the app's access list and the Power BI workspace.";
          } catch (pbiErr) {
            status.textContent = "Removed from the app's access list, but could not remove from the Power BI workspace: " +
              (pbiErr && pbiErr.message ? pbiErr.message : String(pbiErr)) +
              ". They may still have real data access there until removed manually.";
            status.className = "feedback-status error";
          }
        } catch (e2) {
          status.textContent = (e2 && e2.message) ? e2.message : String(e2);
          status.className = "feedback-status error";
        }
      });
    })();

    // ---- Feedback modal wiring ----
    (function () {
      var fab = document.getElementById("feedback-fab");
      var overlay = document.getElementById("feedback-modal-overlay");
      var textarea = document.getElementById("feedback-message");
      var status = document.getElementById("feedback-status");
      var sendBtn = document.getElementById("feedback-send-btn");

      function openModal() {
        textarea.value = "";
        status.textContent = "";
        status.className = "feedback-status";
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
        overlay.classList.add("open");
        textarea.focus();
      }
      function closeModal() { overlay.classList.remove("open"); }

      fab.addEventListener("click", openModal);
      document.getElementById("feedback-close-btn").addEventListener("click", closeModal);
      document.getElementById("feedback-cancel-btn").addEventListener("click", closeModal);
      overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });

      sendBtn.addEventListener("click", async function () {
        var message = textarea.value.trim();
        if (!message) {
          status.textContent = "Enter a message first.";
          status.className = "feedback-status error";
          return;
        }
        sendBtn.disabled = true;
        sendBtn.textContent = "Sending…";
        status.textContent = "";
        status.className = "feedback-status";
        try {
          await submitFeedbackRow(message);
          status.textContent = "Thanks — feedback saved.";
          status.className = "feedback-status ok";
          sendBtn.textContent = "Sent";
          setTimeout(closeModal, 1200);
        } catch (e) {
          status.textContent = (e && e.message) ? e.message : String(e);
          status.className = "feedback-status error";
          sendBtn.disabled = false;
          sendBtn.textContent = "Send";
        }
      });
    })();

    async function signIn() {
      try {
        var token = await getToken(true);
        var account = msalApp.getAllAccounts()[0];
        setSignedInUi(account);
        await gateAccessAndLoad(account, token);
      } catch (e) {
        showError("Sign-in or data load failed: " + (e && e.message ? e.message : e));
      }
    }

    document.getElementById("signin-btn").addEventListener("click", signIn);

    (async function () {
      await msalReady;
      var accounts = msalApp.getAllAccounts();
      if (accounts.length) {
        setSignedInUi(accounts[0]);
        try {
          var token = await getToken(false);
          await gateAccessAndLoad(accounts[0], token);
        } catch (e) { /* fall through to manual sign-in button */ }
      }
    })();
  </script>
</body>
</html>
