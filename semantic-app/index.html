<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omnia Reporting — Exec Summary</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #f4f4f2; color: #1a1a18;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 24px; background: #14201c; color: #eef4f0;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    flex: 0 0 auto; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header .sub { font-size: 12px; color: #9db3ab; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .header-filters { display: flex; align-items: center; gap: 16px; }
  .filter-group { display: flex; flex-direction: column; gap: 3px; }
  .filter-group label { font-size: 10px; color: #9db3ab; text-transform: uppercase; letter-spacing: .04em; }
  .filter-group select {
    background: #1c2b25; color: #eef4f0; border: 1px solid #35493f; border-radius: 6px;
    padding: 6px 10px; font-size: 13px; min-width: 140px;
  }
  .header-filters.hidden { display: none; }
  #signin-btn {
    background: #2f7a63; color: #fff; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  #signin-btn:hover { background: #35906f; }
  #signin-btn:disabled { cursor: default; opacity: .85; }
  #manage-access-btn {
    background: transparent; color: #eef4f0; border: 1px solid #35493f; border-radius: 6px;
    padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  #manage-access-btn:hover { background: #1c2b25; }
  .access-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid #eceeec; font-size: 13px;
  }
  .access-row:last-child { border-bottom: none; }
  .access-role-chip {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    text-transform: uppercase; background: #eaf3ee; color: #14201c; flex-shrink: 0;
  }
  .access-role-chip.admin { background: #14201c; color: #fff; }

  #stage { flex: 1 1 auto; position: relative; overflow: auto; }
  #placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; color: #55605a; text-align: center; padding: 24px;
  }
  #placeholder.hidden { display: none; }
  #error-box {
    display: none; margin: 16px 24px; padding: 12px 16px; border-radius: 8px;
    background: #fbe4e1; color: #7a2a20; font-size: 13px; white-space: pre-wrap;
  }

  #app { display: none; }
  #app.visible { display: block; }

  .tabs { display: flex; gap: 4px; padding: 0 24px; background: #0e1a15; flex: 0 0 auto; overflow-x: auto; }
  .tab-btn {
    background: transparent; border: none; color: #9db3ab; padding: 12px 16px; font-size: 13px;
    font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; flex: 0 0 auto; white-space: nowrap;
  }
  .tab-btn:hover { color: #eef4f0; }
  .tab-btn.active { color: #fff; border-bottom-color: #2f7a63; }

  .page { display: none; padding: 20px 24px 4px; max-width: min(2400px, 96vw); width: 100%; box-sizing: border-box; margin: 0 auto; }
  .page.active { display: block; }
  #footnote { max-width: min(2400px, 96vw); margin: 0 auto 20px; padding: 0 24px; font-size: 11px; font-style: italic; color: #8a938d; box-sizing: border-box; }

  .summary-grid { display: grid; grid-template-columns: 230px 1fr; gap: 20px; align-items: start; }
  .kpi-sidebar { display: flex; flex-direction: column; gap: 14px; }
  .kpi-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .kpi-row .kpi-card { flex: 1 1 200px; }

  .kpi-card {
    background: #eaf3ee; border-radius: 10px; padding: 16px 18px;
    box-shadow: 0 1px 2px rgba(1,67,72,.08); text-align: center;
  }
  .kpi-card .label { font-size: 11px; color: #55655d; text-transform: uppercase; letter-spacing: .04em; }
  .kpi-card .value { font-size: 26px; font-weight: 700; margin-top: 4px; color: #14201c; }
  .kpi-card .delta { font-size: 12px; margin-top: 4px; font-weight: 600; }
  .kpi-card .delta.up { color: #2f7a63; }
  .kpi-card .delta.down { color: #c0392b; }
  .kpi-card .subtext { font-size: 12px; margin-top: 4px; font-weight: 600; color: #2f7a63; }
  .kpi-card--primary { background: #14201c; }
  .kpi-card--primary .label { color: #9db3ab; }
  .kpi-card--primary .value { color: #fff; }
  .kpi-card--primary .delta.up { color: #8fe0b8; }
  .kpi-card--primary .delta.down { color: #ffb4a8; }
  .kpi-card--combo { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .kpi-card--combo .combo-item { flex: 1 1 auto; text-align: center; }
  .kpi-card--combo .combo-divider { width: 1px; align-self: stretch; background: #c8d6cd; }

  .panels-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .client-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .panel-stack { display: flex; flex-direction: column; gap: 20px; }
  .panel { border-radius: 10px; overflow: hidden; box-shadow: 0 1px 2px rgba(1,67,72,.08); background: #fff; }
  .panel-header {
    background: #14201c; color: #eef4f0; padding: 10px 16px; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-header .chevron { opacity: .6; font-size: 11px; }
  .panel-body { padding: 14px 16px 18px; }
  .panel-note { font-size: 11px; font-style: italic; color: #6b756f; margin-bottom: 8px; }
  .page-filter { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .page-filter label { font-size: 11px; color: #55655d; text-transform: uppercase; letter-spacing: .04em; }
  .page-filter select { padding: 6px 10px; border-radius: 6px; border: 1px solid #c8d6cd; font-size: 13px; background: #fff; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #434343; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: 0 0 auto; }
  .legend-swatch--dot { border-radius: 50%; }
  .legend-dash { width: 12px; height: 2px; display: inline-block; }

  svg.chart { width: 100%; height: auto; display: block; }
  .axis-label { font-size: 12px; fill: #8a938d; }
  .gridline { stroke: #eceeec; stroke-width: 1; }
  svg.chart rect[data-tip-title], svg.chart path[data-tip-title] { cursor: pointer; }
  svg.chart rect[data-tip-title]:hover, svg.chart path[data-tip-title]:hover { opacity: .85; }

  .chart-tooltip {
    display: none; position: fixed; z-index: 1000; pointer-events: none;
    background: #14201c; color: #eef4f0; border-radius: 8px; padding: 8px 12px;
    font-size: 12px; max-width: 240px; box-shadow: 0 6px 16px rgba(0,0,0,.28);
  }
  .chart-tooltip .tooltip-title { font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .chart-tooltip .tooltip-swatch { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: 0 0 auto; }
  .chart-tooltip .tooltip-detail { margin-top: 2px; color: #b9cbc2; }

  @media (max-width: 900px) {
    .summary-grid { grid-template-columns: 1fr; }
    .panels-grid { grid-template-columns: 1fr; }
    .client-panels { grid-template-columns: 1fr; }
  }

  .feedback-fab {
    position: fixed; bottom: 24px; left: 24px; width: 50px; height: 50px; border-radius: 50%;
    background: #14201c; color: #eef4f0; border: none; cursor: pointer; font-size: 20px;
    box-shadow: 0 6px 16px rgba(0,0,0,.28); z-index: 500; display: none; align-items: center; justify-content: center;
  }
  .feedback-fab.visible { display: flex; }
  .feedback-fab:hover { background: #1c2b25; }
  .feedback-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(20,32,28,.55); z-index: 600;
    align-items: center; justify-content: center; padding: 20px;
  }
  .feedback-modal-overlay.open { display: flex; }
  .feedback-modal { background: #fff; border-radius: 10px; width: 100%; max-width: 440px; box-shadow: 0 16px 40px rgba(0,0,0,.3); overflow: hidden; }
  .feedback-modal-head { background: #14201c; color: #eef4f0; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
  .feedback-modal-head h3 { margin: 0; font-size: 14px; font-weight: 700; }
  .feedback-modal-close { background: transparent; border: none; color: #9db3ab; font-size: 16px; cursor: pointer; }
  .feedback-modal-body { padding: 16px 18px; }
  .feedback-modal-body textarea {
    width: 100%; min-height: 110px; padding: 10px 12px; border: 1px solid #c8d6cd; border-radius: 8px;
    font: 13px inherit; box-sizing: border-box; resize: vertical;
  }
  .feedback-status { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .feedback-status.error { color: #c0392b; }
  .feedback-status.ok { color: #2f7a63; }
  .feedback-modal-foot { padding: 12px 18px; background: #f4f4f2; display: flex; justify-content: flex-end; gap: 8px; }
  .feedback-btn { padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 700; cursor: pointer; border: none; }
  .feedback-btn-ghost { background: #e4e9e6; color: #14201c; }
  .feedback-btn-primary { background: #2f7a63; color: #fff; }
  .feedback-btn-primary:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1 id="page-title">Omnia Reporting</h1>
      <div class="sub">Semantic model demo — queried directly, not embedded</div>
    </div>
    <div class="header-right">
      <div class="header-filters hidden">
        <div class="filter-group">
          <label>Financial Year</label>
          <select id="fy-select"></select>
        </div>
        <div class="filter-group">
          <label>OpCo</label>
          <select id="opco-select"></select>
        </div>
      </div>
      <button id="manage-access-btn" style="display:none;" title="Manage who can view this dashboard">Manage access</button>
      <button id="signin-btn">Sign in to view</button>
    </div>
  </header>
  <div id="error-box"></div>
  <div id="chart-tooltip" class="chart-tooltip"></div>

  <button id="feedback-fab" class="feedback-fab" title="Send feedback">&#128172;</button>
  <div id="feedback-modal-overlay" class="feedback-modal-overlay">
    <div class="feedback-modal">
      <div class="feedback-modal-head">
        <h3>Send feedback</h3>
        <button class="feedback-modal-close" id="feedback-close-btn">&#10005;</button>
      </div>
      <div class="feedback-modal-body">
        <textarea id="feedback-message" placeholder="What's on your mind?"></textarea>
        <div id="feedback-status" class="feedback-status"></div>
      </div>
      <div class="feedback-modal-foot">
        <button class="feedback-btn feedback-btn-ghost" id="feedback-cancel-btn">Cancel</button>
        <button class="feedback-btn feedback-btn-primary" id="feedback-send-btn">Send</button>
      </div>
    </div>
  </div>

  <div id="access-modal-overlay" class="feedback-modal-overlay">
    <div class="feedback-modal" style="max-width:480px;">
      <div class="feedback-modal-head">
        <h3>Manage access</h3>
        <button class="feedback-modal-close" id="access-close-btn">&#10005;</button>
      </div>
      <div class="feedback-modal-body">
        <div style="font-size:11.5px; color:#6b756f; margin-bottom:10px;">Controls who can sign in and view this dashboard at all.</div>
        <div id="access-list"></div>
        <div style="margin-top:16px; padding-top:14px; border-top:1px solid #eceeec;">
          <label style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#55655d; display:block; margin-bottom:6px;">Add / update person — email</label>
          <input type="email" id="access-add-email" placeholder="name@edgered.com.au"
            style="width:100%; padding:8px 10px; border:1px solid #c8d6cd; border-radius:6px; margin-bottom:10px; box-sizing:border-box; font-size:13px;">
          <label style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#55655d; display:block; margin-bottom:6px;">Role</label>
          <select id="access-add-role" style="width:100%; padding:8px 10px; border:1px solid #c8d6cd; border-radius:6px; font-size:13px;">
            <option value="user">user — can view</option>
            <option value="admin">admin — can also manage access</option>
          </select>
          <div id="access-status" class="feedback-status"></div>
        </div>
      </div>
      <div class="feedback-modal-foot">
        <button class="feedback-btn feedback-btn-ghost" id="access-close-btn-2">Close</button>
        <button class="feedback-btn feedback-btn-primary" id="access-save-btn">Add / Update</button>
      </div>
    </div>
  </div>

  <div id="stage">
    <div id="placeholder">
      <div>Sign in with your EdgeRed account to load the report.</div>
    </div>
    <div id="app">
      <div class="tabs">
        <button class="tab-btn active" data-page="summary">Summary</button>
        <button class="tab-btn" data-page="clients">Client Overview</button>
        <button class="tab-btn" data-page="revenue">Revenue Overview</button>
        <button class="tab-btn" data-page="deals">Deals Overview</button>
        <button class="tab-btn" data-page="accounts">Top Accounts</button>
        <button class="tab-btn" data-page="utilisation">Utilisation Overview</button>
        <button class="tab-btn" data-page="certifications">Certifications</button>
      </div>
      <div id="page-summary" class="page active"></div>
      <div id="page-clients" class="page"></div>
      <div id="page-revenue" class="page"></div>
      <div id="page-deals" class="page"></div>
      <div id="page-accounts" class="page"></div>
      <div id="page-utilisation" class="page"></div>
      <div id="page-certifications" class="page"></div>
      <div id="footnote"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.20.0/lib/msal-browser.min.js"></script>
  <script>
    // ---- Fixed config for this demo ----
    var TENANT_ID = "dc65b585-fcd8-46a4-a44e-e7e871a725be"; // edgered.com.au
    var CLIENT_ID = "48ca88b2-1fff-427d-b801-8e4593ebafba"; // shared app registration (embed-app / semantic-app)
    var WORKSPACE_ID = "bbbd2ec3-1085-4a2c-af8a-a0f82fa49f76";
    var DATASET_ID = "8c11a7f7-0992-4591-b51a-50889e641617"; // "Omnia Reporting Demo" semantic model
    var POWERBI_SCOPE = "https://analysis.windows.net/powerbi/api/Dataset.Read.All";
    // Workspace.ReadWrite.All is bundled in alongside Dataset.Read.All (same
    // resource, one token request/consent) so the Manage Access panel can
    // also add someone to the Power BI workspace itself, not just the app's
    // own AccessUsers list — see addUserToPowerBiWorkspace() below. Whoever
    // clicks "Add" still needs to already be a Power BI workspace admin
    // themselves; Power BI enforces that server-side regardless of scope.
    var POWERBI_SCOPES = [POWERBI_SCOPE, "https://analysis.windows.net/powerbi/api/Workspace.ReadWrite.All"];

    // Feedback writes to a dedicated Excel workbook via Microsoft Graph — a
    // separate concern from the Power BI dataset query above, since it needs
    // Graph's Files.ReadWrite scope (not Dataset.Read.All) and a real Excel
    // file to write into. Addressed by driveId+itemId (resolved once via the
    // Graph shares API — see project notes) rather than by the sharing link
    // itself: the link grants edit access to whoever holds it, so embedding
    // it directly in this client-side page would leak an editable link to
    // anyone who views the page source. driveId/itemId are just identifiers —
    // Graph still enforces access based on the signed-in caller's own
    // permission on the item, so these are safe to ship. The app registration
    // (CLIENT_ID above) needs the Files.ReadWrite(.All) delegated Graph
    // permission added and consented, and the target file needs to actually
    // be shared (normal SharePoint/OneDrive permissions) with whoever should
    // be able to submit feedback.
    var FEEDBACK_DRIVE_ID = "b!nxzo85sDP0SbRvi-9_y_KVyL_Ahv4PJPifSrs1JXiuHYUPJ6ZuClQJmQ-gq4ilWE";
    var FEEDBACK_ITEM_ID = "01MFUWM2QFPLMV4GOQBNCZP5ZXH6WOPKVV";
    // Mail.Send added alongside Files.ReadWrite so the same token covers both
    // saving the row and sending the notification email — one token request,
    // one consent prompt. Requested as an array since MSAL happily bundles
    // multiple delegated scopes for the same resource (Graph) into one call.
    var FEEDBACK_GRAPH_SCOPES = ["https://graph.microsoft.com/Files.ReadWrite", "https://graph.microsoft.com/Mail.Send"];
    var FEEDBACK_SHEET_NAME = "Feedback";
    var FEEDBACK_TABLE_NAME = "FeedbackTable";
    var FEEDBACK_NOTIFY_EMAIL = "natalie@edgered.com.au";
    var feedbackConfigured = !!(FEEDBACK_DRIVE_ID && FEEDBACK_ITEM_ID);

    // ---- Access allowlist (who may sign in and view this dashboard) ----
    // Stored as a second table in the same workbook as feedback — no new
    // Graph permission needed, since Files.ReadWrite.All already covers it.
    // BOOTSTRAP_ADMIN_EMAILS always pass the check regardless of what's in
    // the sheet (even if the sheet is empty, missing, or unreachable) — this
    // is what prevents a chicken-and-egg lockout on first use, mirroring the
    // Apps Script version's ADMIN_EMAIL/seedInitialAccessUsers() pattern.
    // Bootstrap admins use the Manage Access panel to add everyone else.
    var BOOTSTRAP_ADMIN_EMAILS = ["natalie@edgered.com.au", "wil@edgered.com.au", "nathan@edgered.com.au"];
    var ACCESS_SHEET_NAME = "AccessUsers";
    var ACCESS_TABLE_NAME = "AccessUsersTable";

    var PIE_COLORS = ["#14201c", "#7c8f89", "#3d7373", "#bfe0cd", "#2f7a63", "#a9c9b8"];

    // ---- DAX queries ----
    // Revenue vs. target: one row per entity/month, both actual and target in the same table.
    var Q_REVENUE_TARGET =
      "EVALUATE\n" +
      "SUMMARIZECOLUMNS(\n" +
      "    data_revenue_target[month_date],\n" +
      "    data_revenue_target[entity],\n" +
      "    \"Revenue\", SUM(data_revenue_target[total_revenue]),\n" +
      "    \"RevenueTarget\", SUM(data_revenue_target[revenue_target])\n" +
      ")\n" +
      "ORDER BY data_revenue_target[month_date]";

    // Project/client/industry/stream revenue mix all come from this one fact table,
    // so a single richer query covers every breakdown used across the three pages.
    var Q_PROJECT_FACT =
      "EVALUATE\n" +
      "SUMMARIZECOLUMNS(\n" +
      "    data_powerbi_unified_fact[month_date],\n" +
      "    data_powerbi_unified_fact[entity],\n" +
      "    data_powerbi_unified_fact[client_name],\n" +
      "    data_powerbi_unified_fact[client_industry],\n" +
      "    data_powerbi_unified_fact[Project_Name],\n" +
      "    data_powerbi_unified_fact[project_stream],\n" +
      "    \"TotalRevenue\", SUM(data_powerbi_unified_fact[total_revenue])\n" +
      ")\n" +
      "ORDER BY data_powerbi_unified_fact[month_date]";

    // Deal-level rows: pipeline, win rate, deal size and new-client KPIs are all derived
    // client-side from this, since none of them are pre-aggregated in the model.
    var Q_DEALS =
      "EVALUATE\n" +
      "SELECTCOLUMNS(\n" +
      "    data_hubspot_deals,\n" +
      "    \"Company\", data_hubspot_deals[Company],\n" +
      "    \"OmniaCompany\", data_hubspot_deals[Omnia_Company],\n" +
      "    \"DealName\", data_hubspot_deals[Deal_Name],\n" +
      "    \"DealStage\", data_hubspot_deals[Deal_Stage],\n" +
      "    \"Confidence\", data_hubspot_deals[Confidence],\n" +
      "    \"CloseDate\", data_hubspot_deals[Close_Date],\n" +
      "    \"Amount\", data_hubspot_deals[Amount]\n" +
      ")";

    // Row-level utilisation: KPIs need distinct-user and monthly-average math that
    // isn't a simple SUM, so this pulls raw rows rather than pre-aggregating.
    var Q_UTILISATION =
      "EVALUATE\n" +
      "SELECTCOLUMNS(\n" +
      "    data_utilisation,\n" +
      "    \"Month\", data_utilisation[Month],\n" +
      "    \"Entity\", data_utilisation[Omnia_Company],\n" +
      "    \"EmploymentBasis\", data_utilisation[employment_basis],\n" +
      "    \"IsBillable\", data_utilisation[is_billable_staff],\n" +
      "    \"FTE\", data_utilisation[FTE],\n" +
      "    \"DailyRate\", data_utilisation[daily_rate],\n" +
      "    \"InvoicedDays\", data_utilisation[invoiced_days],\n" +
      "    \"LeaveDays\", data_utilisation[leave_days],\n" +
      "    \"UtilisationPct\", data_utilisation[utilisation_pct],\n" +
      "    \"UserId\", data_utilisation[userId]\n" +
      ")";

    // This table has no OpCo/entity column, so the Certifications page ignores
    // the OpCo filter entirely (there's nothing to filter it by).
    var Q_CERTIFICATIONS =
      "EVALUATE\n" +
      "SELECTCOLUMNS(\n" +
      "    data_certifications,\n" +
      "    \"UserId\", data_certifications[AADUserId],\n" +
      "    \"Title\", data_certifications[TrainingTitle],\n" +
      "    \"Status\", data_certifications[ActivationStatus],\n" +
      "    \"CompletionDate\", data_certifications[TrainingCompletionDate],\n" +
      "    \"ExpirationDate\", data_certifications[ExpirationDate]\n" +
      ")";

    // Targets are keyed by Grade + FY, not by month, so the Utilisation Overview
    // page can only show a flat (grade-averaged) target line, not a monthly one.
    var Q_TARGET_DAILY_RATE =
      "EVALUATE\n" +
      "SELECTCOLUMNS(\n" +
      "    data_target_daily_rate,\n" +
      "    \"FY\", data_target_daily_rate[FY],\n" +
      "    \"Grade\", data_target_daily_rate[Grade],\n" +
      "    \"UtilisationTarget\", data_target_daily_rate[Utilisation_Target],\n" +
      "    \"DailyRateTarget\", data_target_daily_rate[Daily_Rate_Target]\n" +
      ")";

    var msalApp = new msal.PublicClientApplication({
      auth: {
        clientId: CLIENT_ID,
        authority: "https://login.microsoftonline.com/" + TENANT_ID,
        redirectUri: window.location.origin + window.location.pathname,
      },
      cache: { cacheLocation: "sessionStorage" },
    });
    var msalReady = msalApp.initialize();

    function showError(msg) {
      var box = document.getElementById("error-box");
      box.textContent = msg;
      box.style.display = "block";
    }

    function setSignedInUi(account) {
      var btn = document.getElementById("signin-btn");
      btn.textContent = account ? "Signed in as " + account.username : "Sign in to view";
      btn.disabled = !!account;
    }

    async function getToken(interactive) {
      await msalReady;
      var accounts = msalApp.getAllAccounts();
      var request = { scopes: POWERBI_SCOPES, account: accounts[0] };
      try {
        var result = await msalApp.acquireTokenSilent(request);
        return result.accessToken;
      } catch (e) {
        if (!interactive) throw e;
        var result = await msalApp.loginPopup({ scopes: POWERBI_SCOPES });
        setSignedInUi(result.account);
        var silent = await msalApp.acquireTokenSilent({ scopes: POWERBI_SCOPES, account: result.account });
        return silent.accessToken;
      }
    }

    // Adds a person directly to the Power BI workspace as a Viewer — this is
    // what actually grants data access (see the note on POWERBI_SCOPES
    // above). The caller must already be a workspace admin themselves;
    // Power BI returns an error otherwise, which callers should treat as
    // non-fatal (the AccessUsers entry still saved) rather than blocking
    // the whole "Add" action on it.
    async function addUserToPowerBiWorkspace(token, email) {
      var resp = await fetch("https://api.powerbi.com/v1.0/myorg/groups/" + WORKSPACE_ID + "/users", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ emailAddress: email, groupUserAccessRight: "Viewer" }),
      });
      if (!resp.ok) {
        var text = await resp.text();
        throw new Error("Could not add to the Power BI workspace (HTTP " + resp.status + "): " + text);
      }
    }

    // Mirrors addUserToPowerBiWorkspace — so "Deactivate" is a real, full
    // revocation (app gate + actual data access) rather than just hiding the
    // app's UI while leaving their Power BI workspace membership intact.
    async function removeUserFromPowerBiWorkspace(token, email) {
      var resp = await fetch("https://api.powerbi.com/v1.0/myorg/groups/" + WORKSPACE_ID + "/users/" + encodeURIComponent(email), {
        method: "DELETE",
        headers: { Authorization: "Bearer " + token },
      });
      if (!resp.ok) {
        var text = await resp.text();
        throw new Error("Could not remove from the Power BI workspace (HTTP " + resp.status + "): " + text);
      }
    }

    // ---- Power BI dataset query layer ----
    // This tier only accepts one query per executeQueries call, so queries
    // run as separate sequential requests rather than a single batched call.
    async function executeDaxQuery(token, query) {
      var url = "https://api.powerbi.com/v1.0/myorg/groups/" + WORKSPACE_ID +
        "/datasets/" + DATASET_ID + "/executeQueries";
      var res = await fetch(url, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          queries: [{ query: query }],
          serializerSettings: { includeNulls: true },
        }),
      });
      if (!res.ok) {
        var text = await res.text();
        throw new Error("Power BI executeQueries failed (" + res.status + "): " + text);
      }
      var data = await res.json();
      return data.results[0].tables[0].rows;
    }

    async function executeDaxQueries(token, queries) {
      var results = [];
      for (var i = 0; i < queries.length; i++) {
        results.push(await executeDaxQuery(token, queries[i]));
      }
      return results;
    }

    // ---- Feedback (Microsoft Graph → Excel workbook) ----
    // Separate token acquisition from getToken() above — this needs Graph's
    // Files.ReadWrite scope, not the Power BI Dataset.Read.All one, so it's
    // requested (and consented) independently. Falls back to an interactive
    // popup only when the silent attempt fails (e.g. first-ever use, before
    // this scope has been consented for this account).
    async function getFeedbackGraphToken() {
      await msalReady;
      var accounts = msalApp.getAllAccounts();
      var request = { scopes: FEEDBACK_GRAPH_SCOPES, account: accounts[0] };
      try {
        var result = await msalApp.acquireTokenSilent(request);
        return result.accessToken;
      } catch (e) {
        var interactive = await msalApp.acquireTokenPopup(request);
        return interactive.accessToken;
      }
    }

    function feedbackWorkbookBasePath() {
      return "https://graph.microsoft.com/v1.0/drives/" + FEEDBACK_DRIVE_ID + "/items/" + FEEDBACK_ITEM_ID;
    }

    // Creates the Feedback worksheet + table on first-ever submission if they
    // don't exist yet, so nobody has to hand-build the sheet structure before
    // this works. Safe to call on every submission — it's a no-op once the
    // table is already there.
    async function ensureFeedbackTable(token, basePath) {
      var checkResp = await fetch(
        basePath + "/workbook/tables('" + FEEDBACK_TABLE_NAME + "')",
        { headers: { Authorization: "Bearer " + token } }
      );
      if (checkResp.ok) return;

      await fetch(basePath + "/workbook/worksheets/add", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ name: FEEDBACK_SHEET_NAME }),
      });

      var headerRange = "A1:E1";
      await fetch(
        basePath + "/workbook/worksheets('" + encodeURIComponent(FEEDBACK_SHEET_NAME) + "')/range(address='" + headerRange + "')",
        {
          method: "PATCH",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ values: [["Timestamp", "SubmittedBy", "Page", "OpCoFilter", "Message"]] }),
        }
      );

      var tableResp = await fetch(
        basePath + "/workbook/worksheets('" + encodeURIComponent(FEEDBACK_SHEET_NAME) + "')/tables/add",
        {
          method: "POST",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ address: headerRange, hasHeaders: true }),
        }
      );
      if (!tableResp.ok) throw new Error("Could not create the Feedback table (Graph " + tableResp.status + ")");
      var table = await tableResp.json();

      // Name it so the checkResp lookup above (by FEEDBACK_TABLE_NAME) finds
      // it on every later call, instead of Graph's auto-generated "Table1".
      await fetch(basePath + "/workbook/tables('" + table.id + "')", {
        method: "PATCH",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ name: FEEDBACK_TABLE_NAME }),
      });
    }

    // Sends as the signed-in submitter's own mailbox (Graph's /me/sendMail),
    // not a shared system identity — there's no service account to send
    // "from" here, and this way the notification is genuinely from whoever
    // submitted it rather than a spoofed sender.
    async function sendFeedbackNotificationEmail(token, details) {
      var bodyText = [
        "New feedback submitted on Omnia Reporting.",
        "",
        "From: " + details.submittedBy,
        "Page: " + details.pageLabel,
        "OpCo filter: " + details.opco,
        "",
        details.message,
      ].join("\n");
      var resp = await fetch("https://graph.microsoft.com/v1.0/me/sendMail", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: {
            subject: "New feedback — Omnia Reporting",
            body: { contentType: "Text", content: bodyText },
            toRecipients: [{ emailAddress: { address: FEEDBACK_NOTIFY_EMAIL } }],
          },
        }),
      });
      if (!resp.ok) {
        var text = await resp.text();
        throw new Error("Could not send notification email (Graph " + resp.status + "): " + text);
      }
    }

    async function submitFeedbackRow(message) {
      if (!feedbackConfigured) {
        throw new Error("Feedback isn't connected to a workbook yet — set FEEDBACK_DRIVE_ID/FEEDBACK_ITEM_ID in the page source first.");
      }
      var token = await getFeedbackGraphToken();
      var basePath = await feedbackWorkbookBasePath();
      await ensureFeedbackTable(token, basePath);

      var accounts = msalApp.getAllAccounts();
      var submittedBy = accounts[0] ? accounts[0].username : "unknown";
      var activeTab = document.querySelector(".tab-btn.active");
      var pageLabel = activeTab ? activeTab.textContent : "";
      var opco = document.getElementById("opco-select") ? currentOpco() : "All";

      var row = [new Date().toISOString(), submittedBy, pageLabel, opco, message];
      var addResp = await fetch(basePath + "/workbook/tables('" + FEEDBACK_TABLE_NAME + "')/rows/add", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ values: [row] }),
      });
      if (!addResp.ok) {
        var text = await addResp.text();
        throw new Error("Could not save feedback (Graph " + addResp.status + "): " + text);
      }

      // Best-effort: the feedback row is already safely saved above by this
      // point, so a failure here (e.g. Mail.Send not yet consented on first
      // use) shouldn't make the whole submission look like it failed.
      try {
        await sendFeedbackNotificationEmail(token, { submittedBy: submittedBy, pageLabel: pageLabel, opco: opco, message: message });
      } catch (e) {
        console.warn("Feedback saved, but the notification email failed:", e);
      }
    }

    // ---- Access allowlist (Microsoft Graph → same workbook) ----
    function isBootstrapAdmin(email) {
      return BOOTSTRAP_ADMIN_EMAILS.indexOf(String(email || "").toLowerCase()) !== -1;
    }

    // Creates the AccessUsers worksheet + table on first-ever use, same
    // pattern as ensureFeedbackTable.
    async function ensureAccessUsersTable(token, basePath) {
      var checkResp = await fetch(
        basePath + "/workbook/tables('" + ACCESS_TABLE_NAME + "')",
        { headers: { Authorization: "Bearer " + token } }
      );
      if (checkResp.ok) return;

      await fetch(basePath + "/workbook/worksheets/add", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ name: ACCESS_SHEET_NAME }),
      });

      var headerRange = "A1:E1";
      await fetch(
        basePath + "/workbook/worksheets('" + encodeURIComponent(ACCESS_SHEET_NAME) + "')/range(address='" + headerRange + "')",
        {
          method: "PATCH",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ values: [["Email", "Role", "Status", "AddedBy", "AddedAt"]] }),
        }
      );

      var tableResp = await fetch(
        basePath + "/workbook/worksheets('" + encodeURIComponent(ACCESS_SHEET_NAME) + "')/tables/add",
        {
          method: "POST",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ address: headerRange, hasHeaders: true }),
        }
      );
      if (!tableResp.ok) throw new Error("Could not create the AccessUsers table (Graph " + tableResp.status + ")");
      var table = await tableResp.json();

      await fetch(basePath + "/workbook/tables('" + table.id + "')", {
        method: "PATCH",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ name: ACCESS_TABLE_NAME }),
      });
    }

    // Each returned row carries its table-relative `index` (needed to PATCH
    // that exact row later via rows/itemAt) alongside the parsed fields.
    async function fetchAccessUsersRows(token, basePath) {
      var resp = await fetch(basePath + "/workbook/tables('" + ACCESS_TABLE_NAME + "')/rows", {
        headers: { Authorization: "Bearer " + token },
      });
      if (!resp.ok) throw new Error("Could not read the access list (Graph " + resp.status + ")");
      var data = await resp.json();
      return (data.value || []).map(function (r, idx) {
        var v = r.values[0];
        return {
          index: idx,
          email: String(v[0] || "").toLowerCase(),
          role: v[1] || "user",
          status: v[2] || "active",
          addedBy: v[3] || "",
          addedAt: v[4] || "",
        };
      });
    }

    // Returns { allowed, role }. Bootstrap admins always pass without even
    // touching the sheet, so a broken/unreachable AccessUsers table can
    // never lock out the people who'd need to fix it.
    async function checkAccess(token, basePath, email) {
      email = String(email || "").toLowerCase();
      if (isBootstrapAdmin(email)) return { allowed: true, role: "admin" };
      await ensureAccessUsersTable(token, basePath);
      var rows = await fetchAccessUsersRows(token, basePath);
      var row = rows.filter(function (r) { return r.email === email; })[0];
      if (!row || row.status !== "active") return { allowed: false, role: null };
      return { allowed: true, role: row.role === "admin" ? "admin" : "user" };
    }

    async function upsertAccessUser(token, basePath, email, role, addedBy) {
      email = String(email).trim().toLowerCase();
      await ensureAccessUsersTable(token, basePath);
      var rows = await fetchAccessUsersRows(token, basePath);
      var existing = rows.filter(function (r) { return r.email === email; })[0];
      var values = [[email, role, "active", addedBy, new Date().toISOString()]];
      if (existing) {
        await fetch(basePath + "/workbook/tables('" + ACCESS_TABLE_NAME + "')/rows/itemAt(index=" + existing.index + ")", {
          method: "PATCH",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ values: values }),
        });
      } else {
        await fetch(basePath + "/workbook/tables('" + ACCESS_TABLE_NAME + "')/rows/add", {
          method: "POST",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ values: values }),
        });
      }
    }

    async function deactivateAccessUser(token, basePath, email) {
      email = String(email).trim().toLowerCase();
      var rows = await fetchAccessUsersRows(token, basePath);
      var existing = rows.filter(function (r) { return r.email === email; })[0];
      if (!existing) return;
      var values = [[existing.email, existing.role, "inactive", existing.addedBy, existing.addedAt]];
      await fetch(basePath + "/workbook/tables('" + ACCESS_TABLE_NAME + "')/rows/itemAt(index=" + existing.index + ")", {
        method: "PATCH",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ values: values }),
      });
    }

    // ---- Formatting helpers ----
    function parseDate(v) {
      var d = new Date(v);
      return isNaN(d.getTime()) ? null : d;
    }
    function monthLabel(d) {
      return d.toLocaleDateString("en-AU", { month: "short", year: "2-digit" });
    }
    function fmtMoneyAbbrev(v) {
      v = v || 0;
      var sign = v < 0 ? "-" : "";
      var abs = Math.abs(v);
      if (abs >= 1e6) return sign + "$" + (abs / 1e6).toFixed(1) + "M";
      if (abs >= 1e3) return sign + "$" + (abs / 1e3).toFixed(0) + "K";
      return sign + "$" + Math.round(abs);
    }
    function fmtInt(v) { return Math.round(v || 0).toLocaleString("en-AU"); }
    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function deltaHtml(pct) {
      if (pct == null || !isFinite(pct)) return "";
      var cls = pct >= 0 ? "up" : "down";
      var arrow = pct >= 0 ? "▲" : "▼";
      return '<div class="delta ' + cls + '">' + Math.abs(pct).toFixed(1) + "%" + arrow + " vs LY</div>";
    }

    function kpiCard(label, valueHtml, opts) {
      opts = opts || {};
      var sub = opts.subText ? '<div class="subtext">' + escapeHtml(opts.subText) + "</div>" : "";
      return '<div class="kpi-card' + (opts.primary ? " kpi-card--primary" : "") + '">' +
        '<div class="label">' + label + "</div>" +
        '<div class="value">' + valueHtml + "</div>" +
        deltaHtml(opts.deltaPct) + sub +
        "</div>";
    }

    // ---- Fiscal year helpers (AU-style FY: Jul-Jun, labelled by the year it ends in) ----
    function fyStartYear(d) { return d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1; }
    function fyLabel(startYear) { return "FY" + String((startYear + 1) % 100).padStart(2, "0"); }
    function fyMonths(startYear) {
      var months = [];
      for (var i = 0; i < 12; i++) months.push(new Date(startYear, 6 + i, 1));
      return months;
    }
    function monthKey(d) { return d.getFullYear() * 12 + d.getMonth(); }
    function monthsRangeFromData(rows, opco) {
      var mn = null, mx = null;
      rows.forEach(function (r) {
        if (!matches(r.entity, opco)) return;
        if (!mn || r.month < mn) mn = r.month;
        if (!mx || r.month > mx) mx = r.month;
      });
      if (!mn) return [];
      var arr = [], cur = new Date(mn.getFullYear(), mn.getMonth(), 1);
      while (cur <= mx) { arr.push(new Date(cur)); cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); }
      return arr;
    }
    // Same idea as monthsRangeFromData but for a plain array of dates (no entity/opco
    // dimension to filter by) — used by the Certifications page.
    function monthsRangeSimple(dates) {
      if (!dates.length) return [];
      var mn = new Date(Math.min.apply(null, dates)), mx = new Date(Math.max.apply(null, dates));
      var arr = [], cur = new Date(mn.getFullYear(), mn.getMonth(), 1);
      var end = new Date(mx.getFullYear(), mx.getMonth(), 1);
      while (cur <= end) { arr.push(new Date(cur)); cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); }
      return arr;
    }
    function fyQuarterInfo(d) {
      var fyMonthIdx = (d.getMonth() - 6 + 12) % 12;
      return { startYear: fyStartYear(d), q: Math.floor(fyMonthIdx / 3) + 1 };
    }
    function fyQuarterRange(startYear, q) {
      var offset = (q - 1) * 3;
      var start = new Date(startYear, 6 + offset, 1);
      var lastMonthFirst = new Date(startYear, 6 + offset + 2, 1);
      var end = new Date(lastMonthFirst.getFullYear(), lastMonthFirst.getMonth() + 1, 0);
      return { start: start, end: end };
    }
    function prevQuarter(startYear, q) {
      return q === 1 ? { startYear: startYear - 1, q: 4 } : { startYear: startYear, q: q - 1 };
    }

    // Any Deal_Stage value containing "won"/"lost" is classified as such; everything
    // else (Discovery, Proposal, etc.) is treated as still-open pipeline. This avoids
    // hardcoding the CRM's exact stage names, which vary and weren't confirmed.
    function stageBucket(stage) {
      var s = String(stage || "").toLowerCase();
      if (s.indexOf("won") !== -1) return "won";
      if (s.indexOf("lost") !== -1) return "lost";
      return "open";
    }

    function matches(value, selected) {
      return selected === "All" || String(value) === selected;
    }
    function inScope(row, monthsSet, opco) {
      return matches(row.entity, opco) && (monthsSet === null || monthsSet[monthKey(row.month)]);
    }
    function aggregateBy(rows, keyFn, valFn) {
      var map = {};
      rows.forEach(function (r) {
        var k = keyFn(r);
        if (k == null) return;
        map[k] = (map[k] || 0) + valFn(r);
      });
      return map;
    }
    function topN(map, n) {
      return Object.keys(map).map(function (k) { return { label: k, value: map[k] }; })
        .sort(function (a, b) { return b.value - a.value; }).slice(0, n);
    }

    // ---- Chart hover tooltip ----
    // Charts are re-rendered as raw HTML strings, so rather than wiring listeners
    // per shape we tag each hoverable <rect>/<path> with data-tip-* attributes and
    // use a single delegated mousemove listener on the document.
    function showTooltip(x, y, html) {
      var tip = document.getElementById("chart-tooltip");
      tip.innerHTML = html;
      tip.style.display = "block";
      var rect = tip.getBoundingClientRect();
      var left = x + 14, top = y + 14;
      if (left + rect.width > window.innerWidth) left = x - rect.width - 14;
      if (top + rect.height > window.innerHeight) top = y - rect.height - 14;
      tip.style.left = Math.max(4, left) + "px";
      tip.style.top = Math.max(4, top) + "px";
    }
    function hideTooltip() { document.getElementById("chart-tooltip").style.display = "none"; }
    function tipAttrs(title, lines, color) {
      var attrs = 'data-tip-title="' + escapeHtml(title) + '" data-tip-detail="' + escapeHtml(lines.join("||")) + '"';
      if (color) attrs += ' data-tip-color="' + escapeHtml(color) + '"';
      return attrs;
    }
    document.addEventListener("mousemove", function (e) {
      var el = e.target.closest && e.target.closest("[data-tip-title]");
      if (!el) { hideTooltip(); return; }
      var title = el.getAttribute("data-tip-title") || "";
      var detailRaw = el.getAttribute("data-tip-detail") || "";
      var color = el.getAttribute("data-tip-color");
      var lines = detailRaw ? detailRaw.split("||") : [];
      var swatch = color ? '<span class="tooltip-swatch" style="background:' + color + '"></span>' : "";
      var html = '<div class="tooltip-title">' + swatch + escapeHtml(title) + "</div>" +
        lines.map(function (l) { return '<div class="tooltip-detail">' + escapeHtml(l) + "</div>"; }).join("");
      showTooltip(e.clientX, e.clientY, html);
    });

    // ---- SVG chart helpers ----
    // The viewBox width is chosen to roughly match a real rendered panel width, so
    // the aspect ratio (width:100%, height:auto) doesn't force the browser to
    // scale text/bars up or down noticeably between chart types — a mismatch here
    // previously caused inconsistent text sizes and (once max-height clamped the
    // resulting oversized height) large empty gutters on wide panels.
    function chartFrame(n) {
      var W = 760, H = 230, padL = 54, padR = 16, padT = 14, padB = 28;
      return { W: W, H: H, padL: padL, padR: padR, padT: padT, padB: padB, plotW: W - padL - padR, plotH: H - padT - padB, n: n };
    }

    function gridAndAxes(f, yMin, yMax, yFmt, xLabels) {
      function yScale(v) { return f.padT + f.plotH - ((v - yMin) / (yMax - yMin || 1)) * f.plotH; }
      var gridCount = 4, gridlines = "", yLabels = "";
      for (var g = 0; g <= gridCount; g++) {
        var val = yMin + (g / gridCount) * (yMax - yMin);
        var y = yScale(val);
        gridlines += '<line class="gridline" x1="' + f.padL + '" x2="' + (f.W - f.padR) + '" y1="' + y + '" y2="' + y + '"/>';
        yLabels += '<text class="axis-label" x="' + (f.padL - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + yFmt(val) + '</text>';
      }
      // Pick evenly-spaced ticks, then only add/replace with the final index if it
      // won't collide with the last chosen tick (fixes overlapping end labels when
      // n-1 isn't a multiple of the step, e.g. 12 months at every-2 spacing).
      var maxTicks = 6;
      var step = Math.max(1, Math.ceil(f.n / maxTicks));
      var shown = [];
      for (var i = 0; i < f.n; i += step) shown.push(i);
      if (shown[shown.length - 1] !== f.n - 1) {
        if (f.n - 1 - shown[shown.length - 1] >= step) shown.push(f.n - 1);
        else shown[shown.length - 1] = f.n - 1;
      }
      var xLabelsSvg = "";
      shown.forEach(function (i) {
        var x = f.padL + (f.n <= 1 ? 0 : (i / (f.n - 1)) * f.plotW);
        xLabelsSvg += '<text class="axis-label" x="' + x + '" y="' + (f.H - 6) + '" text-anchor="middle">' + escapeHtml(xLabels[i]) + '</text>';
      });
      return { yScale: yScale, gridlines: gridlines, yLabels: yLabels, xLabelsSvg: xLabelsSvg };
    }

    // values/targets: arrays aligned to xLabels. targets entries may be null.
    function renderBarWithTarget(values, targets, xLabels, opts) {
      opts = opts || {};
      var f = chartFrame(xLabels.length);
      var allVals = values.concat(targets).filter(function (v) { return v != null; });
      var yMax = (opts.yMax != null ? opts.yMax : Math.max.apply(null, allVals.length ? allVals : [1])) * 1.15;
      var axes = gridAndAxes(f, 0, yMax, opts.yFmt || function (v) { return Math.round(v); }, xLabels);
      var bw = f.plotW / f.n, barW = bw * 0.55;
      var bars = "";
      values.forEach(function (v, i) {
        if (v == null) return;
        var x = f.padL + i * bw + (bw - barW) / 2;
        var y = axes.yScale(v);
        var lines = [(opts.seriesLabel || "Revenue") + ": " + (opts.yFmt ? opts.yFmt(v) : v)];
        if (targets[i] != null) lines.push((opts.targetLabel || "Revenue Target") + ": " + (opts.yFmt ? opts.yFmt(targets[i]) : targets[i]));
        bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) +
          '" height="' + (f.padT + f.plotH - y).toFixed(1) + '" fill="' + (opts.barColor || "#bfe0cd") + '" rx="1" ' +
          tipAttrs(xLabels[i], lines, opts.barColor) + '/>';
      });
      var markers = "";
      targets.forEach(function (t, i) {
        if (t == null) return;
        var x = f.padL + i * bw + (bw - barW) / 2;
        var y = axes.yScale(t);
        markers += '<line x1="' + x.toFixed(1) + '" x2="' + (x + barW).toFixed(1) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) +
          '" stroke="' + (opts.targetColor || "#14201c") + '" stroke-width="3"/>';
      });
      return '<svg class="chart" viewBox="0 0 ' + f.W + ' ' + f.H + '">' +
        axes.gridlines + axes.yLabels + axes.xLabelsSvg + bars + markers + "</svg>";
    }

    function renderBarChart(values, xLabels, opts) {
      opts = opts || {};
      var f = chartFrame(xLabels.length);
      var allVals = values.filter(function (v) { return v != null; });
      var yMax = (opts.yMax != null ? opts.yMax : Math.max.apply(null, allVals.length ? allVals : [1])) * 1.15;
      var axes = gridAndAxes(f, 0, yMax, opts.yFmt || function (v) { return Math.round(v); }, xLabels);
      var bw = f.plotW / f.n, barW = bw * 0.55;
      var bars = "";
      values.forEach(function (v, i) {
        if (v == null) return;
        var x = f.padL + i * bw + (bw - barW) / 2;
        var y = axes.yScale(v);
        bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) +
          '" height="' + (f.padT + f.plotH - y).toFixed(1) + '" fill="' + (opts.barColor || "#7f8c86") + '" rx="1" ' +
          tipAttrs(xLabels[i], [opts.yFmt ? opts.yFmt(v) : v], opts.barColor) + '/>';
      });
      return '<svg class="chart" viewBox="0 0 ' + f.W + ' ' + f.H + '">' +
        axes.gridlines + axes.yLabels + axes.xLabelsSvg + bars + "</svg>";
    }

    // opts.valueFmt: optional formatter to print the value at the end of each bar.
    // opts.colors: optional array to color each row categorically (cycled by index),
    // overriding the single opts.barColor — used where each category needs its own
    // color (e.g. Deal Amount by Stage), rather than a uniform ranked list.
    function renderHBarChart(items, opts) {
      opts = opts || {};
      var rowH = 20, gap = 8, labelW = 160, padR = opts.valueFmt ? 90 : 60, W = 760;
      var maxVal = Math.max.apply(null, items.map(function (it) { return it.value; }).concat([1]));
      var plotW = W - labelW - padR;
      var H = items.length * (rowH + gap) + 10;
      var rows = items.map(function (it, i) {
        var y = 6 + i * (rowH + gap);
        var w = maxVal > 0 ? (it.value / maxVal) * plotW : 0;
        var color = opts.colors ? opts.colors[i % opts.colors.length] : (opts.barColor || "#bfe0cd");
        var valueLabel = opts.valueFmt
          ? '<text class="axis-label" x="' + (labelW + w + 6) + '" y="' + (y + rowH * 0.7) + '">' + opts.valueFmt(it.value) + '</text>'
          : "";
        var tip = tipAttrs(it.label, [opts.valueFmt ? opts.valueFmt(it.value) : it.value], color);
        return '<text class="axis-label" x="' + (labelW - 8) + '" y="' + (y + rowH * 0.7) + '" text-anchor="end">' +
          escapeHtml(it.label) + '</text>' +
          '<rect x="' + labelW + '" y="' + y + '" width="' + w.toFixed(1) + '" height="' + rowH + '" rx="2" fill="' + color + '" ' + tip + '/>' +
          valueLabel;
      }).join("");
      return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '">' + rows + "</svg>";
    }

    function renderLineChart(values, xLabels, opts) {
      opts = opts || {};
      var f = chartFrame(xLabels.length);
      var allVals = values.filter(function (v) { return v != null; });
      var yMax = (opts.yMax != null ? opts.yMax : Math.max.apply(null, allVals.length ? allVals : [1])) * 1.15;
      var yMin = opts.yMin != null ? opts.yMin : 0;
      var axes = gridAndAxes(f, yMin, yMax, opts.yFmt || function (v) { return Math.round(v); }, xLabels);
      var stepX = f.n <= 1 ? 0 : f.plotW / (f.n - 1);
      var points = values.map(function (v, i) {
        if (v == null) return null;
        return { x: f.padL + i * stepX, y: axes.yScale(v), v: v };
      });
      var segs = [], cur = [];
      points.forEach(function (p) { if (p == null) { if (cur.length) { segs.push(cur); cur = []; } } else cur.push(p); });
      if (cur.length) segs.push(cur);
      var path = segs.map(function (seg) {
        return "M" + seg.map(function (p) { return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join("L");
      }).join(" ");
      var color = opts.lineColor || "#14201c";
      var dots = points.map(function (p, i) {
        if (p == null) return "";
        var lines = [opts.yFmt ? opts.yFmt(p.v) : p.v];
        return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="9" fill="transparent" ' +
          tipAttrs(xLabels[i], lines, color) + '/>' +
          '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3" fill="' + color + '"/>';
      }).join("");
      return '<svg class="chart" viewBox="0 0 ' + f.W + ' ' + f.H + '">' +
        axes.gridlines + axes.yLabels + axes.xLabelsSvg +
        '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2"/>' + dots + "</svg>";
    }

    function polarToCartesian(cx, cy, r, angleDeg) {
      var a = (angleDeg - 90) * Math.PI / 180;
      return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
    }
    function describeSlice(cx, cy, r, startAngle, endAngle) {
      var start = polarToCartesian(cx, cy, r, endAngle);
      var end = polarToCartesian(cx, cy, r, startAngle);
      var largeArc = endAngle - startAngle <= 180 ? "0" : "1";
      return ["M", cx, cy, "L", start.x, start.y, "A", r, r, 0, largeArc, 0, end.x, end.y, "Z"].join(" ");
    }
    // Matches the Power BI reference: legend shows only category (color dot +
    // name), while value/percent are shown as leader-line callouts pointing out
    // from each slice rather than in the legend.
    function renderPieChart(items, colors, opts) {
      opts = opts || {};
      var valueFmt = opts.valueFmt || fmtMoneyAbbrev;
      var total = items.reduce(function (s, it) { return s + it.value; }, 0) || 1;
      var W = 440, H = 260, cx = 190, cy = 130, r = 85, angle = 0, slices = "", callouts = "";
      function calloutLabel(it, midAngle) {
        var pEdge = polarToCartesian(cx, cy, r, midAngle);
        var pElbow = polarToCartesian(cx, cy, r + 18, midAngle);
        var isRight = pElbow.x >= cx;
        var labelX = isRight ? pElbow.x + 12 : pElbow.x - 12;
        var pct = (it.value / total * 100).toFixed(2);
        return '<path d="M' + pEdge.x.toFixed(1) + ',' + pEdge.y.toFixed(1) + 'L' + pElbow.x.toFixed(1) + ',' + pElbow.y.toFixed(1) +
          'L' + labelX.toFixed(1) + ',' + pElbow.y.toFixed(1) + '" fill="none" stroke="#b7b7b7" stroke-width="1"/>' +
          '<text x="' + (labelX + (isRight ? 3 : -3)).toFixed(1) + '" y="' + (pElbow.y + 3.5).toFixed(1) +
          '" text-anchor="' + (isRight ? "start" : "end") + '" font-size="12" fill="#434343">' +
          escapeHtml(valueFmt(it.value) + " (" + pct + "%)") + "</text>";
      }
      if (items.length === 1) {
        slices = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + colors[0] + '" ' +
          tipAttrs(items[0].label, [valueFmt(items[0].value) + " · 100%"], colors[0]) + '/>';
        callouts = calloutLabel(items[0], 0);
      } else {
        items.forEach(function (it, i) {
          var sweep = (it.value / total) * 360;
          var pct = (it.value / total * 100).toFixed(0);
          slices += '<path d="' + describeSlice(cx, cy, r, angle, angle + sweep) + '" fill="' + colors[i % colors.length] + '" ' +
            tipAttrs(it.label, [valueFmt(it.value) + " · " + pct + "%"], colors[i % colors.length]) + '/>';
          callouts += calloutLabel(it, angle + sweep / 2);
          angle += sweep;
        });
      }
      var legend = items.map(function (it, i) {
        return '<div class="legend-item"><span class="legend-swatch legend-swatch--dot" style="background:' + colors[i % colors.length] + '"></span>' +
          escapeHtml(it.label) + "</div>";
      }).join("");
      return '<div style="display:flex;gap:24px;align-items:center;justify-content:center;flex-wrap:wrap;">' +
        '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:440px;height:auto;flex:1 1 320px;">' + slices + callouts + '</svg>' +
        '<div class="legend" style="flex-direction:column;align-items:flex-start;gap:8px;flex:0 0 auto;">' + legend + '</div>' +
        '</div>';
    }

    // ---- App state ----
    var RAW = { revenue: [], projects: [], deals: [], utilisation: [], certifications: [], targetRates: [] };
    var CURRENT_SESSION = { email: null, role: null };

    function parseRevenueRows(rows) {
      return rows.map(function (r) {
        return {
          month: parseDate(r["data_revenue_target[month_date]"]),
          entity: r["data_revenue_target[entity]"],
          revenue: r["[Revenue]"],
          target: r["[RevenueTarget]"],
        };
      }).filter(function (r) { return r.month; });
    }
    function parseProjectRows(rows) {
      return rows.map(function (r) {
        return {
          month: parseDate(r["data_powerbi_unified_fact[month_date]"]),
          entity: r["data_powerbi_unified_fact[entity]"],
          industry: r["data_powerbi_unified_fact[client_industry]"] || "Unspecified",
          client: r["data_powerbi_unified_fact[client_name]"] || "Unknown",
          project: r["data_powerbi_unified_fact[Project_Name]"] || "Unspecified",
          stream: r["data_powerbi_unified_fact[project_stream]"] || "Unspecified",
          revenue: r["[TotalRevenue]"] || 0,
        };
      }).filter(function (r) { return r.month; });
    }
    function parseDealRows(rows) {
      return rows.map(function (r) {
        var closeDate = parseDate(r["[CloseDate]"]);
        return {
          company: r["[Company]"],
          entity: r["[OmniaCompany]"],
          dealName: r["[DealName]"] || r["[Company]"] || "Deal",
          confidence: r["[Confidence]"] || "Unspecified",
          stage: r["[DealStage]"],
          bucket: stageBucket(r["[DealStage]"]),
          closeDate: closeDate,
          amount: r["[Amount]"] || 0,
        };
      }).filter(function (r) { return r.closeDate; });
    }
    function parseUtilisationRows(rows) {
      return rows.map(function (r) {
        return {
          month: parseDate(r["[Month]"]),
          entity: r["[Entity]"],
          employmentBasis: r["[EmploymentBasis]"] || "Unspecified",
          isBillable: !!r["[IsBillable]"],
          fte: r["[FTE]"] || 0,
          dailyRate: r["[DailyRate]"],
          invoicedDays: r["[InvoicedDays]"] || 0,
          leaveDays: r["[LeaveDays]"] || 0,
          utilisationPct: r["[UtilisationPct]"],
          userId: r["[UserId]"],
        };
      }).filter(function (r) { return r.month; });
    }
    function parseCertRows(rows) {
      return rows.map(function (r) {
        return {
          userId: r["[UserId]"],
          title: r["[Title]"] || "Unspecified",
          status: r["[Status]"],
          completionDate: parseDate(r["[CompletionDate]"]),
          expirationDate: parseDate(r["[ExpirationDate]"]),
        };
      });
    }
    function parseTargetRateRows(rows) {
      return rows.map(function (r) {
        return {
          fy: r["[FY]"],
          grade: r["[Grade]"],
          utilisationTarget: r["[UtilisationTarget]"],
          dailyRateTarget: r["[DailyRateTarget]"],
        };
      });
    }

    function computeFYOptions() {
      var years = {};
      RAW.revenue.forEach(function (r) { years[fyStartYear(r.month)] = true; });
      RAW.deals.forEach(function (r) { years[fyStartYear(r.closeDate)] = true; });
      return Object.keys(years).map(Number).sort(function (a, b) { return a - b; });
    }
    function computeEntityOptions() {
      var set = {};
      RAW.revenue.forEach(function (r) { if (r.entity) set[r.entity] = true; });
      RAW.projects.forEach(function (r) { if (r.entity) set[r.entity] = true; });
      return Object.keys(set).sort();
    }
    function latestRevenueMonth() {
      var months = RAW.revenue.filter(function (r) { return r.revenue != null; }).map(function (r) { return r.month; });
      if (!months.length) return new Date();
      return new Date(Math.max.apply(null, months));
    }

    function populateFilters() {
      var fySel = document.getElementById("fy-select");
      var opcoSel = document.getElementById("opco-select");
      var fyYears = computeFYOptions();
      fySel.innerHTML = '<option value="all">All</option>' +
        fyYears.map(function (y) { return '<option value="' + y + '">' + fyLabel(y) + '</option>'; }).join("");
      var entities = computeEntityOptions();
      opcoSel.innerHTML = '<option value="All">All OpCos</option>' +
        entities.map(function (e) { return '<option value="' + escapeHtml(e) + '">' + escapeHtml(e) + '</option>'; }).join("");
      var preferredYear = 2025; // FY26 — default financial year for this report
      var defaultYear = fyYears.indexOf(preferredYear) !== -1 ? preferredYear : fyStartYear(latestRevenueMonth());
      fySel.value = fyYears.indexOf(defaultYear) !== -1 ? String(defaultYear) : String(fyYears[fyYears.length - 1]);
      opcoSel.value = "All";
      document.querySelector(".header-filters").classList.remove("hidden");
      fySel.addEventListener("change", render);
      opcoSel.addEventListener("change", render);
    }

    function currentOpco() { return document.getElementById("opco-select").value; }
    function isAllFY() { return document.getElementById("fy-select").value === "all"; }
    function effectiveFYStartYear() {
      var v = document.getElementById("fy-select").value;
      return v === "all" ? fyStartYear(latestRevenueMonth()) : Number(v);
    }

    function monthsElapsedInFY(startYear, latestMonth) {
      var fyStart = new Date(startYear, 6, 1);
      var fyEnd = new Date(startYear + 1, 5, 1);
      if (latestMonth < fyStart) return 0;
      var capped = latestMonth > fyEnd ? fyEnd : latestMonth;
      return Math.round((capped.getFullYear() * 12 + capped.getMonth()) - (fyStart.getFullYear() * 12 + fyStart.getMonth())) + 1;
    }

    function sumRevenueWindow(startYear, opco, monthLimit) {
      var months = fyMonths(startYear).slice(0, monthLimit);
      var keys = {}; months.forEach(function (d) { keys[monthKey(d)] = true; });
      var total = 0;
      RAW.revenue.forEach(function (r) {
        if (matches(r.entity, opco) && keys[monthKey(r.month)] && r.revenue != null) total += r.revenue;
      });
      return total;
    }
    function sumTargetWindow(startYear, opco, monthLimit) {
      var months = fyMonths(startYear).slice(0, monthLimit);
      var keys = {}; months.forEach(function (d) { keys[monthKey(d)] = true; });
      var total = 0;
      RAW.revenue.forEach(function (r) {
        if (matches(r.entity, opco) && keys[monthKey(r.month)] && r.target != null) total += r.target;
      });
      return total;
    }

    // ---- Summary page ----
    function renderSummaryPage(startYear, opco) {
      var months = fyMonths(startYear);
      var xLabels = months.map(monthLabel);
      var latestMonth = latestRevenueMonth();
      var elapsed = monthsElapsedInFY(startYear, latestMonth);

      var revByMonth = {};
      RAW.revenue.forEach(function (r) {
        if (matches(r.entity, opco)) {
          var k = monthKey(r.month);
          if (!revByMonth[k]) revByMonth[k] = { revenue: 0, target: 0 };
          revByMonth[k].revenue += r.revenue || 0;
          revByMonth[k].target += r.target || 0;
        }
      });
      var revValues = months.map(function (d) { var e = revByMonth[monthKey(d)]; return e ? e.revenue : null; });
      var targetValues = months.map(function (d) { var e = revByMonth[monthKey(d)]; return e ? e.target : null; });

      var fyKeys = {}; months.forEach(function (d) { fyKeys[monthKey(d)] = true; });
      var industryTotals = aggregateBy(
        RAW.projects.filter(function (r) { return matches(r.entity, opco) && fyKeys[monthKey(r.month)]; }),
        function (r) { return r.industry; }, function (r) { return r.revenue; }
      );
      var industryItems = topN(industryTotals, 10);

      var fyStartDate = new Date(startYear, 6, 1);
      var dealsInScope = RAW.deals.filter(function (d) { return matches(d.entity, opco); });

      var pipelineByMonth = {};
      dealsInScope.forEach(function (d) {
        if (d.bucket === "open" && d.closeDate >= fyStartDate) {
          var k = monthKey(d.closeDate);
          pipelineByMonth[k] = (pipelineByMonth[k] || 0) + d.amount;
        }
      });
      var pipelineMonths = Object.keys(pipelineByMonth).map(Number).sort(function (a, b) { return a - b; });
      var pipelineLabels = pipelineMonths.map(function (k) { return monthLabel(new Date(Math.floor(k / 12), k % 12, 1)); });
      var pipelineValues = pipelineMonths.map(function (k) { return pipelineByMonth[k]; });

      var intakeByMonth = {};
      dealsInScope.forEach(function (d) {
        if (d.bucket === "won" && fyKeys[monthKey(d.closeDate)]) {
          var k = monthKey(d.closeDate);
          intakeByMonth[k] = (intakeByMonth[k] || 0) + d.amount;
        }
      });
      var intakeValues = months.map(function (d) { return intakeByMonth[monthKey(d)] || 0; });

      var ytdStart = fyStartDate;
      var ytdEnd = new Date(startYear, 6 + elapsed - 1, 1);
      var wonYTD = dealsInScope.filter(function (d) {
        return d.bucket === "won" && d.closeDate >= ytdStart && d.closeDate <= ytdEnd;
      });
      var totalWonYTD = wonYTD.reduce(function (s, d) { return s + d.amount; }, 0);
      var engagementCountYTD = wonYTD.length;
      var avgWonDealSizeYTD = wonYTD.length ? totalWonYTD / wonYTD.length : 0;

      var firstWinByCompany = {};
      dealsInScope.forEach(function (d) {
        if (d.bucket === "won") {
          if (!firstWinByCompany[d.company] || d.closeDate < firstWinByCompany[d.company]) {
            firstWinByCompany[d.company] = d.closeDate;
          }
        }
      });
      var newClientCompanies = {};
      wonYTD.forEach(function (d) {
        var first = firstWinByCompany[d.company];
        if (first && first >= ytdStart && first <= ytdEnd) newClientCompanies[d.company] = true;
      });
      var newClientsYTD = Object.keys(newClientCompanies).length;

      var totalRevenueYTD = sumRevenueWindow(startYear, opco, elapsed);
      var totalRevenueLYYTD = sumRevenueWindow(startYear - 1, opco, elapsed);
      var revenueGrowthPct = totalRevenueLYYTD ? ((totalRevenueYTD - totalRevenueLYYTD) / totalRevenueLYYTD) * 100 : null;

      var kpiHtml =
        kpiCard("Total Revenue YTD", fmtMoneyAbbrev(totalRevenueYTD), { deltaPct: revenueGrowthPct, primary: true }) +
        kpiCard("Engagement Count YTD", fmtInt(engagementCountYTD)) +
        kpiCard("New Clients YTD", fmtInt(newClientsYTD)) +
        kpiCard("Avg. Won Deal Size YTD", fmtMoneyAbbrev(avgWonDealSizeYTD)) +
        kpiCard("Revenue Growth YTD", revenueGrowthPct == null ? "—" : Math.round(revenueGrowthPct) + "%");

      var revenuePanel =
        '<div class="panel"><div class="panel-header">Revenue vs. Target by Month<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        renderBarWithTarget(revValues, targetValues, xLabels, { yFmt: fmtMoneyAbbrev, barColor: "#244744", targetColor: "#14201c" }) +
        '<div class="legend">' +
        '<span class="legend-item"><span class="legend-swatch" style="background:#bfe0cd"></span>Revenue</span>' +
        '<span class="legend-item"><span class="legend-dash" style="background:#14201c"></span>Revenue Target</span>' +
        "</div></div></div>";

      var pipelinePanel =
        '<div class="panel"><div class="panel-header">Deals in Pipeline<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        '<div class="panel-note">*Includes all open deals from the current FY onwards.</div>' +
        (pipelineMonths.length
          ? renderBarChart(pipelineValues, pipelineLabels, { yFmt: fmtMoneyAbbrev, barColor: "#cadacb" })
          : '<div class="panel-note">No open pipeline in scope.</div>') +
        "</div></div>";

      var industryPanel =
        '<div class="panel"><div class="panel-header">Client Industry by Total Revenue<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        (industryItems.length ? renderHBarChart(industryItems, { barColor: "#244744" }) : '<div class="panel-note">No data in scope.</div>') +
        "</div></div>";

      var intakePanel =
        '<div class="panel"><div class="panel-header">Sales Intake by Month<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        renderBarChart(intakeValues, xLabels, { yFmt: fmtMoneyAbbrev, barColor: "#cadacb" }) +
        "</div></div>";

      document.getElementById("page-summary").innerHTML =
        '<div class="summary-grid"><div class="kpi-sidebar">' + kpiHtml + "</div>" +
        '<div class="panels-grid">' + revenuePanel + pipelinePanel + industryPanel + intakePanel + "</div></div>";
    }

    // ---- Client Overview page ----
    function computeClientFirstMonth(opco) {
      var first = {};
      RAW.projects.forEach(function (r) {
        if (!matches(r.entity, opco) || r.revenue <= 0 || !r.client) return;
        if (!first[r.client] || r.month < first[r.client]) first[r.client] = r.month;
      });
      return first;
    }

    function renderClientsPage(startYear, opco, allFY) {
      var trendMonths, monthsSet;
      if (allFY) {
        trendMonths = monthsRangeFromData(RAW.projects, opco);
        monthsSet = null;
      } else {
        trendMonths = fyMonths(startYear);
        monthsSet = {}; trendMonths.forEach(function (d) { monthsSet[monthKey(d)] = true; });
      }

      var firstMonthMap = computeClientFirstMonth(opco);
      var scopedRows = RAW.projects.filter(function (r) { return inScope(r, monthsSet, opco) && r.revenue > 0; });

      var activeSet = {};
      scopedRows.forEach(function (r) { activeSet[r.client] = true; });
      var activeClients = Object.keys(activeSet).length;
      var totalRevenueScope = scopedRows.reduce(function (s, r) { return s + r.revenue; }, 0);

      var newSet = {};
      Object.keys(firstMonthMap).forEach(function (c) {
        var m = firstMonthMap[c];
        if (monthsSet === null || monthsSet[monthKey(m)]) newSet[c] = true;
      });
      var newClients = Object.keys(newSet).length;
      var newClientsRevenue = scopedRows.filter(function (r) { return newSet[r.client]; }).reduce(function (s, r) { return s + r.revenue; }, 0);
      var avgRevenueActive = activeClients ? totalRevenueScope / activeClients : 0;
      var avgRevenueNew = newClients ? newClientsRevenue / newClients : 0;

      var byClient = aggregateBy(scopedRows, function (r) { return r.client; }, function (r) { return r.revenue; });
      var topClients = topN(byClient, 10);
      var top5Sum = topClients.slice(0, 5).reduce(function (s, it) { return s + it.value; }, 0);
      var top5ConcentrationPct = totalRevenueScope ? (top5Sum / totalRevenueScope * 100) : 0;

      var newClientsByMonth = {};
      Object.keys(firstMonthMap).forEach(function (c) {
        var k = monthKey(firstMonthMap[c]);
        newClientsByMonth[k] = (newClientsByMonth[k] || 0) + 1;
      });
      var trendLabels = trendMonths.map(monthLabel);
      var trendValues = trendMonths.map(function (d) { return newClientsByMonth[monthKey(d)] || 0; });

      var comboCard =
        '<div class="kpi-card kpi-card--combo">' +
        '<div class="combo-item"><div class="label">Active Clients</div><div class="value">' + fmtInt(activeClients) + '</div></div>' +
        '<div class="combo-divider"></div>' +
        '<div class="combo-item"><div class="label">New Clients</div><div class="value">' + fmtInt(newClients) + '</div></div>' +
        "</div>";

      var kpiHtml = comboCard +
        kpiCard("Avg. Revenue - Active Clients", fmtMoneyAbbrev(avgRevenueActive)) +
        kpiCard("Avg. Revenue - New Clients", fmtMoneyAbbrev(avgRevenueNew)) +
        kpiCard("Top 5 Clients Concentration", Math.round(top5ConcentrationPct) + "%");

      var trendPanel =
        '<div class="panel"><div class="panel-header">New Clients by Month<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        '<div class="panel-note">*Based on date of first revenue</div>' +
        (trendValues.length ? renderBarChart(trendValues, trendLabels, { barColor: "#244744" }) : '<div class="panel-note">No data in scope.</div>') +
        "</div></div>";

      var clientsPanel =
        '<div class="panel"><div class="panel-header">Top 10 Clients by Total Revenue<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        (topClients.length ? renderHBarChart(topClients, { valueFmt: fmtMoneyAbbrev }) : '<div class="panel-note">No data in scope.</div>') +
        "</div></div>";

      document.getElementById("page-clients").innerHTML =
        '<div class="kpi-row">' + kpiHtml + "</div>" +
        '<div class="client-panels">' + trendPanel + clientsPanel + "</div>";
    }

    // ---- Revenue Overview page ----
    function renderRevenuePage(startYear, opco) {
      var months = fyMonths(startYear);
      var xLabels = months.map(monthLabel);
      var elapsed = monthsElapsedInFY(startYear, latestRevenueMonth());

      var revByMonth = {};
      RAW.revenue.forEach(function (r) {
        if (matches(r.entity, opco)) {
          var k = monthKey(r.month);
          if (!revByMonth[k]) revByMonth[k] = { revenue: 0, target: 0 };
          revByMonth[k].revenue += r.revenue || 0;
          revByMonth[k].target += r.target || 0;
        }
      });
      var revValues = months.map(function (d) { var e = revByMonth[monthKey(d)]; return e ? e.revenue : null; });
      var targetValues = months.map(function (d) { var e = revByMonth[monthKey(d)]; return e ? e.target : null; });

      var totalRevenueYTD = sumRevenueWindow(startYear, opco, elapsed);
      var totalRevenueLYYTD = sumRevenueWindow(startYear - 1, opco, elapsed);
      var revenueGrowthPct = totalRevenueLYYTD ? ((totalRevenueYTD - totalRevenueLYYTD) / totalRevenueLYYTD) * 100 : null;
      var revenueTargetYTD = sumTargetWindow(startYear, opco, elapsed);
      var revenueTargetFY = sumTargetWindow(startYear, opco, 12);
      var pctToTargetYTD = revenueTargetYTD ? (totalRevenueYTD / revenueTargetYTD * 100) : null;
      var pctToTargetFY = revenueTargetFY ? (totalRevenueYTD / revenueTargetFY * 100) : null;

      var fyKeys = {}; months.forEach(function (d) { fyKeys[monthKey(d)] = true; });
      var streamTotals = aggregateBy(
        RAW.projects.filter(function (r) { return matches(r.entity, opco) && fyKeys[monthKey(r.month)]; }),
        function (r) { return r.stream; }, function (r) { return r.revenue; }
      );
      var streamItems = Object.keys(streamTotals).map(function (k) { return { label: k, value: streamTotals[k] }; })
        .sort(function (a, b) { return b.value - a.value; });

      var kpiHtml =
        kpiCard("Total Revenue YTD", fmtMoneyAbbrev(totalRevenueYTD)) +
        kpiCard("Revenue Target YTD", fmtMoneyAbbrev(revenueTargetYTD), { subText: pctToTargetYTD != null ? pctToTargetYTD.toFixed(1) + "% to Target" : null }) +
        kpiCard("Revenue Target FY", fmtMoneyAbbrev(revenueTargetFY), { subText: pctToTargetFY != null ? pctToTargetFY.toFixed(1) + "% to Target" : null }) +
        kpiCard("Yearly Revenue Growth", revenueGrowthPct == null ? "—" : Math.round(revenueGrowthPct) + "%");

      var revenuePanel =
        '<div class="panel"><div class="panel-header">Total Revenue by Month<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        renderBarWithTarget(revValues, targetValues, xLabels, { yFmt: fmtMoneyAbbrev, barColor: "#244744", targetColor: "#bfe0cd" }) +
        '<div class="legend">' +
        '<span class="legend-item"><span class="legend-swatch" style="background:#14201c"></span>Total Revenue</span>' +
        '<span class="legend-item"><span class="legend-dash" style="background:#bfe0cd"></span>Revenue Target</span>' +
        "</div></div></div>";

      var streamPanel =
        '<div class="panel"><div class="panel-header">Total Revenue by Project Stream<span class="chevron">▾</span></div>' +
        '<div class="panel-body">' +
        (streamItems.length ? renderPieChart(streamItems, PIE_COLORS) : '<div class="panel-note">No data in scope.</div>') +
        "</div></div>";

      document.getElementById("page-revenue").innerHTML =
        '<div class="kpi-row">' + kpiHtml + "</div>" +
        '<div class="panels-grid">' + revenuePanel + streamPanel + "</div>";
    }

    // ---- Deals Overview page ----
    // No Financial Year selector in the reference report — its KPIs are inherently
    // "current quarter" snapshots, so this ignores the shared FY dropdown and uses
    // the real current date instead. Only OpCo applies.
    function renderDealsPage(opco) {
      var today = new Date();
      var cur = fyQuarterInfo(today);
      var prev = prevQuarter(cur.startYear, cur.q);
      var curRange = fyQuarterRange(cur.startYear, cur.q);
      var prevRange = fyQuarterRange(prev.startYear, prev.q);
      var fyStartDate = new Date(cur.startYear, 6, 1);

      var dealsInScope = RAW.deals.filter(function (d) { return matches(d.entity, opco); });
      function wonIn(range) { return dealsInScope.filter(function (d) { return d.bucket === "won" && d.closeDate >= range.start && d.closeDate <= range.end; }); }
      function lostIn(range) { return dealsInScope.filter(function (d) { return d.bucket === "lost" && d.closeDate >= range.start && d.closeDate <= range.end; }); }

      var wonCur = wonIn(curRange), wonPrev = wonIn(prevRange);
      var lostCur = lostIn(curRange), lostPrev = lostIn(prevRange);

      var wonAmountCur = wonCur.reduce(function (s, d) { return s + d.amount; }, 0);
      var wonAmountPrev = wonPrev.reduce(function (s, d) { return s + d.amount; }, 0);
      var wonAmountDeltaPct = wonAmountPrev ? ((wonAmountCur - wonAmountPrev) / wonAmountPrev) * 100 : null;

      var convCur = (wonCur.length + lostCur.length) ? (wonCur.length / (wonCur.length + lostCur.length)) * 100 : null;
      var convPrev = (wonPrev.length + lostPrev.length) ? (wonPrev.length / (wonPrev.length + lostPrev.length)) * 100 : null;
      var convDeltaPP = (convCur != null && convPrev != null) ? (convCur - convPrev) : null;

      var avgDealCur = wonCur.length ? wonAmountCur / wonCur.length : 0;
      var avgDealPrev = wonPrev.length ? wonAmountPrev / wonPrev.length : 0;
      var avgDealDeltaPct = avgDealPrev ? ((avgDealCur - avgDealPrev) / avgDealPrev) * 100 : null;

      var openDeals = dealsInScope.filter(function (d) { return d.bucket === "open" && d.closeDate >= fyStartDate; });
      var openPipeline = openDeals.reduce(function (s, d) { return s + d.amount; }, 0);

      var kpiHtml =
        kpiCard("Won Amount - Current FQ", fmtMoneyAbbrev(wonAmountCur), { deltaPct: wonAmountDeltaPct }) +
        kpiCard("Conversion Rate - Current FQ", convCur == null ? "—" : Math.round(convCur) + "%",
          { subText: convDeltaPP != null ? (convDeltaPP >= 0 ? "+" : "") + convDeltaPP.toFixed(1) + " pp vs Prev Q" : null }) +
        kpiCard("Avg. Deal Size Won - Current FQ", fmtMoneyAbbrev(avgDealCur), { deltaPct: avgDealDeltaPct }) +
        kpiCard("Open Pipeline", fmtMoneyAbbrev(openPipeline));

      var stageAll = dealsInScope.filter(function (d) { return d.closeDate >= fyStartDate; });
