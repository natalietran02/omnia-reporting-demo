<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omnia Reporting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  :root {
    --oc-deep-teal:     #014348;
    --oc-deep-teal-700: #013236;
    --oc-mid-teal:      #3D7373;
    --oc-mint:          #C1EFA5;
    --oc-mint-soft:     #D8F8C7;
    --oc-mint-deep:     #9DD27D;
    --oc-coral:         #FC836D;
    --oc-coral-soft:    #FFD9D1;
    --oc-negative:      #C0392B;

    --oc-ink:      #000000;
    --oc-graphite: #434343;
    --oc-slate:    #595959;
    --oc-mist:     #EEEEEE;
    --oc-paper:    #FFFFFF;

    --bg:         var(--oc-paper);
    --bg-inverse: var(--oc-deep-teal);
    --bg-muted:   var(--oc-mist);

    --fg1: var(--oc-ink);
    --fg2: var(--oc-graphite);
    --fg3: var(--oc-slate);
    --fg-on-dark-1: var(--oc-paper);
    --fg-on-dark-2: var(--oc-mint);
    --fg-on-dark-3: #B7CFCF;

    --rule: rgba(0,0,0,0.12);
    --rule-on-dark: rgba(255,255,255,0.18);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --radius-xl: 28px;
    --radius-pill: 999px;

    --shadow-1: 0 1px 2px rgba(1,67,72,0.06), 0 1px 1px rgba(1,67,72,0.04);
    --shadow-2: 0 4px 12px rgba(1,67,72,0.08), 0 2px 4px rgba(1,67,72,0.04);
    --shadow-3: 0 16px 40px rgba(1,67,72,0.12), 0 4px 12px rgba(1,67,72,0.06);

    --font-sans: "Manrope", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font-sans); color: var(--fg1); background: var(--bg-muted); display: flex; flex-direction: column; }
  button, select, input, textarea { font-family: inherit; }

  .app { display: flex; flex-direction: column; min-height: 100vh; }

  header.oc-header { background: var(--bg-inverse); color: var(--fg-on-dark-1); position: sticky; top: 0; z-index: 30; flex: 0 0 auto; }
  .oc-header-row { display: flex; align-items: center; gap: 20px; padding: 14px 32px; flex-wrap: wrap; }
  .oc-wordmark { font-size: 19px; font-weight: 800; color: var(--oc-mint); letter-spacing: -0.02em; line-height: 1.1; }
  .oc-wordmark-sub { font-size: 10.5px; color: var(--fg-on-dark-3); }
  .oc-company-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .oc-pill {
    padding: 7px 14px; border-radius: var(--radius-pill); border: 1px solid transparent;
    background: rgba(255,255,255,0.06); color: var(--fg-on-dark-1);
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .oc-pill.active { background: var(--oc-mint); color: var(--oc-deep-teal-700); border-color: var(--oc-mint); }

  .oc-toolbar { display: flex; align-items: center; gap: 14px; margin-left: auto; flex-wrap: wrap; }
  .oc-toolbar-divider { width: 1px; height: 22px; background: var(--rule-on-dark); }

  .oc-period-wrap { position: relative; }
  .oc-period-btn {
    display: flex; align-items: center; gap: 10px; white-space: nowrap;
    background: rgba(255,255,255,0.06); color: var(--fg-on-dark-1); border: 1px solid var(--rule-on-dark);
    border-radius: var(--radius-md); padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .oc-eyebrow-inline { font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-on-dark-3); }
  .oc-period-panel {
    display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 60;
    width: 460px; max-height: 480px; overflow-y: auto; background: #fff; color: var(--fg1);
    border: 1px solid var(--rule); border-radius: var(--radius-lg); box-shadow: var(--shadow-3); padding: 16px 18px;
  }
  .oc-period-panel.open { display: block; }
  .oc-period-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .oc-period-panel-title { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg3); }
  .oc-period-done { background: none; border: none; font-size: 12px; font-weight: 700; color: var(--oc-deep-teal); cursor: pointer; }
  .oc-banner { font-size: 12.5px; color: var(--oc-deep-teal-700); background: var(--oc-mint-soft); border-radius: var(--radius-md); padding: 10px 12px; line-height: 1.45; margin-bottom: 12px; }
  .oc-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .oc-preset-btn { padding: 6px 11px; border-radius: var(--radius-pill); border: 1px solid var(--rule); background: var(--bg); color: var(--fg2); font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .oc-fy-group { margin-bottom: 14px; }
  .oc-fy-head { display: flex; align-items: center; gap: 9px; width: 100%; background: none; border: none; padding: 0 0 8px; cursor: pointer; text-align: left; }
  .oc-fy-label { font-size: 13px; font-weight: 700; color: var(--fg1); }
  .oc-month-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .oc-month-btn { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 6px 8px; border-radius: var(--radius-sm); border: 1px solid var(--rule); background: var(--bg); cursor: pointer; }
  .oc-month-checkbox {
    width: 14px; height: 14px; flex: none; border-radius: 3px; border: 1.5px solid var(--rule); background: var(--bg);
    display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: #fff; line-height: 1;
  }
  .oc-month-btn.checked { border-color: var(--oc-mint-deep); background: var(--oc-mint-soft); }
  .oc-month-btn.checked .oc-month-checkbox { background: var(--oc-deep-teal); border-color: var(--oc-deep-teal); }
  .oc-month-btn-label { font-size: 11.5px; font-weight: 600; color: var(--fg2); white-space: nowrap; display: flex; align-items: center; gap: 4px; line-height: 1; }
  .oc-month-btn:disabled, .oc-fy-head:disabled { opacity: 0.4; cursor: not-allowed; }
  .oc-now-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--oc-coral); display: inline-block; }
  .oc-period-footnote { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg3); margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--rule); }

  .oc-compare-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .oc-compare-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-on-dark-3); }
  .oc-compare-select { background: rgba(255,255,255,0.06); color: var(--fg-on-dark-1); border: 1px solid var(--rule-on-dark); border-radius: var(--radius-md); padding: 8px 10px; font-size: 13px; font-weight: 600; cursor: pointer; width: 180px; flex-shrink: 0; }
  .oc-compare-select option { color: #111; }
  .oc-compare-dates { font-size: 12px; color: var(--fg-on-dark-3); white-space: nowrap; max-width: 190px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: middle; }

  .oc-filter-bar { display: flex; align-items: center; gap: 10px; padding: 9px 32px; border-top: 1px solid var(--rule-on-dark); background: rgba(255,255,255,0.04); overflow-x: auto; }
  .oc-filter-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-on-dark-3); white-space: nowrap; }
  .oc-filter-select { background: rgba(255,255,255,0.06); color: var(--fg-on-dark-1); border: 1px solid var(--rule-on-dark); border-radius: var(--radius-md); padding: 6px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .oc-filter-select option { color: #111; }

  .oc-signin-btn {
    background: rgba(255,255,255,0.06); color: var(--fg-on-dark-1); border: 1px solid var(--rule-on-dark);
    border-radius: var(--radius-md); padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .oc-signin-btn:hover { background: rgba(255,255,255,0.12); }
  .oc-signin-btn:disabled { cursor: default; opacity: .85; }
  #oc-access-btn { display: none; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.06); color: #fff; border: 1px solid var(--rule-on-dark); cursor: pointer; }

  nav.oc-nav { display: flex; gap: 22px; padding: 0 32px; border-top: 1px solid var(--rule-on-dark); overflow-x: auto; }
  .oc-nav-btn { display: block; padding: 11px 0; font-size: 13px; font-weight: 600; color: #fff; border: none; border-bottom: 2px solid transparent; white-space: nowrap; background: none; cursor: pointer; }
  .oc-nav-btn.active { color: var(--oc-mint); border-bottom-color: var(--oc-mint); }

  .oc-pill-toggle { display: inline-flex; gap: 2px; background: var(--bg-muted); border-radius: var(--radius-pill); padding: 3px; }
  .oc-pill-toggle button { padding: 5px 14px; border-radius: var(--radius-pill); border: none; background: transparent; color: var(--fg2); font-size: 12px; font-weight: 700; cursor: pointer; }
  .oc-pill-toggle button.active { background: var(--bg); color: var(--oc-deep-teal-700); box-shadow: var(--shadow-1); }
  .oc-pill-toggle button:disabled { opacity: 0.35; cursor: not-allowed; }

  main.oc-main { flex: 1; min-width: 0; padding: 32px 40px 96px; max-width: 2200px; margin: 0 auto; width: 100%; }

  .oc-kpi-grid { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 28px; }
  .oc-kpi-card { background: var(--bg); border: 1px solid var(--rule); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); padding: 18px 18px 16px; flex: 1 1 160px; min-width: 160px; }
  .oc-kpi-clickable { cursor: pointer; transition: box-shadow 120ms ease; }
  .oc-kpi-clickable:hover { box-shadow: var(--shadow-2); }
  .oc-kpi-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg3); margin-bottom: 10px; }
  .oc-kpi-value { font-size: clamp(16px, 2.1vw, 26px); font-weight: 800; color: var(--fg1); letter-spacing: -0.01em; overflow-wrap: break-word; line-height: 1.15; }
  .oc-kpi-delta-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .oc-badge { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: var(--radius-sm); }
  .oc-badge.up { background: var(--oc-mint-soft); color: var(--oc-deep-teal-700); }
  .oc-badge.down { background: var(--oc-coral-soft); color: #9c2b1a; }
  .oc-badge.neutral { background: var(--bg-muted); color: var(--fg3); }
  .oc-caption { font-size: 11.5px; color: var(--fg3); }

  .oc-panel { background: var(--bg); border: 1px solid var(--rule); border-radius: var(--radius-xl); box-shadow: var(--shadow-1); padding: 24px 28px; margin-bottom: 20px; }
  .oc-panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .oc-panel-title { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  .oc-panel-sub { font-size: 13px; color: var(--fg3); margin-bottom: 18px; }
  .oc-icon-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--radius-pill); border: 1px solid var(--rule); background: var(--bg); color: var(--fg3); cursor: pointer; box-shadow: var(--shadow-1); flex-shrink: 0; }

  .oc-legend { display: flex; gap: 14px; align-items: center; font-size: 11px; color: var(--fg3); margin-bottom: 12px; flex-wrap: wrap; }
  .oc-legend span.sw { display: inline-flex; align-items: center; gap: 5px; }
  .oc-sw-box { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .oc-sw-dash { width: 16px; height: 0; display: inline-block; border-top: 2px dashed; }

  .oc-cum-row { display: flex; align-items: flex-end; justify-content: center; gap: 6px; padding: 16px 4px 0; }
  .oc-cum-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .oc-cum-label { font-size: 10px; font-weight: 800; color: var(--oc-deep-teal); white-space: nowrap; text-align: center; }
  .oc-cum-bar-wrap { position: relative; width: 100%; height: 180px; display: flex; align-items: flex-end; justify-content: center; }
  .oc-cum-target-line { position: absolute; left: 2%; right: 2%; height: 0; border-top: 2px dashed var(--oc-coral); }
  .oc-cum-bar { box-sizing: border-box; width: 100%; max-width: 34px; border-radius: 4px 4px 0 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; background: rgba(1,67,72,0.16); }
  .oc-cum-bar-seg { min-height: 3px; background: var(--oc-deep-teal); }
  .oc-cum-month-row { display: flex; justify-content: center; gap: 6px; padding: 6px 4px 0; }
  .oc-cum-month-col { flex: 1 1 0; min-width: 0; text-align: center; }
  .oc-cum-month-label { font-size: 10px; font-weight: 700; color: var(--fg2); white-space: nowrap; }
  .oc-cum-year-label { font-size: 8.5px; color: var(--fg3); opacity: 0.7; }

  .oc-multiples-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 48px; margin-top: 24px; }
  @media (max-width: 800px) { .oc-multiples-grid { grid-template-columns: 1fr; } }
  .oc-multiple-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .oc-multiple-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg3); }
  .oc-multiple-legend { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--fg2); }
  .oc-spark-wrap { position: relative; padding: 0 4px; margin: 14px 0; }
  .oc-spark-dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--bg); transform: translate(-50%,-50%); box-shadow: var(--shadow-1); }

  .oc-barlist { display: flex; flex-direction: column; gap: 36px; padding-bottom: 20px; }
  .oc-barlist-row { display: flex; flex-direction: column; gap: 5px; }
  .oc-barlist-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .oc-barlist-name { font-size: 12.5px; color: var(--fg1); font-weight: 600; overflow-wrap: break-word; min-width: 0; }
  .oc-barlist-track { background: var(--bg-muted); border-radius: var(--radius-sm); height: 14px; overflow: visible; position: relative; }
  .oc-barlist-fill { height: 100%; background: var(--oc-deep-teal); border-radius: var(--radius-sm); overflow: hidden; }
  .oc-barlist-value { font-size: 12.5px; font-weight: 700; color: var(--fg2); white-space: nowrap; flex-shrink: 0; }
  .oc-barlist-marker { position: absolute; top: -2px; bottom: -2px; width: 0; border-left: 2px dashed var(--oc-coral); filter: drop-shadow(0 0 1px rgba(0,0,0,0.35)); }

  .oc-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .oc-two-col { grid-template-columns: 1fr; } }

  .oc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .oc-table th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg3); padding: 8px 10px; border-bottom: 1px solid var(--rule); }
  .oc-table td { padding: 9px 10px; border-bottom: 1px solid var(--rule); color: var(--fg2); }
  .oc-table tr:last-child td { border-bottom: none; }
  .oc-note { font-size: 12.5px; color: var(--fg3); background: var(--bg-muted); border-radius: var(--radius-md); padding: 10px 14px; margin-top: 14px; line-height: 1.5; }
  .oc-not-ready { font-size: 13px; color: var(--fg3); background: var(--bg-muted); border-radius: var(--radius-md); padding: 16px 18px; line-height: 1.55; }
  .oc-not-ready-tag { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--oc-coral); background: var(--oc-coral-soft); padding: 3px 8px; border-radius: var(--radius-sm); margin-right: 8px; vertical-align: middle; }

  .oc-empty-panel { padding: 60px 20px; text-align: center; color: var(--fg3); font-size: 14px; }
  .oc-analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 32px; align-items: start; }
  @media (max-width: 900px) { .oc-analytics-grid { grid-template-columns: 1fr; } }
  .oc-analytics-grid .oc-barlist { gap: 16px; }

  .oc-loading, .oc-error { font-size: 14px; color: var(--fg3); padding: 60px; text-align: center; }
  .oc-error { color: var(--oc-coral); }

  .oc-donut { border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .oc-donut-hole { width: 68px; height: 68px; border-radius: 50%; background: var(--bg); }
  .oc-donut-legend-row { display: flex; align-items: center; gap: 9px; }
  .oc-donut-swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
  .oc-aging-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .oc-aging-table th { text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg3); padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
  .oc-aging-table td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--rule); }
  .oc-aging-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-pill); white-space: nowrap; }

  .oc-funnel-row { display: flex; flex-direction: column; align-items: center; }
  .oc-funnel-bar { border-radius: var(--radius-md); padding: 12px 16px; text-align: center; color: #fff; width: 100%; }
  .oc-funnel-title { font-size: 13px; font-weight: 700; overflow-wrap: break-word; }
  .oc-funnel-sub { font-size: 12px; opacity: 0.9; overflow-wrap: break-word; }
  .oc-deal-list-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
  .oc-deal-list-row:last-child { border-bottom: none; }

  .oc-feedback-fab { position: fixed; bottom: 28px; left: 28px; width: 52px; height: 52px; background: var(--bg-inverse); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-3); z-index: 400; border: none; transition: transform .2s, box-shadow .2s; }
  .oc-feedback-fab:hover { transform: scale(1.08); }
  .oc-feedback-fab .material-symbols-outlined { color: var(--fg-on-dark-1); font-size: 22px; }
  @media (max-width: 460px) { .oc-feedback-fab { left: 20px; } }
  .oc-feedback-textarea { display: block; width: 100%; min-height: 120px; border: 1px solid var(--rule); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; font-family: inherit; color: var(--fg1); resize: vertical; }
  .oc-feedback-textarea:focus { border-color: var(--oc-mid-teal); outline: none; }

  .oc-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(1,67,72,0.55); z-index: 200; align-items: flex-start; justify-content: center; padding: 60px 20px; overflow-y: auto; }
  .oc-modal-overlay.open { display: flex; }
  .oc-modal { background: var(--bg); border-radius: var(--radius-xl); width: 100%; max-width: 640px; box-shadow: var(--shadow-3); overflow: hidden; }
  .oc-modal-head { background: var(--bg-inverse); color: var(--fg-on-dark-1); padding: 18px 24px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .oc-modal-head h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
  .oc-modal-head .oc-modal-meta { font-size: 11px; color: var(--fg-on-dark-3); }
  .oc-modal-close { background: transparent; border: 1px solid var(--rule-on-dark); color: #fff; width: 28px; height: 28px; border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; flex-shrink: 0; }
  .oc-modal-body { padding: 20px 24px; max-height: 65vh; overflow-y: auto; }
  .oc-modal-foot { padding: 14px 24px; background: var(--bg-muted); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .oc-modal-foot .oc-modal-close { width: auto; height: auto; font-size: 12.5px; }
  .oc-field-label { font-size: 11px; font-weight: 700; color: var(--fg2); text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 6px; }
  .oc-field-input, .oc-field-textarea, .oc-field-select { width: 100%; border: 1px solid var(--rule); border-radius: var(--radius-md); padding: 9px 12px; font-family: inherit; font-size: 13px; color: var(--fg1); box-sizing: border-box; margin-bottom: 14px; background: var(--bg); }
  .oc-btn { padding: 8px 16px; border-radius: var(--radius-md); font-size: 12.5px; font-weight: 700; cursor: pointer; border: none; }
  .oc-btn-ghost { background: var(--bg-muted); color: var(--fg1); }
  .oc-btn-primary { background: var(--oc-deep-teal); color: #fff; }
  .oc-btn-danger { background: var(--oc-coral-soft); color: #9c2b1a; }
  .oc-btn:disabled { opacity: 0.5; cursor: wait; }
  .oc-ask-status { font-size: 12.5px; color: var(--fg3); min-height: 16px; }
  .oc-ask-status.oc-ask-error { color: var(--oc-coral); }
  .oc-ask-status.oc-ask-ok { color: var(--oc-mid-teal); }
  .oc-editor-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 13px; gap: 10px; }
  .oc-editor-row:last-child { border-bottom: none; }
  .oc-role-chip { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-pill); text-transform: uppercase; background: var(--bg-muted); color: var(--fg2); flex-shrink: 0; }
  .oc-role-chip.admin { background: var(--oc-deep-teal); color: #fff; }

  @media print { .oc-feedback-fab { display: none; } }
</style>
</head>
<body>
  <div class="app">
    <header class="oc-header">
      <div class="oc-header-row">
        <div>
          <div class="oc-wordmark">Omnia Reporting</div>

          <div class="oc-toolbar-divider"></div>
          <button id="oc-access-btn" title="Manage who can view this dashboard">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
          </button>
          <button id="oc-signin-btn" class="oc-signin-btn">Sign in to view</button>
        </div>
      </div>
      <nav class="oc-nav" id="oc-nav"></nav>
      <div class="oc-filter-bar">
        <span class="oc-filter-label">Filter</span>
        <select class="oc-filter-select" id="oc-alliance-select" title="Not backed by real data yet">
          <option value="all">All alliances</option>
        </select>
        <select class="oc-filter-select" id="oc-division-select"></select>
        <select class="oc-filter-select" id="oc-projects-select">
          <option value="all">All projects</option>
          <option value="ai">AI projects</option>

    <main class="oc-main">

      <div id="oc-error" class="oc-error" style="display:none;"></div>

  </div>

  <button id="oc-feedback-fab" class="oc-feedback-fab" title="Send feedback" style="display:none;">
    <span class="material-symbols-outlined" aria-hidden="true">chat_bubble</span>
  </button>
  <div id="feedback-modal-overlay" class="oc-modal-overlay">
    <div class="oc-modal">
      <div class="oc-modal-head">
        <div><h3>Send feedback</h3></div>
        <button class="oc-modal-close" id="feedback-close-btn">&#10005;</button>
      </div>
      <div class="oc-modal-body">
        <textarea id="feedback-message" class="oc-feedback-textarea" placeholder="What's on your mind?"></textarea>
        <div id="feedback-status" class="oc-ask-status"></div>
      </div>
      <div class="oc-modal-foot">
        <button class="oc-btn oc-btn-ghost" id="feedback-cancel-btn">Cancel</button>
        <button class="oc-btn oc-btn-primary" id="feedback-send-btn">Send</button>
      </div>
    </div>
  </div>

  <div id="access-modal-overlay" class="oc-modal-overlay">
    <div class="oc-modal">
      <div class="oc-modal-head">
        <div><h3>Manage access</h3><div class="oc-modal-meta">Controls who can sign in and view this dashboard at all</div></div>
        <button class="oc-modal-close" id="access-close-btn">&#10005;</button>
      </div>
      <div class="oc-modal-body">
        <div id="access-list"></div>
        <div style="margin-top:20px; padding-top:16px; border-top:1px solid var(--rule);">
          <label class="oc-field-label">Add / update person — email</label>

          <label class="oc-field-label">Role</label>

            <option value="user">user — can view</option>
            <option value="admin">admin — can also manage access</option>

          <div id="access-status" class="oc-ask-status"></div>
        </div>
      </div>
      <div class="oc-modal-foot">
        <button class="oc-btn oc-btn-ghost" id="access-close-btn-2">Close</button>
        <button class="oc-btn oc-btn-primary" id="access-save-btn">Add / Update</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.20.0/lib/msal-browser.min.js"></script>
  <script>
    // ---- Fixed config for this demo ----
    var TENANT_ID = "dc65b585-fcd8-46a4-a44e-e7e871a725be"; // edgered.com.au
    var CLIENT_ID = "48ca88b2-1fff-427d-b801-8e4593ebafba"; // shared app registration (embed-app / semantic-app)
    var WORKSPACE_ID = "bbbd2ec3-1085-4a2c-af8a-a0f82fa49f76";
    var DATASET_ID = "8c11a7f7-0992-4591-b51a-50889e641617"; // "Omnia Reporting Demo" semantic model
    var POWERBI_SCOPE = "https://analysis.windows.net/powerbi/api/Dataset.Read.All";
    // Workspace.ReadWrite.All is ONLY requested via getPowerBiAdminToken()
    // below, used exclusively by the Manage Access Add/Deactivate handlers —
    // NOT bundled into every regular sign-in. It used to be, which meant
    // every plain viewer (not just admins) was asked to consent to "Read
    // and write all workspaces" just to open the dashboard: unnecessary,
    // confusing, and itself a source of sign-in failures unrelated to
    // whether that person could actually view the report.
    var POWERBI_ADMIN_SCOPES = [POWERBI_SCOPE, "https://analysis.windows.net/powerbi/api/Workspace.ReadWrite.All"];

    // Feedback writes to a dedicated Excel workbook via Microsoft Graph — a
    // separate concern from the Power BI dataset query above, since it needs
    // Graph's Files.ReadWrite scope (not Dataset.Read.All) and a real Excel
    // file to write into. Addressed by driveId+itemId (resolved once via the
    // Graph shares API — see project notes) rather than by the sharing link
    // itself: the link grants edit access to whoever holds it, so embedding
    // it directly in this client-side page would leak an editable link to
    // anyone who views the page source. driveId/itemId are just identifiers —
    // Graph still enforces access based on the signed-in caller's own
    // permission on the item, so these are safe to ship. The app registration
    // (CLIENT_ID above) needs the Files.ReadWrite(.All) delegated Graph
    // permission added and consented, and the target file needs to actually
    // be shared (normal SharePoint/OneDrive permissions) with whoever should
    // be able to submit feedback.
    var FEEDBACK_DRIVE_ID = "b!nxzo85sDP0SbRvi-9_y_KVyL_Ahv4PJPifSrs1JXiuHYUPJ6ZuClQJmQ-gq4ilWE";
    var FEEDBACK_ITEM_ID = "01MFUWM2QFPLMV4GOQBNCZP5ZXH6WOPKVV";
    // Mail.Send added alongside Files.ReadWrite so the same token covers both
    // saving the row and sending the notification email — one token request,
    // one consent prompt. Requested as an array since MSAL happily bundles
    // multiple delegated scopes for the same resource (Graph) into one call.
    var FEEDBACK_GRAPH_SCOPES = ["https://graph.microsoft.com/Files.ReadWrite", "https://graph.microsoft.com/Mail.Send"];
    var FEEDBACK_SHEET_NAME = "Feedback";
    var FEEDBACK_TABLE_NAME = "FeedbackTable";
    var FEEDBACK_NOTIFY_EMAIL = "natalie@edgered.com.au";
    var feedbackConfigured = !!(FEEDBACK_DRIVE_ID && FEEDBACK_ITEM_ID);

    // ---- Access allowlist (who may sign in and view this dashboard) ----
    // Stored as a second table in the same workbook as feedback — no new
    // Graph permission needed, since Files.ReadWrite.All already covers it.
    // BOOTSTRAP_ADMIN_EMAILS always pass the check regardless of what's in
    // the sheet (even if the sheet is empty, missing, or unreachable) — this
    // is what prevents a chicken-and-egg lockout on first use, mirroring the
    // Apps Script version's ADMIN_EMAIL/seedInitialAccessUsers() pattern.
    // Bootstrap admins use the Manage Access panel to add everyone else.
    var BOOTSTRAP_ADMIN_EMAILS = ["natalie@edgered.com.au", "wil@edgered.com.au", "nathan@edgered.com.au"];
    var ACCESS_SHEET_NAME = "AccessUsers";
    var ACCESS_TABLE_NAME = "AccessUsersTable";

    // ---- DAX queries ----
    // Revenue vs. target: one row per entity/month, both actual and target in the same table.
    var Q_REVENUE_TARGET =
      "EVALUATE\n" +
      "SUMMARIZECOLUMNS(\n" +
      "    data_revenue_target[month_date],\n" +
      "    data_revenue_target[entity],\n" +
      "    \"Revenue\", SUM(data_revenue_target[total_revenue]),\n" +
      "    \"RevenueTarget\", SUM(data_revenue_target[revenue_target])\n" +
      ")\n" +
      "ORDER BY data_revenue_target[month_date]";

    // Project/client/industry/stream revenue mix all come from this one fact table,
    // so a single richer query covers every breakdown used across the three pages.
    var Q_PROJECT_FACT =
      "EVALUATE\n" +
      "SUMMARIZECOLUMNS(\n" +
      "    data_powerbi_unified_fact[month_date],\n" +
      "    data_powerbi_unified_fact[entity],\n" +
      "    data_powerbi_unified_fact[client_name],\n" +
      "    data_powerbi_unified_fact[client_industry],\n" +
      "    data_powerbi_unified_fact[Project_Name],\n" +
      "    data_powerbi_unified_fact[project_stream],\n" +
      "    \"TotalRevenue\", SUM(data_powerbi_unified_fact[total_revenue]),\n" +
      // Added to unlock gross-margin breakdowns (Client Deep Dive, Projects
      // page) and the FTE/avg-daily-rate figures Client Deep Dive is missing —
      // pure additive SUM measures on the same table/grain as TotalRevenue
      // above, column names per Code.js's TABS.unifiedFact comment, not yet
      // confirmed against the live model.
      "    \"GrossMargin\", SUM(data_powerbi_unified_fact[gross_margin]),\n" +
      "    \"Headcount\", SUM(data_powerbi_unified_fact[headcount]),\n" +
      "    \"TotalDays\", SUM(data_powerbi_unified_fact[total_days])\n" +
      ")\n" +
      "ORDER BY data_powerbi_unified_fact[month_date]";

    // Deal-level rows: pipeline, win rate, deal size and new-client KPIs are all derived
    // client-side from this, since none of them are pre-aggregated in the model.
    var Q_DEALS =
      "EVALUATE\n" +
      "SELECTCOLUMNS(\n" +
      "    data_hubspot_deals,\n" +
      "    \"Company\", data_hubspot_deals[Company],\n" +
      "    \"OmniaCompany\", data_hubspot_deals[Omnia_Company],\n" +
      "    \"DealName\", data_hubspot_deals[Deal_Name],\n" +
      "    \"DealStage\", data_hubspot_deals[Deal_Stage],\n" +
      "    \"Confidence\", data_hubspot_deals[Confidence],\n" +
      "    \"CloseDate\", data_hubspot_deals[Close_Date],\n" +
      "    \"Amount\", data_hubspot_deals[Amount],\n" +
      // Added to unlock the Deals page's probability breakdown, stalled/aging
      // deals, new-deals trend, weighted pipeline, and lost-reasons sections —
      // same table as every column above, column names taken from Code.gs's
      // documented header, but not yet confirmed against the live model
      // (same caveat as the Phase 1 additions below).
      "    \"OpenDate\", data_hubspot_deals[Open_Date],\n" +
      "    \"LastUpdated\", data_hubspot_deals[Last_Updated],\n" +
      "    \"DealProbability\", data_hubspot_deals[Deal_Probability],\n" +
      "    \"DealLostReason\", data_hubspot_deals[Deal_Lost_Reason],\n" +
      "    \"IsStalled\", data_hubspot_deals[Is_Stalled],\n" +
      "    \"StageEnteredDate\", data_hubspot_deals[Stage_Entered_Date],\n" +
      "    \"WeightedOpenPipeline\", data_hubspot_deals[Weighted_Open_Pipeline],\n" +
      "    \"AlliancePartners\", data_hubspot_deals[Alliance_Partners],\n" +
      "    \"LoggedInPartnerPortal\", data_hubspot_deals[Logged_In_Partner_Portal]\n" +
      ")";

    // Row-level utilisation: KPIs need distinct-user and monthly-average math that
    // isn't a simple SUM, so this pulls raw rows rather than pre-aggregating.
    var Q_UTILISATION =
      "EVALUATE\n" +
      "SELECTCOLUMNS(\n" +
      "    data_utilisation,\n" +
      "    \"Month\", data_utilisation[Month],\n" +
      "    \"Entity\", data_utilisation[Omnia_Company],\n" +
      "    \"EmploymentBasis\", data_utilisation[employment_basis],\n" +
      "    \"IsBillable\", data_utilisation[is_billable_staff],\n" +
      "    \"FTE\", data_utilisation[FTE],\n" +
      "    \"DailyRate\", data_utilisation[daily_rate],\n" +
      "    \"InvoicedDays\", data_utilisation[invoiced_days],\n" +
      "    \"LeaveDays\", data_utilisation[leave_days],\n" +
      "    \"UtilisationPct\", data_utilisation[utilisation_pct],\n" +
      "    \"UserId\", data_utilisation[userId],\n" +
      // Added to unlock the Revenue page's Driver Tree / Waterfall, which need
      // NWD (available_days ÷ FTE) and billed revenue per employee-month —
      // same data_utilisation table as every column above, column names taken
      // from Code.gs's documented header, but not yet confirmed against the
      // live model (see the Phase 1 note below — same caveat applies here).
      "    \"AvailableDays\", data_utilisation[available_days],\n" +
      "    \"BilledAmount\", data_utilisation[billed_amount]\n" +
      ")";

    // ---- Phase 1 additions (unverified against the live semantic model —
    // see executeDaxQueries below: a failed query here returns [] instead
    // of aborting the whole load, so a wrong column name can't take down
    // the queries above that are already confirmed working). Field names
    // are taken from Code.gs/Seed.gs's documented Sheet headers, which is
    // the best available source of truth, but the Power BI model has
    // already shown at least one casing deviation from that source
    // (Project_Name above is capitalized in the model but lowercase in the
    // Sheet), so these may need column-name fixes after a live test. ----
    var Q_PL =
      "EVALUATE\n" +
      "SUMMARIZECOLUMNS(\n" +
      "    data_pl[month],\n" +
      "    data_pl[Omnia_Company],\n" +
      "    \"RevenueActual\", SUM(data_pl[revenue_actual]),\n" +
      "    \"RevenueBudget\", SUM(data_pl[revenue_budget]),\n" +
      "    \"GrossMarginActual\", SUM(data_pl[gross_margin_actual]),\n" +
      "    \"GrossMarginForecast\", SUM(data_pl[gross_margin_forecast]),\n" +
      "    \"GpBudget\", SUM(data_pl[gp_budget]),\n" +
      "    \"EbitdaActual\", SUM(data_pl[ebitda_actual]),\n" +
      "    \"EbitdaBudget\", SUM(data_pl[ebitda_budget]),\n" +
      "    \"DirectCostsActual\", SUM(data_pl[direct_costs_actual]),\n" +
      "    \"DirectCostsForecast\", SUM(data_pl[direct_costs_forecast]),\n" +
      "    \"OperatingExpensesActual\", SUM(data_pl[operating_expenses_actual]),\n" +
      "    \"OperatingExpensesForecast\", SUM(data_pl[operating_expenses_forecast]),\n" +
      "    \"WagesIndirectActual\", SUM(data_pl[wages_salaries_indirect_actual]),\n" +
      "    \"WagesIndirectForecast\", SUM(data_pl[wages_salaries_indirect_forecast]),\n" +
      "    \"EmployeeBenefitsActual\", SUM(data_pl[employee_benefits_actual]),\n" +
      "    \"EmployeeBenefitsForecast\", SUM(data_pl[employee_benefits_forecast]),\n" +
      "    \"SalesMarketingActual\", SUM(data_pl[sales_marketing_actual]),\n" +
      "    \"SalesMarketingForecast\", SUM(data_pl[sales_marketing_forecast]),\n" +
      "    \"TravelActual\", SUM(data_pl[travel_expenses_actual]),\n" +
      "    \"TravelForecast\", SUM(data_pl[travel_expenses_forecast]),\n" +
      "    \"AdminActual\", SUM(data_pl[administrative_expenses_actual]),\n" +
      "    \"AdminForecast\", SUM(data_pl[administrative_expenses_forecast]),\n" +
      "    \"RentActual\", SUM(data_pl[rent_expense_actual]),\n" +
      "    \"RentForecast\", SUM(data_pl[rent_expense_forecast]),\n" +
      "    \"RecruitmentActual\", SUM(data_pl[recruitment_expense_actual]),\n" +
      "    \"RecruitmentForecast\", SUM(data_pl[recruitment_expense_forecast]),\n" +
      "    \"OtherOpexActual\", SUM(data_pl[other_operating_expenses_actual]),\n" +
      "    \"OtherOpexForecast\", SUM(data_pl[other_operating_expenses_forecast]),\n" +
      "    \"UtilisationBudget\", AVERAGE(data_pl[utilisation_budget]),\n" +
      "    \"HeadcountBudget\", AVERAGE(data_pl[headcount_budget]),\n" +
      "    \"DailyRateBudget\", AVERAGE(data_pl[daily_rate_budget])\n" +
      ")\n" +
      "ORDER BY data_pl[month]";

    var Q_EMPLOYEE_ROSTER =
      "EVALUATE\n" +
      "SELECTCOLUMNS(\n" +
      "    data_employee_roster,\n" +
      "    \"UserId\", data_employee_roster[userId],\n" +
      "    \"OmniaCompany\", data_employee_roster[Omnia_Company],\n" +
      "    \"RoleTitle\", data_employee_roster[role_title],\n" +
      "    \"RoleCode\", data_employee_roster[role_code],\n" +
      "    \"RoleGroup\", data_employee_roster[role_group],\n" +
      "    \"EmploymentType\", data_employee_roster[employment_type],\n" +
      "    \"BusinessUnit\", data_employee_roster[business_unit],\n" +
      "    \"Location\", data_employee_roster[location],\n" +
      "    \"EmploymentStartDate\", data_employee_roster[employment_start_date],\n" +
      "    \"TerminationDate\", data_employee_roster[termination_date],\n" +
      "    \"Tenure\", data_employee_roster[tenure]\n" +
      ")";

    var Q_REF_PROJECTS =
      "EVALUATE\n" +
      "SELECTCOLUMNS(\n" +
      "    data_ref_projects,\n" +
      "    \"ProjectCode\", data_ref_projects[Project_Code],\n" +
      "    \"ProjectName\", data_ref_projects[Project_Name],\n" +
      "    \"StartDate\", data_ref_projects[Start_Date],\n" +
      "    \"EndDate\", data_ref_projects[End_Date],\n" +
      "    \"Client\", data_ref_projects[Client],\n" +
      "    \"Industry\", data_ref_projects[Industry],\n" +
      "    \"OmniaCompany\", data_ref_projects[Omnia_Company]\n" +
      ")";

    // This table has no OpCo/entity column, so the Certifications page ignores
    // the OpCo filter entirely (there's nothing to filter it by).
    var Q_CERTIFICATIONS =
      "EVALUATE\n" +
      "SELECTCOLUMNS(\n" +
      "    data_certifications,\n" +
      "    \"UserId\", data_certifications[AADUserId],\n" +
      "    \"Title\", data_certifications[TrainingTitle],\n" +
      "    \"Status\", data_certifications[ActivationStatus],\n" +
      "    \"CompletionDate\", data_certifications[TrainingCompletionDate],\n" +
      "    \"ExpirationDate\", data_certifications[ExpirationDate]\n" +
      ")";

    var msalApp = new msal.PublicClientApplication({
      auth: {
        clientId: CLIENT_ID,
        authority: "https://login.microsoftonline.com/" + TENANT_ID,
        redirectUri: window.location.origin + window.location.pathname,
      },
      cache: { cacheLocation: "sessionStorage" },
    });
    var msalReady = msalApp.initialize();

    function showError(msg) {
      var box = document.getElementById("oc-error");
      box.textContent = msg;
      box.style.display = "block";
    }

    // Deliberately does NOT disable the button just because an account
    // exists — an account can exist (Power BI scope already consented)
    // while the separate Graph-scope consent (needed for gateAccessAndLoad)
    // still fails, e.g. on first-ever use for that person. Disabling here
    // stranded users with no way to retry when that happened during the
    // automatic silent sign-in on page load (no popup allowed without a
    // real click) — see signIn()/the auto-sign-in IIFE below, which now
    // own disabling/re-enabling around the actual work instead.
    function setSignedInUi(account) {
      var btn = document.getElementById("oc-signin-btn");
      btn.textContent = account ? "Signed in as " + account.username : "Sign in to view";
    }

    async function getToken(interactive) {
      await msalReady;
      var accounts = msalApp.getAllAccounts();
      var request = { scopes: [POWERBI_SCOPE], account: accounts[0] };
      try {
        var result = await msalApp.acquireTokenSilent(request);
        return result.accessToken;
      } catch (e) {
        if (!interactive) throw e;
        var result = await msalApp.loginPopup({ scopes: [POWERBI_SCOPE] });
        setSignedInUi(result.account);
        var silent = await msalApp.acquireTokenSilent({ scopes: [POWERBI_SCOPE], account: result.account });
        return silent.accessToken;
      }
    }

    // Separate from getToken() above — only called from the Manage Access
    // Add/Deactivate handlers, which are the only things that actually need
    // Workspace.ReadWrite.All. Keeps that broader permission out of the
    // token every regular viewer gets on ordinary sign-in.
    async function getPowerBiAdminToken() {
      await msalReady;
      var accounts = msalApp.getAllAccounts();
      var request = { scopes: POWERBI_ADMIN_SCOPES, account: accounts[0] };
      try {
        var result = await msalApp.acquireTokenSilent(request);
        return result.accessToken;
      } catch (e) {
        var interactive = await msalApp.acquireTokenPopup(request);
        return interactive.accessToken;
      }
    }

    // Adds a person directly to the Power BI workspace as a Viewer — this is
    // what actually grants data access (see the note on POWERBI_ADMIN_SCOPES
    // above). The caller must already be a workspace admin themselves;
    // Power BI returns an error otherwise, which callers should treat as
    // non-fatal (the AccessUsers entry still saved) rather than blocking
    // the whole "Add" action on it.
    async function addUserToPowerBiWorkspace(token, email) {
      var resp = await fetch("https://api.powerbi.com/v1.0/myorg/groups/" + WORKSPACE_ID + "/users", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ emailAddress: email, groupUserAccessRight: "Viewer" }),
      });
      if (!resp.ok) {
        var text = await resp.text();
        throw new Error("Could not add to the Power BI workspace (HTTP " + resp.status + "): " + text);
      }
    }

    // Mirrors addUserToPowerBiWorkspace — so "Deactivate" is a real, full
    // revocation (app gate + actual data access) rather than just hiding the
    // app's UI while leaving their Power BI workspace membership intact.
    async function removeUserFromPowerBiWorkspace(token, email) {
      var resp = await fetch("https://api.powerbi.com/v1.0/myorg/groups/" + WORKSPACE_ID + "/users/" + encodeURIComponent(email), {
        method: "DELETE",
        headers: { Authorization: "Bearer " + token },
      });
      if (!resp.ok) {
        var text = await resp.text();
        throw new Error("Could not remove from the Power BI workspace (HTTP " + resp.status + "): " + text);
      }
    }

    // ---- Power BI dataset query layer ----
    // This tier only accepts one query per executeQueries call, so queries
    // run as separate sequential requests rather than a single batched call.
    async function executeDaxQuery(token, query) {
      var url = "https://api.powerbi.com/v1.0/myorg/groups/" + WORKSPACE_ID +
        "/datasets/" + DATASET_ID + "/executeQueries";
      var res = await fetch(url, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          queries: [{ query: query }],
          serializerSettings: { includeNulls: true },
        }),
      });
      if (!res.ok) {
        var text = await res.text();
        throw new Error("Power BI executeQueries failed (" + res.status + "): " + text);
      }
      var data = await res.json();
      return data.results[0].tables[0].rows;
    }

    // Each query is isolated — a failure in one (e.g. a Phase-1 query whose
    // column names haven't been verified against the live model yet)
    // resolves to an empty row set instead of throwing and aborting every
    // query after it, so one bad query can never take down data that was
    // already working.
    async function executeDaxQueries(token, queries) {
      var results = [];
      for (var i = 0; i < queries.length; i++) {
        try {
          results.push(await executeDaxQuery(token, queries[i]));
        } catch (e) {
          console.warn('DAX query #' + i + ' failed, continuing with an empty result set:', e && e.message ? e.message : e);
          results.push([]);
        }
      }
      return results;
    }

    // ---- Feedback (Microsoft Graph → Excel workbook) ----
    // Separate token acquisition from getToken() above — this needs Graph's
    // Files.ReadWrite scope, not the Power BI Dataset.Read.All one, so it's
    // requested (and consented) independently. Falls back to an interactive
    // popup only when the silent attempt fails (e.g. first-ever use, before
    // this scope has been consented for this account).
    async function getFeedbackGraphToken() {
      await msalReady;
      var accounts = msalApp.getAllAccounts();
      var request = { scopes: FEEDBACK_GRAPH_SCOPES, account: accounts[0] };
      try {
        var result = await msalApp.acquireTokenSilent(request);
        return result.accessToken;
      } catch (e) {
        var interactive = await msalApp.acquireTokenPopup(request);
        return interactive.accessToken;
      }
    }

    function feedbackWorkbookBasePath() {
      return "https://graph.microsoft.com/v1.0/drives/" + FEEDBACK_DRIVE_ID + "/items/" + FEEDBACK_ITEM_ID;
    }

    // Creates the Feedback worksheet + table on first-ever submission if they
    // don't exist yet, so nobody has to hand-build the sheet structure before
    // this works. Safe to call on every submission — it's a no-op once the
    // table is already there.
    async function ensureFeedbackTable(token, basePath) {
      var checkResp = await fetch(
        basePath + "/workbook/tables('" + FEEDBACK_TABLE_NAME + "')",
        { headers: { Authorization: "Bearer " + token } }
      );
      if (checkResp.ok) return;

      await fetch(basePath + "/workbook/worksheets/add", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ name: FEEDBACK_SHEET_NAME }),
      });

      var headerRange = "A1:E1";
      await fetch(
        basePath + "/workbook/worksheets('" + encodeURIComponent(FEEDBACK_SHEET_NAME) + "')/range(address='" + headerRange + "')",
        {
          method: "PATCH",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ values: [["Timestamp", "SubmittedBy", "Page", "OpCoFilter", "Message"]] }),
        }
      );

      var tableResp = await fetch(
        basePath + "/workbook/worksheets('" + encodeURIComponent(FEEDBACK_SHEET_NAME) + "')/tables/add",
        {
          method: "POST",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ address: headerRange, hasHeaders: true }),
        }
      );
      if (!tableResp.ok) throw new Error("Could not create the Feedback table (Graph " + tableResp.status + ")");
      var table = await tableResp.json();

      // Name it so the checkResp lookup above (by FEEDBACK_TABLE_NAME) finds
      // it on every later call, instead of Graph's auto-generated "Table1".
      await fetch(basePath + "/workbook/tables('" + table.id + "')", {
        method: "PATCH",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ name: FEEDBACK_TABLE_NAME }),
      });
    }

    // Sends as the signed-in submitter's own mailbox (Graph's /me/sendMail),
    // not a shared system identity — there's no service account to send
    // "from" here, and this way the notification is genuinely from whoever
    // submitted it rather than a spoofed sender.
    async function sendFeedbackNotificationEmail(token, details) {
      var bodyText = [
        "New feedback submitted on Omnia Reporting.",
        "",
        "From: " + details.submittedBy,
        "Page: " + details.pageLabel,
        "OpCo filter: " + details.opco,
        "",
        details.message,
      ].join("\n");
      var resp = await fetch("https://graph.microsoft.com/v1.0/me/sendMail", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: {
            subject: "New feedback — Omnia Reporting",
            body: { contentType: "Text", content: bodyText },
            toRecipients: [{ emailAddress: { address: FEEDBACK_NOTIFY_EMAIL } }],
          },
        }),
      });
      if (!resp.ok) {
        var text = await resp.text();
        throw new Error("Could not send notification email (Graph " + resp.status + "): " + text);
      }
    }

    async function submitFeedbackRow(message) {
      if (!feedbackConfigured) {
        throw new Error("Feedback isn't connected to a workbook yet — set FEEDBACK_DRIVE_ID/FEEDBACK_ITEM_ID in the page source first.");
      }
      var token = await getFeedbackGraphToken();
      var basePath = await feedbackWorkbookBasePath();
      await ensureFeedbackTable(token, basePath);

      var accounts = msalApp.getAllAccounts();
      var submittedBy = accounts[0] ? accounts[0].username : "unknown";
      var activeNavItem = NAV_ITEMS.filter(function (n) { return n.key === STATE.page; })[0];
      var pageLabel = activeNavItem ? activeNavItem.label : STATE.page;
      var opco = STATE.entity || "All";

      var row = [new Date().toISOString(), submittedBy, pageLabel, opco, message];
      var addResp = await fetch(basePath + "/workbook/tables('" + FEEDBACK_TABLE_NAME + "')/rows/add", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ values: [row] }),
      });
      if (!addResp.ok) {
        var text = await addResp.text();
        throw new Error("Could not save feedback (Graph " + addResp.status + "): " + text);
      }

      // Best-effort: the feedback row is already safely saved above by this
      // point, so a failure here (e.g. Mail.Send not yet consented on first
      // use) shouldn't make the whole submission look like it failed.
      try {
        await sendFeedbackNotificationEmail(token, { submittedBy: submittedBy, pageLabel: pageLabel, opco: opco, message: message });
      } catch (e) {
        console.warn("Feedback saved, but the notification email failed:", e);
      }
    }

    // ---- Access allowlist (Microsoft Graph → same workbook) ----
    function isBootstrapAdmin(email) {
      return BOOTSTRAP_ADMIN_EMAILS.indexOf(String(email || "").toLowerCase()) !== -1;
    }

    // Creates the AccessUsers worksheet + table on first-ever use, same
    // pattern as ensureFeedbackTable.
    async function ensureAccessUsersTable(token, basePath) {
      var checkResp = await fetch(
        basePath + "/workbook/tables('" + ACCESS_TABLE_NAME + "')",
        { headers: { Authorization: "Bearer " + token } }
      );
      if (checkResp.ok) return;

      await fetch(basePath + "/workbook/worksheets/add", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ name: ACCESS_SHEET_NAME }),
      });

      var headerRange = "A1:E1";
      await fetch(
        basePath + "/workbook/worksheets('" + encodeURIComponent(ACCESS_SHEET_NAME) + "')/range(address='" + headerRange + "')",
        {
          method: "PATCH",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ values: [["Email", "Role", "Status", "AddedBy", "AddedAt"]] }),
        }
      );

      var tableResp = await fetch(
        basePath + "/workbook/worksheets('" + encodeURIComponent(ACCESS_SHEET_NAME) + "')/tables/add",
        {
          method: "POST",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ address: headerRange, hasHeaders: true }),
        }
      );
      if (!tableResp.ok) throw new Error("Could not create the AccessUsers table (Graph " + tableResp.status + ")");
      var table = await tableResp.json();

      await fetch(basePath + "/workbook/tables('" + table.id + "')", {
        method: "PATCH",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ name: ACCESS_TABLE_NAME }),
      });
    }

    // Each returned row carries its table-relative `index` (needed to PATCH
    // that exact row later via rows/itemAt) alongside the parsed fields.
    async function fetchAccessUsersRows(token, basePath) {
      var resp = await fetch(basePath + "/workbook/tables('" + ACCESS_TABLE_NAME + "')/rows", {
        headers: { Authorization: "Bearer " + token },
      });
      if (!resp.ok) throw new Error("Could not read the access list (Graph " + resp.status + ")");
      var data = await resp.json();
      return (data.value || []).map(function (r, idx) {
        var v = r.values[0];
        return {
          index: idx,
          email: String(v[0] || "").toLowerCase(),
          role: v[1] || "user",
          status: v[2] || "active",
          addedBy: v[3] || "",
          addedAt: v[4] || "",
        };
      });
    }

    // Returns { allowed, role }. Bootstrap admins always pass without even
    // touching the sheet, so a broken/unreachable AccessUsers table can
    // never lock out the people who'd need to fix it.
    async function checkAccess(token, basePath, email) {
      email = String(email || "").toLowerCase();
      if (isBootstrapAdmin(email)) return { allowed: true, role: "admin" };
      await ensureAccessUsersTable(token, basePath);
      var rows = await fetchAccessUsersRows(token, basePath);
      var row = rows.filter(function (r) { return r.email === email; })[0];
      if (!row || row.status !== "active") return { allowed: false, role: null };
      return { allowed: true, role: row.role === "admin" ? "admin" : "user" };
    }

    async function upsertAccessUser(token, basePath, email, role, addedBy) {
      email = String(email).trim().toLowerCase();
      await ensureAccessUsersTable(token, basePath);
      var rows = await fetchAccessUsersRows(token, basePath);
      var existing = rows.filter(function (r) { return r.email === email; })[0];
      var values = [[email, role, "active", addedBy, new Date().toISOString()]];
      if (existing) {
        await fetch(basePath + "/workbook/tables('" + ACCESS_TABLE_NAME + "')/rows/itemAt(index=" + existing.index + ")", {
          method: "PATCH",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ values: values }),
        });
      } else {
        await fetch(basePath + "/workbook/tables('" + ACCESS_TABLE_NAME + "')/rows/add", {
          method: "POST",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ values: values }),
        });
      }
    }

    async function deactivateAccessUser(token, basePath, email) {
      email = String(email).trim().toLowerCase();
      var rows = await fetchAccessUsersRows(token, basePath);
      var existing = rows.filter(function (r) { return r.email === email; })[0];
      if (!existing) return;
      var values = [[existing.email, existing.role, "inactive", existing.addedBy, existing.addedAt]];
      await fetch(basePath + "/workbook/tables('" + ACCESS_TABLE_NAME + "')/rows/itemAt(index=" + existing.index + ")", {
        method: "PATCH",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ values: values }),
      });
    }

    // ---- Formatting helpers ----
    function parseDate(v) {
      var d = new Date(v);
      return isNaN(d.getTime()) ? null : d;
    }
    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function escHtml(s) { return escapeHtml(s); }
    function escAttr(s) { return escHtml(s).replace(/"/g, '&quot;'); }

    function fmtCurrency(n) { if (n == null || isNaN(n)) return '—'; return '$' + Math.round(n).toLocaleString(); }
    function fmtCurrencyCompact(n) {
      if (n == null || isNaN(n)) return '—';
      var sign = n < 0 ? '-' : '';
      var abs = Math.abs(n);
      if (abs >= 1000000) return sign + '$' + (abs / 1000000).toFixed(1) + 'm';
      if (abs >= 1000) return sign + '$' + (abs / 1000).toFixed(1) + 'k';
      return sign + '$' + Math.round(abs).toLocaleString();
    }
    function fmtPct(n) { if (n == null || isNaN(n)) return '—'; return n.toFixed(1) + '%'; }
    function fmtDelta(n) { if (n == null || isNaN(n)) return null; return (n > 0 ? '+' : '') + n.toFixed(1) + '%'; }
    function signedCurrency(n) { return (n > 0 ? '+' : '') + fmtCurrencyCompact(n); }
    function signedPts(n) { return (n > 0 ? '+' : '') + n.toFixed(1) + 'pts'; }
    function signedCount(n, decimals) { return (n > 0 ? '+' : '') + n.toFixed(decimals || 0); }
    var AU_STATE_ABBREVIATIONS = ['NSW', 'VIC', 'QLD', 'WA', 'SA', 'TAS', 'NT', 'ACT'];
    function titleCase(s) {
      if (!s) return s;
      var trimmed = String(s).trim();
      if (AU_STATE_ABBREVIATIONS.indexOf(trimmed.toUpperCase()) !== -1) return trimmed.toUpperCase();
      return trimmed.toLowerCase().replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    }

    // ---- State ----
    var RAW = null;
    var ENTITIES = [];
    var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var MONTH_UNIVERSE = [];
    var CURRENT_SESSION = { email: null, role: null };

    var STATE = {
      entity: null,
      page: 'takeaways',
      selectedMonths: null,
      periodPanelOpen: false,
      compareBasis: 'ytd',
      divisionFilter: 'all',
      projectsFilter: 'all',
      role: 'viewer',
      email: null,
      isAccessAdmin: false,
      modal: { kind: null },
    };

    var NAV_ITEMS = [
      { key: 'takeaways', label: 'Takeaways' },
      { key: 'revenue', label: 'Revenue' },
      { key: 'clients', label: 'Clients' },
      { key: 'projects', label: 'Projects' },
      { key: 'deals', label: 'Deals' },
      { key: 'employees', label: 'Employees' },
      { key: 'margins', label: 'Margins' },
      { key: 'cost', label: 'Cost' },
      { key: 'utilisation', label: 'Utilisation' },
      { key: 'certifications', label: 'Alliances' },
    ];

    var COMPARE_PREFIX = {
      previousPeriod: 'Last month',
      lastQuarterEnd: 'End of last quarter',
      sameTimeLastYear: 'Selected month last year',
      ytd: 'Start of financial year',
    };
    var COMPARE_OPTIONS = [
      { key: 'previousPeriod', label: 'Last month' },
      { key: 'lastQuarterEnd', label: 'End of last quarter' },
      { key: 'ytd', label: 'vs start of financial year' },
      { key: 'sameTimeLastYear', label: 'Selected month last year' },
    ];

    // No hardcoded 4th-OpCo legacy-source split here (see plan notes) — every
    // entity present in the live semantic model is read from the same shared
    // tables uniformly.
    var COMBINED_ENTITY_LABEL = 'Omnia Collective';
    var COMBINED_ENTITIES = []; // populated in onDataLoaded from whatever entities the live data actually has
    function entityMatches(rowEntityValue) {
      if (STATE.entity === COMBINED_ENTITY_LABEL) return COMBINED_ENTITIES.indexOf(rowEntityValue) !== -1;
      return rowEntityValue === STATE.entity;
    }

    // ---- Date / month-universe helpers (ported from the Apps Script Omnia
    // Reporting engine, so this file's period model behaves identically) ----
    function monthKey(d) { return d.getFullYear() + '-' + (d.getMonth() + 1); }
    function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
    function addMonths(d, n) { return new Date(d.getFullYear(), d.getMonth() + n, 1); }
    function fyEndYear(d) { var m = d.getMonth(); return m >= 6 ? d.getFullYear() + 1 : d.getFullYear(); }
    function fyLabel(endYear) { return 'FY' + String(endYear).slice(-2); }
    function fyStart(fyEnd) { return new Date(fyEnd - 1, 6, 1); }
    function monthYYLabel(d) { return MONTH_NAMES[d.getMonth()] + '-' + String(d.getFullYear()).slice(-2); }
    function monthYearLabel(d) { return MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear(); }
    function rangeMonths(start, end) {
      var out = []; var cursor = new Date(start);
      while (cursor <= end) { out.push(new Date(cursor)); cursor = addMonths(cursor, 1); }
      return out;
    }

    function buildMonthUniverse() {
      var seenAll = {};
      var seenFact = {};
      function add(dateStr, map) {
        if (!dateStr) return;
        var d = new Date(dateStr);
        if (isNaN(d)) return;
        map[monthKey(firstOfMonth(d))] = firstOfMonth(d);
      }
      (RAW.revenueTarget || []).forEach(function (r) { add(r.month_date, seenAll); });
      (RAW.unifiedFact || []).forEach(function (r) { add(r.month_date, seenAll); add(r.month_date, seenFact); });
      var allDates = Object.keys(seenAll).map(function (k) { return seenAll[k]; }).sort(function (a, b) { return a - b; });
      var factDates = Object.keys(seenFact).map(function (k) { return seenFact[k]; }).sort(function (a, b) { return a - b; });
      if (!allDates.length) { MONTH_UNIVERSE = []; return; }
      var minDate = factDates.length ? factDates[0] : allDates[0];
      var maxDate = allDates[allDates.length - 1];
      MONTH_UNIVERSE = rangeMonths(minDate, maxDate);
    }

    function isMonthInProgress(m) {
      var today = new Date();
      return m.getFullYear() === today.getFullYear() && m.getMonth() === today.getMonth();
    }
    function currentMonthWithData() {
      var today = firstOfMonth(new Date());
      var candidates = MONTH_UNIVERSE.filter(function (d) { return d <= today; });
      if (candidates.length) return candidates[candidates.length - 1];
      return MONTH_UNIVERSE.length ? MONTH_UNIVERSE[MONTH_UNIVERSE.length - 1] : today;
    }
    function quarterEndOfPreviousQuarter(d) {
      var q = Math.floor(d.getMonth() / 3);
      var prevQ = q - 1, year = d.getFullYear();
      if (prevQ < 0) { prevQ = 3; year -= 1; }
      return new Date(year, prevQ * 3 + 2, 1);
    }
    function defaultMonthSelection() {
      var cur = currentMonthWithData();
      var start = addMonths(cur, -11);
      if (MONTH_UNIVERSE.length && start < MONTH_UNIVERSE[0]) start = MONTH_UNIVERSE[0];
      var sel = new Set();
      rangeMonths(start, cur).forEach(function (m) { sel.add(monthKey(m)); });
      return sel;
    }
    function groupByFy() {
      var groups = {};
      MONTH_UNIVERSE.forEach(function (m) {
        var fy = fyEndYear(m);
        groups[fy] = groups[fy] || [];
        groups[fy].push(m);
      });
      return Object.keys(groups).map(Number).sort(function (a, b) { return a - b; }).map(function (fy) {
        return { fyEndYear: fy, label: fyLabel(fy) + ' (' + monthYYLabel(groups[fy][0]) + ' – ' + monthYYLabel(groups[fy][groups[fy].length - 1]) + ')', months: groups[fy] };
      });
    }

    function periodBounds() {
      var months = MONTH_UNIVERSE.filter(function (m) { return STATE.selectedMonths.has(monthKey(m)); });
      if (!months.length) return null;
      return { months: months, start: months[0], end: months[months.length - 1], span: months.length };
    }
    function comparisonBounds() {
      var b = periodBounds();
      if (!b) return null;
      if (STATE.compareBasis === 'ytd') {
        var fyStartMonth = fyStart(fyEndYear(b.end));
        return { start: fyStartMonth, end: fyStartMonth, months: [fyStartMonth] };
      }
      if (STATE.compareBasis === 'lastQuarterEnd') {
        var cmpEnd = quarterEndOfPreviousQuarter(b.end);
        var cmpStart = addMonths(cmpEnd, -(b.span - 1));
        return { start: cmpStart, end: cmpEnd, months: rangeMonths(cmpStart, cmpEnd) };
      }
      var shift = STATE.compareBasis === 'sameTimeLastYear' ? 12 : b.span;
      var start = addMonths(b.start, -shift);
      var end = addMonths(b.end, -shift);
      return { start: start, end: end, months: rangeMonths(start, end) };
    }
    function cardComparisonTargetMonth() {
      var b = periodBounds();
      if (!b) return null;
      var reportingMonth = b.end;
      if (STATE.compareBasis === 'lastQuarterEnd') return quarterEndOfPreviousQuarter(reportingMonth);
      if (STATE.compareBasis === 'sameTimeLastYear') return addMonths(reportingMonth, -12);
      if (STATE.compareBasis === 'ytd') return fyStart(fyEndYear(reportingMonth));
      return addMonths(reportingMonth, -1);
    }
    function cardMonths() {
      var b = periodBounds();
      if (!b) return [];
      return [b.end];
    }
    function cardComparisonMonths() {
      var target = cardComparisonTargetMonth();
      return target ? [target] : [];
    }
    function periodLabelText() {
      var b = periodBounds();
      if (!b) return 'selected period';
      return b.span === 1 ? monthYearLabel(b.start) : monthYearLabel(b.start) + ' – ' + monthYearLabel(b.end);
    }
    function cardPeriodLabelText() {
      var b = periodBounds();
      if (!b) return 'selected period';
      return monthYearLabel(b.end);
    }

    // ---- Header / nav ----
    function renderHeader(entities) {
      var pillsEl = document.getElementById('oc-company-pills');
      pillsEl.innerHTML = entities.map(function (e) {
        return '<button class="oc-pill' + (e === STATE.entity ? ' active' : '') + '" data-entity="' + escAttr(e) + '">' + escHtml(e) + '</button>';
      }).join('');

      divSelect.value = STATE.divisionFilter;

      var navEl = document.getElementById('oc-nav');
      navEl.innerHTML = NAV_ITEMS.map(function (n) {
        return '<button class="oc-nav-btn' + (n.key === STATE.page ? ' active' : '') + '" data-page="' + n.key + '">' + n.label + '</button>';
      }).join('');
      Array.prototype.forEach.call(navEl.querySelectorAll('.oc-nav-btn'), function (btn) {
        btn.addEventListener('click', function () {
          STATE.page = btn.getAttribute('data-page');
