        });
      });
    }

    function uniqueDivisions(data) {
      var set = {};
      (data.unifiedFact || []).forEach(function (r) { if (r.project_stream) set[r.project_stream] = true; });
      return Object.keys(set).sort();
    }

    function renderPeriodPicker() {
      var wrap = document.getElementById('oc-period-wrap');
      var b = periodBounds();
      var groups = groupByFy();
      var realCurKey = monthKey(firstOfMonth(new Date()));
      var today = firstOfMonth(new Date());
      var reportingKey = b ? monthKey(b.end) : null;
      var label = b ? monthYearLabel(b.end) : 'No month selected';

      var html = '<button class="oc-period-btn" id="oc-period-toggle">' +
        '<span class="oc-eyebrow-inline">Reporting period</span><span>' + label + '</span>' +
        '<span style="font-size:10px; color:var(--fg-on-dark-3);">&#9662;</span></button>';

      html += '<div class="oc-period-panel' + (STATE.periodPanelOpen ? ' open' : '') + '" id="oc-period-panel">';
      html += '<div class="oc-period-panel-head"><div class="oc-period-panel-title">Select a reporting month</div><button class="oc-period-done" id="oc-period-done">Done</button></div>';
      html += '<div class="oc-note" style="margin-bottom:12px;">Cards show figures for the month you pick. Charts show the trailing 12 months through the picked month (or fewer, if less than 12 months of data exist yet).</div>';
      if (STATE.selectedMonths.has(realCurKey)) {
        html += '<div class="oc-banner">' + MONTH_NAMES[today.getMonth()] + ' ' + today.getFullYear() + ' is still in progress — figures for that month may be incomplete until the period closes.</div>';
      }
      html += '<div class="oc-presets"><button class="oc-preset-btn" data-preset="thisMonth">Latest month</button></div>';

      groups.slice().reverse().forEach(function (g) {
        var availableMonths = g.months.filter(function (m) { return m <= today; });
        if (!availableMonths.length) return;
        html += '<div class="oc-fy-group"><div class="oc-fy-head" style="cursor:default;"><span class="oc-fy-label">' + g.label + '</span></div><div class="oc-month-grid">' +
          availableMonths.slice().reverse().map(function (m) {
            var k = monthKey(m);
            var selected = k === reportingKey;
            var isNow = k === realCurKey;
            return '<button class="oc-month-btn' + (selected ? ' checked' : '') + '" data-month="' + k + '">' +
              '<span class="oc-month-checkbox" style="border-radius:50%;">' + (selected ? '&#10003;' : '') + '</span>' +
              '<span class="oc-month-btn-label">' + monthYYLabel(m) + (isNow ? '<span class="oc-now-dot"></span>' : '') + '</span></button>';
          }).join('') + '</div></div>';
      });
      html += '<div class="oc-period-footnote"><span class="oc-now-dot"></span>Current month</div></div>';
      wrap.innerHTML = html;

      document.getElementById('oc-period-toggle').addEventListener('click', function (e) {
        e.stopPropagation();
        STATE.periodPanelOpen = !STATE.periodPanelOpen;
        renderPeriodPicker();
      });
      if (STATE.periodPanelOpen) {
        document.getElementById('oc-period-done').addEventListener('click', function () {
          STATE.periodPanelOpen = false;
          renderPeriodPicker();
        });
        Array.prototype.forEach.call(wrap.querySelectorAll('.oc-month-btn'), function (btn) {
          btn.addEventListener('click', function () {
            selectReportingMonth(btn.getAttribute('data-month'));
            renderPeriodPicker(); renderCompareSelect(); renderCompareDates(); renderPage();
          });
        });
        Array.prototype.forEach.call(wrap.querySelectorAll('.oc-preset-btn'), function (btn) {
          btn.addEventListener('click', function () {
            if (btn.getAttribute('data-preset') === 'thisMonth') selectReportingMonth(monthKey(currentMonthWithData()));
            renderPeriodPicker(); renderCompareSelect(); renderCompareDates(); renderPage();
          });
        });
      }
    }

    function selectReportingMonth(monthKeyStr) {
      var m = MONTH_UNIVERSE.filter(function (mm) { return monthKey(mm) === monthKeyStr; })[0];
      if (!m) return;
      var start = addMonths(m, -11);
      if (MONTH_UNIVERSE.length && start < MONTH_UNIVERSE[0]) start = MONTH_UNIVERSE[0];
      var sel = new Set();
      rangeMonths(start, m).forEach(function (mm) { sel.add(monthKey(mm)); });
      STATE.selectedMonths = sel;
    }

    function renderCompareSelect() {
      var select = document.getElementById('oc-compare-select');
      if (!select) return;
      select.innerHTML = COMPARE_OPTIONS.map(function (o) { return '<option value="' + o.key + '">' + o.label + '</option>'; }).join('');
      select.value = STATE.compareBasis;
      select.onchange = function () { STATE.compareBasis = select.value; renderCompareDates(); renderPage(); };
    }
    function renderCompareDates() {
      var el = document.getElementById('oc-compare-dates');
      if (!el) return;
      var b = periodBounds();
      if (!b) { el.innerHTML = ''; return; }
      var cmpMonth = cardComparisonTargetMonth();
      if (!cmpMonth) { el.innerHTML = ''; return; }
      el.innerHTML = COMPARE_PREFIX[STATE.compareBasis] + ' — <strong>' + monthYYLabel(cmpMonth) + '</strong>';
    }

    // ---- Row filtering (mirrors the Apps Script engine's rowsForMonths) ----
    function rowsForMonths(rows, dateField, entityField, monthDates) {
      var keySet = {}; monthDates.forEach(function (m) { keySet[monthKey(m)] = true; });
      return rows.filter(function (r) {
        if (entityField && !entityMatches(r[entityField])) return false;
        if (STATE.divisionFilter !== 'all' && Object.prototype.hasOwnProperty.call(r, 'project_stream') && r.project_stream !== STATE.divisionFilter) return false;
        if (STATE.projectsFilter === 'ai' && Object.prototype.hasOwnProperty.call(r, 'project_stream') && (r.project_stream || '').toLowerCase() !== 'ai') return false;
        var d = r[dateField];
        if (!d) return false;
        var dt = new Date(d);
        if (isNaN(dt)) return false;
        return !!keySet[monthKey(firstOfMonth(dt))];
      });
    }
    function cardPeriodRows(rows, dateField, entityField) {
      return rowsForMonths(rows, dateField, entityField, cardMonths());
    }
    function cardComparisonRows(rows, dateField, entityField) {
      return rowsForMonths(rows, dateField, entityField, cardComparisonMonths());
    }
    function currentPeriodRows(rows, dateField, entityField) {
      var b = periodBounds();
      if (!b) return [];
      return rowsForMonths(rows, dateField, entityField, b.months);
    }
    function comparisonPeriodRows(rows, dateField, entityField) {
      var cmp = comparisonBounds();
      if (!cmp) return [];
      return rowsForMonths(rows, dateField, entityField, cmp.months);
    }

    // ---- Chart label sizing ----
    function chartLabelSizes(count) {
      if (count <= 6) return { value: 11, month: 11, year: 9, minWidth: 34 };
      if (count <= 10) return { value: 10, month: 10.5, year: 8.5, minWidth: 28 };
      if (count <= 16) return { value: 9, month: 9.5, year: 8, minWidth: 22 };
      if (count <= 24) return { value: 8, month: 8.5, year: 7, minWidth: 18 };
      return { value: 7, month: 7.5, year: 6.5, minWidth: 14 };
    }

    // ---- Sparkline chart (SVG polyline, auto-zoomed y-axis) ----
    function sparkXPercent(i, count) {
      var inset = 6, usable = 100 - inset * 2;
      if (count <= 1) return 50;
      var refN = 12;
      var spreadPct = Math.min(usable, ((count - 1) / (refN - 1)) * usable);
      var offset = inset + (usable - spreadPct) / 2;
      return offset + (i / (count - 1)) * spreadPct;
    }
    function renderSparklineCard(metric, series, months, pointTitles, forecastFlags, flagInProgress, targetSeries, heightPx) {
      heightPx = heightPx || 130;
      var vals = series.filter(function (v) { return v != null; });
      var targetVals = targetSeries ? targetSeries.filter(function (v) { return v != null; }) : [];
      var allVals = vals.concat(targetVals);
      var rawMax = allVals.length ? Math.max.apply(null, allVals) : 0;
      var rawMin = allVals.length ? Math.min.apply(null, allVals) : 0;
      var rawRange = rawMax - rawMin;
      var padding = rawRange > 0 ? rawRange * 0.15 : (Math.abs(rawMax) * 0.1 || 1);
      var maxV = rawMax + padding;
      var minV = rawMin - padding;
      var range = (maxV - minV) || 1;
      var count = series.length;
      var sizes = chartLabelSizes(months.length);
      var anyInProgress = false;

      function toY(v) { return 34 - ((v - minV) / range) * 22 - 6; }
      var points = series.map(function (v, i) { if (v == null) return null; return { x: sparkXPercent(i, count), y: toY(v), v: v }; });
      var targetPoints = targetSeries ? targetSeries.map(function (v, i) { if (v == null) return null; return { x: sparkXPercent(i, count), y: toY(v), v: v }; }) : [];
      function buildPolylineSegments(pts, stroke, strokeWidth, dashArray) {
        var segments = [], current = [];
        pts.forEach(function (p) { if (p) { current.push(p); } else { if (current.length > 1) segments.push(current); current = []; } });
        if (current.length > 1) segments.push(current);
        return segments.map(function (seg) {
          return '<polyline points="' + seg.map(function (p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ') + '" fill="none" stroke="' + stroke + '" stroke-width="' + strokeWidth + '"' + (dashArray ? ' stroke-dasharray="' + dashArray + '"' : '') + ' vector-effect="non-scaling-stroke"></polyline>';
        }).join('');
      }
      var targetPolylineHtml = buildPolylineSegments(targetPoints, 'var(--oc-coral)', '1.2', '3,2');
      var polylineHtml = buildPolylineSegments(points, metric.color, '1.4', null);
      var dots = points.map(function (p, i) {
        if (p) {
          var inProgress = flagInProgress && isMonthInProgress(months[i]);
          if (inProgress) anyInProgress = true;
          var defaultTitle = monthYearLabel(months[i]) + ': ' + metric.fmt(p.v) + (inProgress ? ' (known — month in progress)' : '');
          var title = (pointTitles && pointTitles[i]) ? pointTitles[i] : defaultTitle;
          var dotStyle = inProgress ? 'background:var(--bg); border:2px dashed var(--oc-mint-deep);' : 'background:' + metric.color + ';';
          return '<div class="oc-spark-dot" style="left:' + p.x.toFixed(1) + '%; top:' + ((p.y / 34) * 100).toFixed(1) + '%; ' + dotStyle + '" title="' + title.replace(/"/g, '&quot;') + '"></div>';
        }
        if (forecastFlags && forecastFlags[i]) {
          var x = sparkXPercent(i, count);
          var phTitle = (pointTitles && pointTitles[i]) ? pointTitles[i] : (monthYearLabel(months[i]) + ': no data yet');
          return '<div style="position:absolute; left:' + x.toFixed(1) + '%; top:50%; width:9px; height:9px; margin:-4.5px 0 0 -4.5px; border-radius:50%; border:1.5px dashed ' + metric.color + '; background:var(--bg);" title="' + phTitle.replace(/"/g, '&quot;') + '"></div>';
        }
        return '';
      }).join('');

      function computeIsAbove(pts, i) {
        var p = pts[i]; if (!p) return true;
        var prev = pts[i - 1] || null, next = pts[i + 1] || null;
        if (prev && next) {
          if (p.y <= prev.y && p.y <= next.y) return true;
          if (p.y >= prev.y && p.y >= next.y) return false;
          return p.y <= (prev.y + next.y) / 2;
        }
        if (prev) return p.y <= prev.y;
        if (next) return p.y <= next.y;
        return true;
      }
      function labelDiv(p, isAbove, color, fontSize, extraPush) {
        var topPct = (p.y / 34) * 100;
        var push = 10 + (extraPush || 0);
        var offset = isAbove ? 'transform:translate(-50%, -100%); margin-top:-' + push + 'px;' : 'transform:translate(-50%, 0%); margin-top:' + (push + 2) + 'px;';
        return '<div style="position:absolute; left:' + p.x.toFixed(1) + '%; top:' + topPct.toFixed(1) + '%; ' + offset + ' font-size:' + fontSize + 'px; font-weight:700; color:' + color + '; white-space:nowrap; pointer-events:none;">';
      }
      function closeValuesPush(i) {
        if (!points[i] || !targetPoints[i]) return 0;
        var yDiff = Math.abs(points[i].y - targetPoints[i].y);
        return yDiff < 4 ? (4 - yDiff) * 2 : 0;
      }
      var dataLabelsHtml = points.map(function (p, i) {
        if (!p) return '';
        var isAbove = computeIsAbove(points, i);
        return labelDiv(p, isAbove, metric.color, Math.max(sizes.month - 1, 9), closeValuesPush(i)) + metric.fmt(p.v) + '</div>';
      }).join('');
      var targetDataLabelsHtml = targetPoints.map(function (p, i) {
        if (!p) return '';
        var isAbove = points[i] ? !computeIsAbove(points, i) : computeIsAbove(targetPoints, i);
        return labelDiv(p, isAbove, 'var(--oc-coral)', Math.max(sizes.month - 2, 8), closeValuesPush(i)) + metric.fmt(p.v) + '</div>';
      }).join('');
      var monthLabelsHtml = months.map(function (m, i) {
        var x = sparkXPercent(i, count);
        return '<div style="position:absolute; left:' + x.toFixed(1) + '%; top:0; transform:translateX(-50%); text-align:center; white-space:nowrap;">' +
          '<div style="font-size:' + sizes.month + 'px; font-weight:700; color:var(--fg2);">' + MONTH_NAMES[m.getMonth()] + '</div>' +
          '<div style="font-size:' + Math.max(sizes.year - 1, 7) + 'px; color:var(--fg3); opacity:0.8;">' + m.getFullYear() + '</div></div>';
      }).join('');

      var legendExtra = anyInProgress ? ' <span class="oc-sw-dash" style="border-color:var(--oc-mint-deep); margin-left:8px;"></span> Current month (known)' : '';
      var actualLabel = metric.actualLabel || 'Actual';
      var targetLabel = metric.targetLabel || 'Target';
      var hasActualData = vals.length > 0;
      var hasTargetData = targetVals.length > 0;
      var targetLegend = hasTargetData ? ' <span class="oc-sw-dash" style="border-color:var(--oc-coral); margin-left:8px;"></span> ' + targetLabel : '';
      var actualLegendHtml = hasActualData ? '<span class="oc-sw-dash" style="border-style:solid; border-color:' + metric.color + ';"></span>' + actualLabel : '';

      return '<div>' +
        '<div class="oc-multiple-head"><div class="oc-multiple-label">' + metric.label + '</div><div class="oc-multiple-legend">' + actualLegendHtml + legendExtra + targetLegend + '</div></div>' +
        '<div class="oc-spark-wrap"><svg viewBox="0 0 100 34" style="width:100%; height:' + heightPx + 'px;" preserveAspectRatio="none">' +
          (hasTargetData ? targetPolylineHtml : '') + (hasActualData ? polylineHtml : '') +
        '</svg>' + dots + dataLabelsHtml + targetDataLabelsHtml + '</div>' +
        '<div style="position:relative; height:26px; margin-top:6px;">' + monthLabelsHtml + '</div></div>';
    }

    // ---- Bar-trend chart (0-anchored CSS bars, up to 2 target/forecast series) ----
    function renderBarTrendChart(metric, series, months, targetSeries, forecastFlags, target2Series, target2Label) {
      var vals = series.filter(function (v) { return v != null; });
      var targetVals = (targetSeries || []).filter(function (v) { return v != null; });
      var target2Vals = (target2Series || []).filter(function (v) { return v != null; });
      var allVals = vals.concat(targetVals).concat(target2Vals);
      var maxVal = allVals.length ? Math.max.apply(null, allVals.concat([0])) : 1;
      var minVal = allVals.length ? Math.min.apply(null, allVals.concat([0])) : 0;
      var scaleMax = Math.max(maxVal, 0.0001);
      var scaleMin = Math.min(minVal, 0);
      var range = scaleMax - scaleMin || 1;
      var sizes = chartLabelSizes(months.length);
      var hasTargetData = targetVals.length > 0;
      var hasTarget2Data = target2Vals.length > 0;
      var actualLabel = metric.actualLabel || 'Actual';
      var targetLabel = metric.targetLabel || 'Target';
      var t2Label = target2Label || 'Forecast';
      var FORECAST_COLOR = '#4FC3F7';
      var TARGET_COLOR = 'var(--oc-coral)';
      var targetIsForecast = targetLabel === 'Forecast';
      var t2IsForecast = t2Label === 'Forecast';
      var targetColor = targetIsForecast ? FORECAST_COLOR : TARGET_COLOR;
      var t2Color = t2IsForecast ? FORECAST_COLOR : TARGET_COLOR;

      var barsHtml = months.map(function (m, i) {
        var v = series[i];
        var t = (targetSeries || [])[i];
        var t2 = (target2Series || [])[i];
        var isForecast = forecastFlags && forecastFlags[i];
        function forecastBarHtml(val, color) {
          var fHeightPct = ((val - scaleMin) / range) * 100;
          var fZeroPct = ((0 - scaleMin) / range) * 100;
          var fBarTop = val >= 0 ? (100 - fHeightPct) : (100 - fZeroPct);
          var fBarHeight = Math.abs(fHeightPct - fZeroPct);
          return '<div class="oc-cum-bar" style="height:' + fBarHeight.toFixed(1) + '%; top:' + fBarTop.toFixed(1) + '%; position:absolute; left:50%; transform:translateX(-50%); width:100%; max-width:34px; background:transparent; border:2px dashed ' + color + '; box-sizing:border-box;" title="Forecast — ' + metric.fmt(val) + '"></div>';
        }
        var t2LineHtml = (t2 != null && !t2IsForecast) ? '<div class="oc-cum-target-line" style="top:' + (100 - ((t2 - scaleMin) / range) * 100).toFixed(1) + '%; border-top-color:' + t2Color + ';" title="' + t2Label + ' — ' + metric.fmt(t2) + '"></div>' : '';
        function stackedLabelHtml(vActual, tVal, t2Val) {
          var parts = [];
          if (vActual != null) parts.push(metric.fmt(vActual));
          if (tVal != null) parts.push('<span style="color:' + targetColor + ';">' + targetLabel.charAt(0) + ': ' + metric.fmt(tVal) + '</span>');
          if (t2Val != null) parts.push('<span style="color:' + t2Color + ';">' + t2Label.charAt(0) + ': ' + metric.fmt(t2Val) + '</span>');
          return '<div class="oc-cum-label" style="font-size:' + sizes.value + 'px; line-height:1.4;">' + parts.join('<br>') + '</div>';
        }
        if (v == null) {
          if (t == null && t2 == null) return '<div class="oc-cum-col"><div class="oc-cum-bar-wrap"></div></div>';
          var fTargetTopPct = (t != null && !targetIsForecast) ? 100 - ((t - scaleMin) / range) * 100 : null;
          var forecastVal = targetIsForecast ? t : (t2IsForecast ? t2 : null);
          var forecastColor = targetIsForecast ? targetColor : t2Color;
          var forecastLbl = targetIsForecast ? targetLabel : t2Label;
          var genuineTarget = (fTargetTopPct != null) ? t : ((t2 != null && !t2IsForecast) ? t2 : null);
          var genuineTargetColor = (fTargetTopPct != null) ? targetColor : t2Color;
          var genuineTargetLbl = (fTargetTopPct != null) ? targetLabel : t2Label;
          var noActualParts = [];
          if (genuineTarget != null) noActualParts.push('<span style="color:' + genuineTargetColor + ';">' + genuineTargetLbl.charAt(0) + ': ' + metric.fmt(genuineTarget) + '</span>');
          if (forecastVal != null) noActualParts.push('<span style="color:' + forecastColor + ';">' + forecastLbl.charAt(0) + ': ' + metric.fmt(forecastVal) + '</span>');
          var noActualLabelHtml = noActualParts.length ? '<div class="oc-cum-label" style="font-size:' + sizes.value + 'px; line-height:1.4;">' + noActualParts.join('<br>') + '</div>' : '';
          return '<div class="oc-cum-col">' + noActualLabelHtml +
            '<div class="oc-cum-bar-wrap">' +
              (fTargetTopPct != null ? '<div class="oc-cum-target-line" style="top:' + fTargetTopPct.toFixed(1) + '%;" title="' + targetLabel + ' — ' + metric.fmt(t) + '"></div>' : '') +
              t2LineHtml + (forecastVal != null ? forecastBarHtml(forecastVal, forecastColor) : '') +
            '</div></div>';
        }
        var heightPct = ((v - scaleMin) / range) * 100;
        var zeroPct = ((0 - scaleMin) / range) * 100;
        var barTop = v >= 0 ? (100 - heightPct) : (100 - zeroPct);
        var barHeight = Math.abs(heightPct - zeroPct);
        var targetTopPct = (t != null && !targetIsForecast) ? 100 - ((t - scaleMin) / range) * 100 : null;
        var t2TopPctActualBranch = (t2 != null) ? 100 - ((t2 - scaleMin) / range) * 100 : null;
        var t2LineHtmlActualBranch = (t2 != null) ? '<div class="oc-cum-target-line" style="top:' + t2TopPctActualBranch.toFixed(1) + '%; border-top-color:' + t2Color + ';" title="' + t2Label + ' — ' + metric.fmt(t2) + '"></div>' : '';
        var barBg = isForecast ? 'repeating-linear-gradient(45deg, ' + metric.color + ', ' + metric.color + ' 4px, transparent 4px, transparent 8px)' : (v < 0 ? 'var(--oc-negative)' : metric.color);
        return '<div class="oc-cum-col">' + stackedLabelHtml(v, (targetTopPct != null ? t : null), (t2 != null ? t2 : null)) +
          '<div class="oc-cum-bar-wrap">' +
            (targetTopPct != null ? '<div class="oc-cum-target-line" style="top:' + targetTopPct.toFixed(1) + '%;" title="' + targetLabel + ' — ' + metric.fmt(t) + '"></div>' : '') +
            t2LineHtmlActualBranch +
            '<div class="oc-cum-bar" style="height:' + barHeight.toFixed(1) + '%; top:' + barTop.toFixed(1) + '%; position:absolute; left:50%; transform:translateX(-50%); width:100%; max-width:34px; background:' + barBg + ';" title="' + (isForecast ? 'Forecast — ' : '') + metric.fmt(v) + '"></div>' +
          '</div></div>';
      }).join('');
      var monthRowHtml = months.map(function (m) {
        return '<div class="oc-cum-month-col"><div class="oc-cum-month-label" style="font-size:' + sizes.month + 'px;">' + MONTH_NAMES[m.getMonth()] + '</div><div class="oc-cum-year-label" style="font-size:' + sizes.year + 'px;">' + m.getFullYear() + '</div></div>';
      }).join('');
      var hasNegativeVal = vals.some(function (v) { return v < 0; });
      var legend = '<div class="oc-legend"><span class="sw"><span class="oc-sw-box" style="background:' + metric.color + ';"></span>' + actualLabel + '</span>' +
        (hasNegativeVal ? '<span class="sw"><span class="oc-sw-box" style="background:var(--oc-negative);"></span>' + actualLabel + ' (negative)</span>' : '') +
        (hasTargetData ? '<span class="sw"><span class="oc-sw-dash" style="border-color:' + targetColor + ';"></span>' + targetLabel + '</span>' : '') +
        (hasTarget2Data ? '<span class="sw"><span class="oc-sw-dash" style="border-color:' + t2Color + ';"></span>' + t2Label + '</span>' : '') + '</div>';
      return legend + '<div class="oc-cum-row">' + barsHtml + '</div><div class="oc-cum-month-row">' + monthRowHtml + '</div>';
    }

    // ---- Parsers: reshape Power BI's executeQueries rows into the exact
    // field names the ported Apps Script page logic expects (Phase 1 will
    // widen the underlying DAX queries further; these already emit
    // compatible shapes for what's queried today). ----
    function parseRevenueRows(rows) {
      return rows.map(function (r) {
        return {
          month_date: parseDate(r["data_revenue_target[month_date]"]),
          entity: r["data_revenue_target[entity]"],
          total_revenue: r["[Revenue]"],
          revenue_target: r["[RevenueTarget]"],
        };
      }).filter(function (r) { return r.month_date; });
    }
    function parseProjectRows(rows) {
      return rows.map(function (r) {
        return {
          month_date: parseDate(r["data_powerbi_unified_fact[month_date]"]),
          entity: r["data_powerbi_unified_fact[entity]"],
          client_industry: r["data_powerbi_unified_fact[client_industry]"] || "Unspecified",
          client_name: r["data_powerbi_unified_fact[client_name]"] || "Unknown",
          project_name: r["data_powerbi_unified_fact[Project_Name]"] || "Unspecified",
          project_stream: r["data_powerbi_unified_fact[project_stream]"] || "Unspecified",
          total_revenue: r["[TotalRevenue]"] || 0,
          gross_margin: r["[GrossMargin]"] || 0,
          headcount: r["[Headcount]"] || 0,
          total_days: r["[TotalDays]"] || 0,
        };
      }).filter(function (r) { return r.month_date; });
    }
    function parseDealRows(rows) {
      return rows.map(function (r) {
        return {
          Company: r["[Company]"],
          Omnia_Company: r["[OmniaCompany]"],
          Deal_Name: r["[DealName]"] || r["[Company]"] || "Deal",
          Confidence: r["[Confidence]"] || "Unspecified",
          Deal_Stage: r["[DealStage]"],
          Close_Date: r["[CloseDate]"],
          Amount: r["[Amount]"] || 0,
          Open_Date: r["[OpenDate]"],
          Last_Updated: r["[LastUpdated]"],
          Deal_Probability: r["[DealProbability]"],
          Deal_Lost_Reason: r["[DealLostReason]"] || "",
          Is_Stalled: r["[IsStalled]"],
          Stage_Entered_Date: r["[StageEnteredDate]"],
          Weighted_Open_Pipeline: r["[WeightedOpenPipeline]"] || 0,
          Alliance_Partners: r["[AlliancePartners]"] || "",
          Logged_In_Partner_Portal: r["[LoggedInPartnerPortal]"] || "",
        };

      return Object.keys(set).length;
    }
    function monthlyAverage(rows, months, dateField, entityField, computeFn) {
      if (!months.length) return null;
      var total = 0;
      months.forEach(function (m) { total += computeFn(rowsForMonths(rows, dateField, entityField, [m])); });
      return total / months.length;
    }
    function utilPctSafe(rows) {
      var invoiced = rows.reduce(function (s, r) { return s + (Number(r.invoiced_days) || 0); }, 0);
      var available = rows.reduce(function (s, r) { return s + (Number(r.available_days) || 0); }, 0);
      return available ? (invoiced / available) * 100 : null;
    }
    function avgDailyRateSafe(rows) {
      var invoiced = rows.reduce(function (s, r) { return s + (Number(r.invoiced_days) || 0); }, 0);
      var amount = rows.reduce(function (s, r) { return s + (Number(r.billed_amount) || 0); }, 0);
      return invoiced ? amount / invoiced : null;
    }
    function billableFteForMonths(monthsSet) {
      var rows = rowsForMonths(RAW.utilisation || [], 'month', 'Omnia_Company', monthsSet);
      var hasFte = rows.some(function (r) { return r.fte != null && r.fte !== ''; });
      return hasFte ? rows.reduce(function (s, r) { return s + (Number(r.fte) || 0); }, 0) : null;
    }
    function utilPctForMonths(monthsSet) {
      if (monthsSet.length === 1 && isMonthInProgress(monthsSet[0])) return null;
      return utilPctSafe(rowsForMonths(RAW.utilisation || [], 'month', 'Omnia_Company', monthsSet));
    }
    function avgDailyRateForMonths(monthsSet) {
      if (monthsSet.length === 1 && isMonthInProgress(monthsSet[0])) return null;
      return avgDailyRateSafe(rowsForMonths(RAW.utilisation || [], 'month', 'Omnia_Company', monthsSet));
    }

    // ---- data_pl summary (empty until Phase 1 adds the query — every
    // consumer below already treats a null/missing field as "no target/
    // actual available yet" rather than assuming zero) ----
    var PL_OPEX_CATEGORIES = [
      { key: 'wages_salaries_indirect', label: 'Wages & salaries (indirect)' },
      { key: 'employee_benefits', label: 'Employee benefits' },
      { key: 'sales_marketing', label: 'Sales & marketing' },
      { key: 'travel_expenses', label: 'Travel expenses' },
      { key: 'administrative_expenses', label: 'Administrative expenses' },
      { key: 'rent_expense', label: 'Rent expense' },
      { key: 'recruitment_expense', label: 'Recruitment expense' },
      { key: 'other_operating_expenses', label: 'Other operating expenses' },
    ];
    function plSum(rows, field) { return rows.reduce(function (s, r) { return s + (Number(r[field]) || 0); }, 0); }
    function plSumAbs(rows, field) { return rows.reduce(function (s, r) { return s + Math.abs(Number(r[field]) || 0); }, 0); }
    function plSumAbsOrNull(rows, field) {
      var anyPresent = rows.some(function (r) { return r[field] != null && r[field] !== ''; });
      return anyPresent ? plSumAbs(rows, field) : null;
    }
    function plAvgPct(rows, field) {
      var vals = rows.map(function (r) { return r[field]; }).filter(function (v) { return v != null && v !== '' && !isNaN(Number(v)); });
      if (!vals.length) return null;
      return (vals.reduce(function (s, v) { return s + Number(v); }, 0) / vals.length) * 100;
    }
    function plAvg(rows, field) {
      var vals = rows.map(function (r) { return r[field]; }).filter(function (v) { return v != null && v !== '' && !isNaN(Number(v)); });
      if (!vals.length) return null;
      return vals.reduce(function (s, v) { return s + Number(v); }, 0) / vals.length;
    }
    function computePlCoreFromRows(rows) {
      if (!rows.length) return null;
      function plSumOrNull(field) {
        var anyPresent = rows.some(function (r) { return r[field] != null && r[field] !== ''; });
        return anyPresent ? plSum(rows, field) : null;
      }
      var revenueActual = plSumOrNull('revenue_actual');
      var gpActual = plSumOrNull('gross_margin_actual');
      var grossMarginPctActual = (revenueActual && gpActual != null) ? (gpActual / revenueActual) * 100 : null;
      var directCostsActual = plSumAbsOrNull(rows, 'direct_costs_actual');
      var directCostsForecast = plSumAbsOrNull(rows, 'direct_costs_forecast');
      var opexActual = plSumAbsOrNull(rows, 'operating_expenses_actual');
      var opexForecast = plSumAbsOrNull(rows, 'operating_expenses_forecast');
      var revenueBudget = plSumOrNull('revenue_budget');
      var gpBudget = plSumOrNull('gp_budget');
      var ebitdaBudget = plSumOrNull('ebitda_budget');
      var grossMarginPctBudget = (revenueBudget && gpBudget != null) ? (gpBudget / revenueBudget) * 100 : null;
      var gpForecast = plSumOrNull('gross_margin_forecast');
      var grossMarginPctForecast = (revenueBudget && gpForecast != null) ? (gpForecast / revenueBudget) * 100 : null;
      var ebitdaActual = plSumOrNull('ebitda_actual');
      var ebitdaPctActual = (revenueActual && ebitdaActual != null) ? (ebitdaActual / revenueActual) * 100 : null;
      var ebitdaPctBudget = (revenueBudget && ebitdaBudget != null) ? (ebitdaBudget / revenueBudget) * 100 : null;
      var categories = PL_OPEX_CATEGORIES.map(function (c) {
        return { key: c.key, label: c.label, actual: plSumAbsOrNull(rows, c.key + '_actual'), forecast: plSumAbsOrNull(rows, c.key + '_forecast') };
      });
      return {
        revenueActual: revenueActual, revenueBudget: revenueBudget,
        gpActual: gpActual, gpBudget: gpBudget, gpForecast: gpForecast,
        grossMarginPctActual: grossMarginPctActual, grossMarginPctBudget: grossMarginPctBudget, grossMarginPctForecast: grossMarginPctForecast,
        directCostsActual: directCostsActual, directCostsForecast: directCostsForecast,
        opexActual: opexActual, opexForecast: opexForecast,
        ebitdaActual: ebitdaActual, ebitdaBudget: ebitdaBudget,
        ebitdaPctActual: ebitdaPctActual, ebitdaPctBudget: ebitdaPctBudget,
        utilisationPctBudget: plAvgPct(rows, 'utilisation_budget'),
        headcountBudget: plAvg(rows, 'headcount_budget'),
        dailyRateBudget: plAvg(rows, 'daily_rate_budget'),
        categories: categories,
      };
    }
    function plSummaryForMonths(monthsSet) {
      return computePlCoreFromRows(rowsForMonths(RAW.pl || [], 'month', 'Omnia_Company', monthsSet));
    }

    // ---- Takeaways page ----
    function computeKpis() {
      var cmp = comparisonBounds();

      var revActual = revenueActualForMonths(cardMonths());
      var revCmpActual = revenueActualForMonths(cardComparisonMonths());
      var revDeltaPct = revCmpActual ? ((revActual - revCmpActual) / revCmpActual) * 100 : null;

      var plCur = plSummaryForMonths(cardMonths());

          marginBadge = signedPts(marginDeltaPts) + (marginRelPct != null ? ' (' + fmtDelta(marginRelPct) + ')' : '') + ' ' + COMPARE_PREFIX[STATE.compareBasis].toLowerCase();
          marginGood = marginDeltaPts > 0 ? true : marginDeltaPts < 0 ? false : 'neutral';
        }

        var marginTargetRelPct = plCur.grossMarginPctBudget ? (marginTargetDeltaPts / plCur.grossMarginPctBudget) * 100 : null;
        marginTargetBadge = signedPts(marginTargetDeltaPts) + (marginTargetRelPct != null ? ' (' + fmtDelta(marginTargetRelPct) + ')' : '') + ' vs target';
        marginTargetGood = marginTargetDeltaPts > 0 ? true : marginTargetDeltaPts < 0 ? false : 'neutral';
      }

      var clientsAvg = monthlyAverage(RAW.unifiedFact || [], cardMonths(), 'month_date', 'entity', activeClientCount);

          var clientsDeltaAbs = clientsAvg - clientsCmpAvg;
          var clientsDeltaPct = (clientsDeltaAbs / clientsCmpAvg) * 100;
          clientsBadge = signedCount(clientsDeltaAbs, 1) + ' (' + fmtDelta(clientsDeltaPct) + ') ' + COMPARE_PREFIX[STATE.compareBasis].toLowerCase();
          clientsGood = clientsDeltaPct > 0 ? true : clientsDeltaPct < 0 ? false : 'neutral';
        }
      }

      var fteAvg = billableFteForMonths(cardMonths());
      var fteBadge = null, fteGood = null;
      if (cmp) {
        var fteCmpAvg = billableFteForMonths(cardComparisonMonths());
        if (fteAvg != null && fteCmpAvg) {
          var fteDeltaAbs = fteAvg - fteCmpAvg;
          var fteDeltaPct = (fteDeltaAbs / fteCmpAvg) * 100;
          fteBadge = signedCount(fteDeltaAbs, 1) + ' (' + fmtDelta(fteDeltaPct) + ') ' + COMPARE_PREFIX[STATE.compareBasis].toLowerCase();
          fteGood = fteDeltaPct > 0 ? true : fteDeltaPct < 0 ? false : 'neutral';
        }
      }
      var fteTargetBadge = null, fteTargetGood = null;
      if (fteAvg != null && plCur && plCur.headcountBudget != null && plCur.headcountBudget) {
        var fteTargetDeltaAbs = fteAvg - plCur.headcountBudget;
        var fteTargetDeltaPct = (fteTargetDeltaAbs / plCur.headcountBudget) * 100;
        fteTargetBadge = signedCount(fteTargetDeltaAbs, 1) + ' (' + fmtDelta(fteTargetDeltaPct) + ') vs target';

        var utilTargetDeltaPts = utilPct - plCur.utilisationPctBudget;
        var utilTargetRelPct = plCur.utilisationPctBudget ? (utilTargetDeltaPts / plCur.utilisationPctBudget) * 100 : null;
        utilTargetBadge = signedPts(utilTargetDeltaPts) + (utilTargetRelPct != null ? ' (' + fmtDelta(utilTargetRelPct) + ')' : '') + ' vs target';
        utilTargetGood = utilTargetDeltaPts > 0 ? true : utilTargetDeltaPts < 0 ? false : 'neutral';
      }

      var revBadge = (revDeltaPct != null && revCmpActual) ? signedCurrency(revActual - revCmpActual) + ' (' + fmtDelta(revDeltaPct) + ') ' + COMPARE_PREFIX[STATE.compareBasis].toLowerCase() : null;
      var revGood = revDeltaPct != null ? (revDeltaPct > 0 ? true : revDeltaPct < 0 ? false : 'neutral') : null;
      var revTargetForCard = revenueTargetForMonths(cardMonths());
      var revTargetBadge = null, revTargetGood = null;
      if (revActual != null && revTargetForCard) {

        revTargetBadge = signedCurrency(revGapDollar) + ' (' + fmtDelta(revGapPct) + ') vs target';

        { label: 'Utilisation', value: utilPct != null ? fmtPct(utilPct) : '—', deltaLabel: utilBadge, good: utilGood, targetLabel: utilTargetBadge, targetGood: utilTargetGood, caption: utilCaption, nav: 'utilisation' },
        { label: 'Gross margin %', value: marginPct != null ? fmtPct(marginPct) : '—', deltaLabel: marginBadge, good: marginGood, targetLabel: marginTargetBadge, targetGood: marginTargetGood, caption: cardPeriodLabelText(), nav: 'margins' },
        { label: 'Active clients', value: clientsAvg != null ? Math.round(clientsAvg) : '—', deltaLabel: clientsBadge, good: clientsGood, caption: cardPeriodLabelText(), nav: 'clients' },
        { label: 'Billable FTE', value: fteAvg != null ? fteAvg.toFixed(1) : '—', deltaLabel: fteBadge, good: fteGood, targetLabel: fteTargetBadge, targetGood: fteTargetGood, caption: cardPeriodLabelText(), nav: 'utilisation' },

    function renderKpiGrid() {

    function computeCumulativeBars() {

      return fyMonths.map(function (m) {
        var monthRevenue = revenueActualForMonths([m]) || 0;
        var monthTarget = revenueTargetForMonths([m]) || 0;

      });

    function renderCumulativeRevenueChart() {

      var bars = computeCumulativeBars();
      var maxVal = Math.max.apply(null, bars.map(function (x) { return Math.max(x.cumRevenue, x.cumTarget); }).concat([1]));
      var sizes = chartLabelSizes(bars.length);

      var actualToDate = bars.length ? bars[bars.length - 1].cumRevenue : 0;
      var targetForPeriod = bars.length ? bars[bars.length - 1].cumTarget : 0;
      var gapDollar = targetForPeriod ? actualToDate - targetForPeriod : null;
      var gapPct = targetForPeriod ? ((actualToDate - targetForPeriod) / targetForPeriod) * 100 : null;
      var gapGood = gapPct == null ? null : gapPct > 0 ? true : gapPct < 0 ? false : 'neutral';
      var gapLabel = (gapDollar != null && gapPct != null) ? signedCurrency(gapDollar) + ' (' + fmtDelta(gapPct) + ')' : '—';

      var cardsHtml = '<div style="display:flex; gap:14px; margin-bottom:14px; flex-wrap:wrap;">' +
        '<div style="background:var(--bg-muted); border-radius:var(--radius-lg); padding:14px 16px; flex:1; min-width:150px;"><div class="oc-kpi-label" style="margin-bottom:6px;">Actual to date</div><div style="font-size:20px; font-weight:800;">' + fmtCurrency(actualToDate) + '</div></div>' +
        '<div style="background:var(--bg-muted); border-radius:var(--radius-lg); padding:14px 16px; flex:1; min-width:150px;"><div class="oc-kpi-label" style="margin-bottom:6px;">Target for period</div><div style="font-size:20px; font-weight:800;">' + fmtCurrency(targetForPeriod) + '</div></div>' +
        '<div style="background:var(--bg-muted); border-radius:var(--radius-lg); padding:14px 16px; flex:1; min-width:150px;"><div class="oc-kpi-label" style="margin-bottom:6px;">Gap to target</div><div style="font-size:20px; font-weight:800;"><span class="oc-badge ' + (gapGood === false ? 'down' : gapGood === 'neutral' ? 'neutral' : 'up') + '" style="font-size:16px;">' + gapLabel + '</span></div></div></div>';

      var barsHtml = bars.map(function (x) {

        var xGapDollar = x.cumTarget ? x.cumRevenue - x.cumTarget : null;

        var xGapLabel = (xGapDollar != null && xGapPct != null) ? signedCurrency(xGapDollar) + ' (' + fmtDelta(xGapPct) + ')' : '—';
        var stackedLabel = '<div class="oc-cum-label" style="font-size:' + sizes.value + 'px; line-height:1.4;">' +

          (xGapPct != null ? '<br><span class="oc-badge ' + xGapClass + '" style="font-size:' + Math.max(sizes.value - 1, 9) + 'px; padding:1px 5px;">' + xGapLabel + '</span>' : '') + '</div>';
        return '<div class="oc-cum-col">' + stackedLabel +

            '<div class="oc-cum-bar" style="height:' + heightPct.toFixed(1) + '%;"><div class="oc-cum-bar-seg" style="height:' + monthSegPct.toFixed(1) + '%; ' + segStyle + '" title="' + (inProgress ? 'Known — month still in progress' : '') + '"></div></div>' +
          '</div></div>';

    }

    var SMALL_MULTIPLES = [
      { key: 'utilisation', label: 'Utilisation', color: 'var(--oc-deep-teal)', fmt: fmtPct },

    function renderTakeawaysPage() {
      var bars = computeCumulativeBars();

      takeawaysCsvRows.push(['Month', 'Revenue', 'Target', 'Cumulative revenue', 'Cumulative target']);

          takeawaysCsvRows.push(['Month', metric.label]);
          b.months.forEach(function (m) {
            var v = metric.key === 'utilisation' ? utilPctForMonths([m])
              : metric.key === 'fte' ? billableFteForMonths([m])
              : metric.key === 'margin' ? (function () { var pl = plSummaryForMonths([m]); return pl ? pl.grossMarginPctActual : null; })()
              : (function () { var rows = rowsForMonths(RAW.unifiedFact || [], 'month_date', 'entity', [m]); return rows.length ? activeClientCount(rows) : null; })();

    function buildDriverBridge(order, vals, curValue, cmpValue) {

      function subDetailFor(country) {

    function flattenLocationHierarchy(hierarchy, cmpHierarchy) {

      return plNote + cardsHtml +
        '<section class="oc-panel">' + panelHeadWithToolsAndExtra(marginsTrendTitle, 'marginsTrend', marginsTrendExtraPill) +
          (b ? (showingEbitdaTrend
            ? renderBarTrendChart({ label: '', color: '#D98C4A', fmt: fmtCurrencyCompact, targetLabel: 'Target' }, ebitdaActualSeries, b.months, ebitdaTargetSeries)
            : renderBarTrendChart({ label: '', color: 'var(--oc-mid-teal)', fmt: fmtCurrencyCompact, targetLabel: 'Target' }, marginActualSeries, b.months, marginBudgetSeries, null, marginForecastSeries, 'Forecast')) : '') +
        '</section>';
    }

    // ---- Cost page ----
    function plCategoryVal(p, key, field) {
      if (!p || !p.categories) return null;
      var cat = p.categories.filter(function (c) { return c.key === key; })[0];
      return cat ? cat[field] : null;
    }
    var COST_METRIC_OPTIONS = [{ key: 'directCosts', label: 'Direct costs' }, { key: 'indirectCosts', label: 'Indirect costs' }, { key: 'employeeBenefits', label: 'Employee benefits' }, { key: 'opex', label: 'Opex' }];
    function renderCostPage() {
      var b = periodBounds();
      var cardPl = plSummaryForMonths(cardMonths());
      var cmpPl = plSummaryForMonths(cardComparisonMonths());
      if (!cardPl) return renderNotReadyPanel('Cost', 'No data_pl rows found for ' + cardPeriodLabelText() + ' yet — this page reads from the data_pl query, which is new and not yet verified against the live semantic model.');

      function pctBadgeC(cur, cmp, suffix) {
        if (cur == null || !cmp) return '';
        var diff = cur - cmp, d = (diff / cmp) * 100;
        return '<span class="oc-badge ' + (d > 0 ? 'up' : d < 0 ? 'down' : 'neutral') + '">' + signedCurrency(diff) + ' (' + fmtDelta(d) + ') ' + suffix + '</span>';
      }
      var cardsHtml = '<section class="oc-kpi-grid">' +
        '<div class="oc-kpi-card"><div class="oc-kpi-label">Direct costs</div><div class="oc-kpi-value">' + (cardPl.directCostsActual != null ? fmtCurrency(cardPl.directCostsActual) : '—') + '</div><div class="oc-kpi-delta-row">' + pctBadgeC(cardPl.directCostsActual, cmpPl ? cmpPl.directCostsActual : null, COMPARE_PREFIX[STATE.compareBasis].toLowerCase()) + '</div><div class="oc-caption" style="margin-top:6px;">' + cardPeriodLabelText() + '</div></div>' +
        '<div class="oc-kpi-card"><div class="oc-kpi-label">Indirect costs</div><div class="oc-kpi-value">' + (plCategoryVal(cardPl, 'wages_salaries_indirect', 'actual') != null ? fmtCurrency(plCategoryVal(cardPl, 'wages_salaries_indirect', 'actual')) : '—') + '</div><div class="oc-kpi-delta-row">' + pctBadgeC(plCategoryVal(cardPl, 'wages_salaries_indirect', 'actual'), plCategoryVal(cmpPl, 'wages_salaries_indirect', 'actual'), COMPARE_PREFIX[STATE.compareBasis].toLowerCase()) + '</div><div class="oc-caption" style="margin-top:6px;">' + cardPeriodLabelText() + '</div></div>' +
        '<div class="oc-kpi-card"><div class="oc-kpi-label">Employee benefits</div><div class="oc-kpi-value">' + (plCategoryVal(cardPl, 'employee_benefits', 'actual') != null ? fmtCurrency(plCategoryVal(cardPl, 'employee_benefits', 'actual')) : '—') + '</div><div class="oc-kpi-delta-row">' + pctBadgeC(plCategoryVal(cardPl, 'employee_benefits', 'actual'), plCategoryVal(cmpPl, 'employee_benefits', 'actual'), COMPARE_PREFIX[STATE.compareBasis].toLowerCase()) + '</div><div class="oc-caption" style="margin-top:6px;">' + cardPeriodLabelText() + '</div></div>' +
        '<div class="oc-kpi-card"><div class="oc-kpi-label">Opex</div><div class="oc-kpi-value">' + fmtCurrency(cardPl.opexActual) + '</div><div class="oc-kpi-delta-row">' + pctBadgeC(cardPl.opexActual, cmpPl ? cmpPl.opexActual : null, COMPARE_PREFIX[STATE.compareBasis].toLowerCase()) + '</div><div class="oc-caption" style="margin-top:6px;">' + cardPeriodLabelText() + '</div></div></section>';

      if (!STATE.costMetricView) STATE.costMetricView = 'directCosts';
      var costMetricConfig = {
        directCosts: { title: 'Direct costs', color: 'var(--oc-mint-deep)', fmt: fmtCurrencyCompact, target2Label: 'Forecast', actual: function (p) { return p.directCostsActual; }, target2: function (p) { return p.directCostsForecast; } },
        indirectCosts: { title: 'Indirect costs', color: '#6B5B95', fmt: fmtCurrencyCompact, target2Label: 'Forecast', actual: function (p) { return plCategoryVal(p, 'wages_salaries_indirect', 'actual'); }, target2: function (p) { return plCategoryVal(p, 'wages_salaries_indirect', 'forecast'); } },
        employeeBenefits: { title: 'Employee benefits', color: '#B76E79', fmt: fmtCurrencyCompact, target2Label: 'Forecast', actual: function (p) { return plCategoryVal(p, 'employee_benefits', 'actual'); }, target2: function (p) { return plCategoryVal(p, 'employee_benefits', 'forecast'); } },
        opex: { title: 'Opex', color: 'var(--oc-deep-teal)', fmt: fmtCurrencyCompact, target2Label: 'Forecast', actual: function (p) { return p.opexActual; }, target2: function (p) { return p.opexForecast; } },
      };
      var costCfg = costMetricConfig[STATE.costMetricView];
      var costActualSeries = b ? b.months.map(function (m) { var p = plSummaryForMonths([m]); return p ? costCfg.actual(p) : null; }) : [];
      var costTarget2Series = b ? b.months.map(function (m) { var p = plSummaryForMonths([m]); return p ? costCfg.target2(p) : null; }) : [];
      registerDownload('costMetricTrend', 'cost-' + STATE.costMetricView + '-trend-' + fileSlug() + '.csv', ['Month', 'Actual', costCfg.target2Label],
        (b ? b.months : []).map(function (m, i) { return [monthYearLabel(m), costActualSeries[i] != null ? costActualSeries[i].toFixed(2) : '', costTarget2Series[i] != null ? costTarget2Series[i].toFixed(2) : '']; }));
      var costExtraPill = renderPillToggle(COST_METRIC_OPTIONS, 'costMetricView');
      var costTrendHtml = '<section class="oc-panel">' + panelHeadWithToolsAndExtra(costCfg.title, 'costMetricTrend', costExtraPill) +
        (b ? renderBarTrendChart({ label: '', color: costCfg.color, fmt: costCfg.fmt, targetLabel: costCfg.targetLabel }, costActualSeries, b.months, null, null, costTarget2Series, costCfg.target2Label) : '') + '</section>';

      var categoryRowsAll = cardPl.categories;
      var categoryRowsActual = categoryRowsAll.map(function (c) { return { label: c.label, value: c.actual || 0 }; }).sort(function (a, b) { return b.value - a.value; });
      var categoryCmpMap = {};
      categoryRowsAll.forEach(function (c) { if (c.forecast != null) categoryCmpMap[c.label] = c.forecast; });
      var cmpPlForCategory = plSummaryForMonths(cardComparisonMonths());
      var categoryCmp2Map = {};
      if (cmpPlForCategory) cmpPlForCategory.categories.forEach(function (c) { if (c.actual != null) categoryCmp2Map[c.label] = c.actual; });
      registerDownload('costByCategory', 'opex-by-category-' + fileSlug() + '.csv', ['Category', 'Actual', 'Forecast', COMPARE_PREFIX[STATE.compareBasis]],
        categoryRowsAll.map(function (c) { return [c.label, c.actual != null ? c.actual.toFixed(2) : '', c.forecast != null ? c.forecast.toFixed(2) : '', categoryCmp2Map[c.label] != null ? categoryCmp2Map[c.label].toFixed(2) : '']; }));
      var categoryHtml = '<section class="oc-panel"><h3 class="oc-panel-title">Opex by category</h3><div class="oc-panel-sub" style="margin-bottom:12px;">' + cardPeriodLabelText() + '</div>' +
        renderBarList(categoryRowsActual, fmtCurrency, categoryCmpMap, '#D98C4A', 'Forecast', categoryCmp2Map, COMPARE_PREFIX[STATE.compareBasis], true) + '</section>';

      var plDataNote = '<div class="oc-note" style="margin-bottom:16px; border-left:3px solid var(--oc-coral); padding-left:12px; background:#fff;">&#9888; This page reads from the data_pl query, which is new and not yet verified against the live semantic model.</div>';
      return plDataNote + cardsHtml + costTrendHtml + categoryHtml;
    }

    // ---- Page dispatch (Phase 2 will replace each remaining placeholder
    // with a real ported render*Page function, one nav item at a time) ----
    function goToPage(pageKey) {
      STATE.page = pageKey;
      renderHeader(ENTITIES);
      renderPage();
    }
    function renderPage() {
      var el = document.getElementById('oc-content');
      CURRENT_DOWNLOADS = {};
      if (STATE.page === 'takeaways') {
        el.innerHTML = renderTakeawaysPage();
      } else if (STATE.page === 'revenue') {
        el.innerHTML = renderRevenuePage();
      } else if (STATE.page === 'clients') {
        el.innerHTML = renderClientsPage();
      } else if (STATE.page === 'deals') {
        el.innerHTML = renderDealsPage();
      } else if (STATE.page === 'utilisation') {
        el.innerHTML = renderUtilisationPage();
      } else if (STATE.page === 'certifications') {
        el.innerHTML = renderCertificationsPage();
      } else if (STATE.page === 'projects') {
        el.innerHTML = renderProjectsPage();
      } else if (STATE.page === 'employees') {
        el.innerHTML = renderEmployeesPage();
      } else if (STATE.page === 'margins') {
        el.innerHTML = renderMarginsPage();
      } else if (STATE.page === 'cost') {
        el.innerHTML = renderCostPage();
      } else {
        var navItem = NAV_ITEMS.filter(function (n) { return n.key === STATE.page; })[0];
        el.innerHTML = renderPlaceholderPage(navItem ? navItem.label : STATE.page);
      }
      wirePillToggles(el);
      wireKpiCards(el);
      wireDownloadButtons(el);
      var cddSelect = el.querySelector('#oc-client-deep-dive-select');
      if (cddSelect) {
        cddSelect.addEventListener('change', function () {
          STATE.clientDeepDiveClient = cddSelect.value;
          renderPage();
        });
      }
    }

    function uniqueEntities(data) {
      var set = {};
      (data.revenueTarget || []).forEach(function (r) { if (r.entity) set[r.entity] = true; });
      (data.unifiedFact || []).forEach(function (r) { if (r.entity) set[r.entity] = true; });
      var real = Object.keys(set).sort();
      return real.length >= 2 ? [COMBINED_ENTITY_LABEL].concat(real) : real;
    }

    function onDataLoaded(data) {
      RAW = data;
      var entities = uniqueEntities(data);
      ENTITIES = entities;
      COMBINED_ENTITIES = entities.filter(function (e) { return e !== COMBINED_ENTITY_LABEL; });
      STATE.entity = entities.indexOf(COMBINED_ENTITY_LABEL) !== -1 ? COMBINED_ENTITY_LABEL : entities[0];

      buildMonthUniverse();
      STATE.selectedMonths = defaultMonthSelection();

      renderHeader(entities);
      renderPage();

      document.addEventListener('click', function (e) {
        var wrap = document.getElementById('oc-period-wrap');
        if (STATE.periodPanelOpen && wrap && !wrap.contains(e.target)) {
          STATE.periodPanelOpen = false;
          renderPeriodPicker();
        }
      });
    }

    async function loadReport(token) {
      document.getElementById("oc-placeholder").style.display = "none";
      document.getElementById("oc-loading").style.display = "block";
      var results = await executeDaxQueries(token, [
        Q_REVENUE_TARGET, Q_PROJECT_FACT, Q_DEALS, Q_UTILISATION, Q_CERTIFICATIONS, Q_PL, Q_EMPLOYEE_ROSTER, Q_REF_PROJECTS,
      ]);
      var data = {
        revenueTarget: parseRevenueRows(results[0]),
        unifiedFact: parseProjectRows(results[1]),
        hubspotDeals: parseDealRows(results[2]),
        utilisation: parseUtilisationRows(results[3]),
        certifications: parseCertRows(results[4]),
        pl: parsePlRows(results[5]),
        employeeRoster: parseEmployeeRosterRows(results[6]),
        refProjects: parseRefProjectsRows(results[7]),
      };
      document.getElementById("oc-loading").style.display = "none";
      document.getElementById("oc-content").style.display = "block";
      onDataLoaded(data);
      document.getElementById("oc-feedback-fab").style.display = "flex";
    }

    function showAccessDenied(email) {
      var placeholder = document.getElementById("oc-placeholder");
      placeholder.innerHTML = escHtml(email) + " isn't on the access list for this dashboard yet.<br>Ask an admin to add you via Manage Access.";
      placeholder.style.display = "block";
      document.getElementById("oc-content").style.display = "none";
    }

    // Checks the access allowlist (Graph token is separate from the Power BI
    // one already acquired for `powerBiToken`), then either loads the report
    // or shows the access-denied placeholder instead. Shared by the manual
    // sign-in button and the silent auto-sign-in attempt below.
    // Returns true only once the report has actually loaded — callers use
    // this to decide whether the sign-in button should stay disabled
    // (fully done) or be re-enabled so a real click can retry (see signIn()
    // and the auto-sign-in IIFE below).
    async function gateAccessAndLoad(account, powerBiToken) {
      var access;
      try {
        var graphToken = await getFeedbackGraphToken();
        access = await checkAccess(graphToken, feedbackWorkbookBasePath(), account.username);
      } catch (e) {
        showError("Could not verify dashboard access: " + (e && e.message ? e.message : e));
        return false;
      }
      if (!access.allowed) {
        showAccessDenied(account.username);
        return false;
      }
      CURRENT_SESSION.email = account.username;
      CURRENT_SESSION.role = access.role;
      STATE.email = account.username;
      STATE.isAccessAdmin = access.role === 'admin';
      document.getElementById("oc-access-btn").style.display = access.role === "admin" ? "flex" : "none";
      await loadReport(powerBiToken);
      return true;
    }

    // ---- Manage access modal wiring ----
    (function () {
      var btn = document.getElementById("oc-access-btn");
      var overlay = document.getElementById("access-modal-overlay");
      var listEl = document.getElementById("access-list");
      var emailInput = document.getElementById("access-add-email");
      var roleSelect = document.getElementById("access-add-role");
      var status = document.getElementById("access-status");
      var saveBtn = document.getElementById("access-save-btn");

      function renderRows(rows) {
        if (!rows.length) {
          listEl.innerHTML = '<div class="oc-caption">No one added yet — you (as a bootstrap admin) are still the only one who can sign in.</div>';
          return;
        }
        listEl.innerHTML = rows.map(function (r) {
          var isSelf = r.email === (CURRENT_SESSION.email || "").toLowerCase();
          var actionBtn = r.status === "active"
            ? (isSelf ? '<span class="oc-caption">(you)</span>' : '<button class="oc-btn oc-btn-danger" data-deactivate="' + escAttr(r.email) + '" style="padding:4px 10px; font-size:11px;">Deactivate</button>')
            : '<span class="oc-caption">Deactivated</span>';
          return '<div class="oc-editor-row"><div>' + escHtml(r.email) + '</div>' +
            '<div style="display:flex; align-items:center; gap:8px;">' +
            '<span class="oc-role-chip' + (r.role === "admin" ? " admin" : "") + '">' + escHtml(r.role) + '</span>' +
            actionBtn + '</div></div>';
        }).join("");
      }

      async function refreshList() {
        listEl.innerHTML = '<div class="oc-caption">Loading…</div>';
        var token = await getFeedbackGraphToken();
        var basePath = feedbackWorkbookBasePath();
        await ensureAccessUsersTable(token, basePath);
        var rows = await fetchAccessUsersRows(token, basePath);
        renderRows(rows);
      }

      function openModal() {
        emailInput.value = "";
        roleSelect.value = "user";
        status.textContent = "";
        status.className = "oc-ask-status";
        overlay.classList.add("open");
        refreshList().catch(function (e) {
          listEl.innerHTML = '<div class="oc-ask-status oc-ask-error">' + escHtml(e && e.message ? e.message : String(e)) + "</div>";
        });
      }
      function closeModal() { overlay.classList.remove("open"); }

      btn.addEventListener("click", openModal);
      document.getElementById("access-close-btn").addEventListener("click", closeModal);
      document.getElementById("access-close-btn-2").addEventListener("click", closeModal);
      overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });

      saveBtn.addEventListener("click", async function () {
        var email = emailInput.value.trim();
        if (!email) {
          status.textContent = "Enter an email first.";
          status.className = "oc-ask-status oc-ask-error";
          return;
        }
        saveBtn.disabled = true;
        status.textContent = "";
        status.className = "oc-ask-status";
        try {
          var token = await getFeedbackGraphToken();
          var basePath = feedbackWorkbookBasePath();
          await upsertAccessUser(token, basePath, email, roleSelect.value, CURRENT_SESSION.email);
          emailInput.value = "";
          status.textContent = "Added to the app's access list.";
          status.className = "oc-ask-status oc-ask-ok";
          await refreshList();

          // Also grant real Power BI workspace access (Viewer) — the
          // AccessUsers entry above only gates this app's own UI, it
          // doesn't give them any actual data access on its own. Best-effort:
          // requires the current user to already be a Power BI workspace
          // admin themselves, so a failure here shouldn't undo the
          // already-saved AccessUsers entry.
          try {
            var pbiToken = await getPowerBiAdminToken();
            await addUserToPowerBiWorkspace(pbiToken, email);
            status.textContent = "Added to the app's access list and the Power BI workspace (Viewer).";
          } catch (pbiErr) {
            status.textContent = "Added to the app's access list, but could not add to the Power BI workspace: " +
              (pbiErr && pbiErr.message ? pbiErr.message : String(pbiErr)) +
              ". They may need to be added there separately (e.g. if you're not a workspace admin, or they already have access).";
            status.className = "oc-ask-status oc-ask-error";
          }
        } catch (e) {
          status.textContent = (e && e.message) ? e.message : String(e);
          status.className = "oc-ask-status oc-ask-error";
        } finally {
          saveBtn.disabled = false;
        }
      });

      listEl.addEventListener("click", async function (e) {
        var target = e.target.closest("[data-deactivate]");
        if (!target) return;
        var email = target.getAttribute("data-deactivate");
        target.disabled = true;
        target.textContent = "Deactivating…";
        status.textContent = "";
        status.className = "oc-ask-status";
        try {
          var token = await getFeedbackGraphToken();
          var basePath = feedbackWorkbookBasePath();
          await deactivateAccessUser(token, basePath, email);
          status.textContent = "Removed from the app's access list.";
          status.className = "oc-ask-status oc-ask-ok";
          await refreshList();

          // Mirrors the "Add" flow: also revoke real Power BI workspace
          // access, not just this app's own gate. Best-effort, same caveat
          // as Add — requires the caller to already be a workspace admin.
          try {
            var pbiToken = await getPowerBiAdminToken();
            await removeUserFromPowerBiWorkspace(pbiToken, email);
            status.textContent = "Removed from the app's access list and the Power BI workspace.";
          } catch (pbiErr) {
            status.textContent = "Removed from the app's access list, but could not remove from the Power BI workspace: " +
              (pbiErr && pbiErr.message ? pbiErr.message : String(pbiErr)) +
              ". They may still have real data access there until removed manually.";
            status.className = "oc-ask-status oc-ask-error";
          }
        } catch (e2) {
          status.textContent = (e2 && e2.message) ? e2.message : String(e2);
          status.className = "oc-ask-status oc-ask-error";
        }
      });
    })();

    // ---- Feedback modal wiring ----
    (function () {
      var fab = document.getElementById("oc-feedback-fab");
      var overlay = document.getElementById("feedback-modal-overlay");
      var textarea = document.getElementById("feedback-message");
      var status = document.getElementById("feedback-status");
      var sendBtn = document.getElementById("feedback-send-btn");

      function openModal() {
        textarea.value = "";
        status.textContent = "";
        status.className = "oc-ask-status";
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
        overlay.classList.add("open");
        textarea.focus();
      }
      function closeModal() { overlay.classList.remove("open"); }

      fab.addEventListener("click", openModal);
      document.getElementById("feedback-close-btn").addEventListener("click", closeModal);
      document.getElementById("feedback-cancel-btn").addEventListener("click", closeModal);
      overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });

      sendBtn.addEventListener("click", async function () {
        var message = textarea.value.trim();
        if (!message) {
          status.textContent = "Enter a message first.";
          status.className = "oc-ask-status oc-ask-error";
          return;
        }
        sendBtn.disabled = true;
        sendBtn.textContent = "Sending…";
        status.textContent = "";
        status.className = "oc-ask-status";
        try {
          await submitFeedbackRow(message);
          status.textContent = "Thanks — feedback saved.";
          status.className = "oc-ask-status oc-ask-ok";
          sendBtn.textContent = "Sent";
          setTimeout(closeModal, 1200);
        } catch (e) {
          status.textContent = (e && e.message) ? e.message : String(e);
          status.className = "oc-ask-status oc-ask-error";
          sendBtn.disabled = false;
          sendBtn.textContent = "Send";
        }
      });
    })();

    async function signIn() {
      var btn = document.getElementById("oc-signin-btn");
      btn.disabled = true;
      try {
        var token = await getToken(true);
        var account = msalApp.getAllAccounts()[0];
        setSignedInUi(account);
        // Only stays disabled once the whole gate + load has actually
        // succeeded — re-enabling on false/failure is what lets a second,
        // genuine click retry (and this time be allowed to pop up a
        // consent window) instead of leaving the user stuck.
        var ok = await gateAccessAndLoad(account, token);
        btn.disabled = !!ok;
      } catch (e) {
        showError("Sign-in or data load failed: " + (e && e.message ? e.message : e));
        btn.disabled = false;
      }
    }

    document.getElementById("oc-signin-btn").addEventListener("click", signIn);

    (async function () {
      await msalReady;
      var accounts = msalApp.getAllAccounts();
      if (accounts.length) {
        setSignedInUi(accounts[0]);
        var btn = document.getElementById("oc-signin-btn");
        try {
          var token = await getToken(false);
          var ok = await gateAccessAndLoad(accounts[0], token);
          btn.disabled = !!ok;
        } catch (e) {
          // Fall through to the manual sign-in button — left enabled (the
          // default) specifically so a real click can retry whatever
          // failed here, e.g. a Graph consent popup blocked because this
          // whole attempt ran automatically, with no user gesture, on
          // page load.
        }
      }
    })();
  </script>
</body>
</html>
